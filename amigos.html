<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonne - Amigos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b12;
            --bg-elevated: #12121c;
            --bg-hover: #16162a;
            --border: #1e1e2e;
            --border-hover: #2a2a40;
            --text: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a80;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.2);
            --green: #2ecc71;
            --red: #ff2e5b;
            --font: 'Inter', system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           TOAST NOTIFICATIONS ELEGANTES
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: 100%;
            padding: 0 20px;
            max-width: 420px;
        }

        .toast {
            background: rgba(18, 18, 28, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 12px 22px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            max-width: 100%;
        }

        @keyframes toastIn {
            from { transform: translateY(30px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .toast.out {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastOut {
            to { transform: translateY(20px); opacity: 0; }
        }

        .toast.success {
            border-color: rgba(46, 204, 113, 0.4);
            background: rgba(18, 28, 22, 0.95);
        }

        .toast.success i {
            color: var(--green);
        }

        .toast.error {
            border-color: rgba(255, 46, 91, 0.4);
            background: rgba(28, 18, 22, 0.95);
        }

        .toast.error i {
            color: var(--red);
        }

        .toast.info i {
            color: var(--accent);
        }

        /* ============================================================
           TOP BAR
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 17px;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        .top-bar .logo .z-mark {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #9b4dff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 19px;
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
            letter-spacing: -1px;
        }

        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-bar .actions .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 17px;
            cursor: pointer;
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .top-bar .actions .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .top-bar .actions .icon-btn.active {
            color: var(--accent);
        }

        .top-bar .actions .icon-btn .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--red);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 2px solid var(--bg);
        }

        .top-bar .avatar-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(108, 99, 255, 0.35);
            cursor: pointer;
            margin-left: 4px;
            transition: all 0.2s;
        }

        .top-bar .avatar-mini:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .top-bar .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-bar .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        /* ============================================================
           CONTAINER & HEADER
           ============================================================ */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-header h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h2 i {
            color: var(--accent);
            font-size: 22px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 15px;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 12px 16px 12px 44px;
            color: var(--text);
            font-size: 14.5px;
            font-family: var(--font);
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* ============================================================
           TABS
           ============================================================ */
        .tabs-wrap {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .tabs-wrap::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 1;
            min-width: fit-content;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .tab-btn .tab-badge {
            background: var(--red);
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 20px;
            margin-left: 4px;
        }

        /* ============================================================
           LISTA DE AMIGOS (CARDS)
           ============================================================ */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .friends-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .friend-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 16px;
            transition: all 0.25s;
        }

        .friend-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .friend-card .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            background: var(--accent);
            border: 2px solid transparent;
            transition: border 0.2s;
        }

        .friend-card .avatar:hover {
            border-color: var(--accent);
        }

        .friend-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .friend-card .avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .friend-card .info {
            flex: 1;
            min-width: 0;
        }

        .friend-card .info .name {
            font-weight: 700;
            font-size: 15.5px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-card .info .name:hover {
            color: var(--accent);
        }

        .friend-card .info .username {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Badge "Amigos em comum" */
        .mutual-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.2);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            display: inline-block;
            text-overflow: ellipsis;
        }

        .mutual-badge i {
            font-size: 10px;
            margin-right: 3px;
        }

        .friend-card .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }

        .friend-card .actions button {
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .friend-card .actions button i {
            font-size: 12px;
        }

        /* Botões de ação */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #9b4dff);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border) !important;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-danger {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2) !important;
        }

        .btn-danger:hover {
            background: #ff4757;
            color: #fff;
        }

        .btn-success {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.2) !important;
        }

        .btn-success:hover {
            background: #2ecc71;
            color: #fff;
        }

        /* ============================================================
           SKELETON LOADING
           ============================================================ */
        .sk-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 16px;
        }

        .sk-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(90deg, #1a1a2a 25%, #24243a 50%, #1a1a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            flex-shrink: 0;
        }

        .sk-lines {
            flex: 1;
        }

        .sk-line {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, #1a1a2a 25%, #24243a 50%, #1a1a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 8px;
        }

        .sk-line:last-child {
            margin-bottom: 0;
            width: 60%;
        }

        .sk-btn {
            width: 80px;
            height: 32px;
            border-radius: 20px;
            background: linear-gradient(90deg, #1a1a2a 25%, #24243a 50%, #1a1a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================================
           EMPTY STATE & LOAD MORE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .empty-state .icon-wrapper i {
            font-size: 32px;
            color: rgba(108, 99, 255, 0.4);
        }

        .empty-state h3 {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 13.5px;
        }

        /* Load more */
        .load-more-wrap {
            text-align: center;
            padding: 20px 0;
        }

        .load-more-wrap button {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 12px 28px;
            border-radius: 30px;
            color: var(--text-secondary);
            font-family: var(--font);
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .load-more-wrap button:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            color: var(--text);
        }

        .load-more-wrap button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .load-more-wrap .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(108, 99, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           BOTTOM NAV
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(11, 11, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 4px 0 env(safe-area-inset-bottom, 8px) 0;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 14px;
            transition: all 0.2s;
        }

        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 500;
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }

        .bottom-nav .nav-item:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .bottom-nav .nav-item .nav-icon .plus-circle {
            background: linear-gradient(135deg, var(--accent), #9b4dff);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            margin-top: -14px;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* ============================================================
           USER CARD OVERLAY
           ============================================================ */
        .user-card-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .user-card-overlay.active {
            display: flex;
        }

        .user-card {
            background: var(--bg-elevated);
            border-radius: 28px;
            max-width: 380px;
            width: 100%;
            padding: 32px 24px 24px;
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            animation: cardPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
        }

        @keyframes cardPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-card .close-card {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .user-card .close-card:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .user-card .avatar-large {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 16px;
            border: 3px solid rgba(108, 99, 255, 0.2);
        }

        .user-card .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-card .avatar-large .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            color: #fff;
        }

        .user-card .name {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 2px;
        }

        .user-card .username {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .user-card .bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin: 12px 0 16px;
            line-height: 1.5;
        }

        .user-card .stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 20px;
        }

        .user-card .stats .stat {
            text-align: center;
        }

        .user-card .stats .stat .number {
            font-weight: 800;
            font-size: 18px;
            color: var(--text);
        }

        .user-card .stats .stat .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .user-card .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .user-card .card-actions button {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            flex: 1;
            min-width: 120px;
        }

        @media (max-width: 600px) {
            .friend-card {
                flex-wrap: wrap;
            }
            .friend-card .actions {
                width: 100%;
                margin-top: 8px;
                justify-content: flex-start;
            }
            .friend-card .actions button {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="logo" onclick="window.location.href='feed.html'">
            <div class="z-mark">Z</div>
            Zonne
        </div>
        <div class="actions">
            <button class="icon-btn" onclick="window.location.href='notificacoes.html'">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge" style="display:none;">0</span>
            </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            'use strict';

            const SUPABASE_URL = 'https://cfanqigkvfpigjvjjbon.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmYW5xaWdrdmZwaWdqdmpqYm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzI5NzIsImV4cCI6MjA5OTQ0ODk3Mn0.UDyNusIz7PNaz4-n-Bpgn2LJCUi6fIw6tW0QrsJEii0';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Estado
            let currentUser = null;
            let currentProfile = null;
            let friends = [];
            let pendingRequests = [];
            let sentRequests = [];
            let discoverUsers = [];
            let filteredFriends = [];
            let filteredDiscover = [];
            let followsMap = new Set();
            let mutualsMap = new Map(); // { userId: count }
            let currentTab = 'friends';

            // Paginação
            const PAGE_SIZE = 15;
            let discoverPage = 0;
            let allDiscoverIds = []; // Todos IDs carregados que ainda não estão na lista
            let hasMoreDiscover = false;
            let loadingMore = false;

            const friendsList = document.getElementById('friendsList');
            const requestsList = document.getElementById('requestsList');
            const sentList = document.getElementById('sentList');
            const discoverList = document.getElementById('discoverList');
            const searchInput = document.getElementById('searchInput');
            const loadMoreWrap = document.getElementById('loadMoreWrap');
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            // ============================================================
            // TOAST ELEGANTE
            // ============================================================
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                let icon = 'check-circle';
                if (type === 'error') icon = 'exclamation-circle';
                else if (type === 'info') icon = 'info-circle';
                
                toast.innerHTML = `<i class="fas fa-${icon}"></i> <span>${message}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('out');
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }

            // ============================================================
            // UTILS
            // ============================================================
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text || '';
                return div.innerHTML;
            }

            // ============================================================
            // AUTENTICAÇÃO & INICIALIZAÇÃO
            // ============================================================
            async function init() {
                const { data, error } = await supabase.auth.getSession();
                if (error || !data.session) {
                    window.location.href = 'index.html';
                    return;
                }
                currentUser = data.session.user;

                await Promise.all([
                    loadProfile(),
                    loadFollowsMap(),
                    loadNotifications()
                ]);

                await loadFriendRequests();
                await loadFriends();
                await loadMutuals();
                await loadDiscoverUsers(true); // true = reset

                renderFriends();
                updateRequestBadge();
            }

            async function loadProfile() {
                const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
                if (data) {
                    currentProfile = data;
                    const avatarEl = document.getElementById('userAvatar');
                    if (data.avatar_url) {
                        avatarEl.innerHTML = `<img src="${data.avatar_url}" alt="Avatar">`;
                    } else {
                        avatarEl.innerHTML = `<div class="fallback" style="background:${data.avatar_color || '#6c63ff'};">${(data.full_name || 'U')[0].toUpperCase()}</div>`;
                    }
                }
            }

            async function loadFollowsMap() {
                const { data } = await supabase.from('follows').select('followed_id').eq('follower_id', currentUser.id);
                if (data) {
                    followsMap = new Set(data.map(f => f.followed_id));
                }
            }

            // ============================================================
            // AMIGOS EM COMUM
            // ============================================================
            async function loadMutuals() {
                mutualsMap = new Map();
                
                // Pega meus amigos
                const { data: myFriendsData } = await supabase
                    .from('friends')
                    .select('friend_id')
                    .eq('user_id', currentUser.id);

                if (!myFriendsData || myFriendsData.length === 0) return;
                
                const myFriendIds = myFriendsData.map(f => f.friend_id);

                // Para cada amigo meu, pega os amigos dele (amigos em comum com outros usuários)
                // Otimização: faz 1 query pegando todos os relacionamentos dos meus amigos
                const { data: theirFriends } = await supabase
                    .from('friends')
                    .select('user_id, friend_id')
                    .in('user_id', myFriendIds);

                if (!theirFriends) return;

                // Para cada amigo do meu amigo, conta quantas vezes aparece
                theirFriends.forEach(rel => {
                    if (rel.friend_id === currentUser.id) return; // Não conta eu mesmo
                    const current = mutualsMap.get(rel.friend_id) || 0;
                    mutualsMap.set(rel.friend_id, current + 1);
                });
            }

            function getMutualBadge(userId) {
                const count = mutualsMap.get(userId);
                if (!count || count === 0) return '';
                return `
                    <div class="mutual-badge">
                        <i class="fas fa-user-friends"></i> ${count} amigo${count > 1 ? 's' : ''} em comum
                    </div>
                `;
            }

            // ============================================================
            // REQUISIÇÕES DE AMIZADE
            // ============================================================
            async function loadFriendRequests() {
                const [receivedRes, sentRes] = await Promise.all([
                    supabase.from('friend_requests').select(`*, sender:sender_id (id, full_name, username, avatar_url, avatar_color)`)
                        .eq('receiver_id', currentUser.id).eq('status', 'pending'),
                    supabase.from('friend_requests').select(`*, receiver:receiver_id (id, full_name, username, avatar_url, avatar_color)`)
                        .eq('sender_id', currentUser.id).eq('status', 'pending')
                ]);

                pendingRequests = receivedRes.data || [];
                sentRequests = sentRes.data || [];
                
                if (currentTab === 'requests') renderRequests();
                if (currentTab === 'sent') renderSent();
            }

            // ============================================================
            // AMIGOS
            // ============================================================
            async function loadFriends() {
                const { data: friendsData } = await supabase
                    .from('friends')
                    .select(`friend_id, profiles:friend_id (id, full_name, username, avatar_url, avatar_color)`)
                    .eq('user_id', currentUser.id);
                
                friends = friendsData ? friendsData.map(f => f.profiles).filter(Boolean) : [];
                filteredFriends = [...friends];
            }

            // ============================================================
            // DESCOBRIR (COM PAGINAÇÃO)
            // ============================================================
            async function loadDiscoverUsers(reset = false) {
                if (reset) {
                    discoverPage = 0;
                    discoverUsers = [];
                    allDiscoverIds = [];
                    hasMoreDiscover = false;

                    // Pega IDs excluídos
                    const friendIds = friends.map(f => f.id);
                    const pendingIds = [
                        ...pendingRequests.map(r => r.sender?.id),
                        ...sentRequests.map(r => r.receiver?.id)
                    ];
                    const excluded = new Set([currentUser.id, ...friendIds, ...pendingIds].filter(Boolean));

                    // Busca todos os IDs disponíveis de uma vez (leve, só IDs)
                    const { data: allProfiles } = await supabase
                        .from('profiles')
                        .select('id')
                        .order('created_at', { ascending: false });

                    if (!allProfiles) return;
                    
                    allDiscoverIds = allProfiles
                        .map(p => p.id)
                        .filter(id => !excluded.has(id));
                }

                // Pega a página atual
                const start = discoverPage * PAGE_SIZE;
                const end = start + PAGE_SIZE;
                const idsToFetch = allDiscoverIds.slice(start, end);

                if (idsToFetch.length === 0) {
                    hasMoreDiscover = false;
                    loadMoreWrap.style.display = 'none';
                    return;
                }

                // Busca os perfis desses IDs
                const { data: profiles } = await supabase
                    .from('profiles')
                    .select('*')
                    .in('id', idsToFetch);

                if (profiles) {
                    discoverUsers = [...discoverUsers, ...profiles];
                    filteredDiscover = [...discoverUsers];
                }

                hasMoreDiscover = end < allDiscoverIds.length;
                loadMoreWrap.style.display = hasMoreDiscover ? 'block' : 'none';
                discoverPage++;

                if (currentTab === 'discover') renderDiscover();
            }

            window.loadMoreDiscover = async function() {
                if (loadingMore || !hasMoreDiscover) return;
                loadingMore = true;
                loadMoreBtn.disabled = true;
                loadMoreBtn.innerHTML = '<div class="spinner"></div> Carregando...';
                
                await loadDiscoverUsers(false);
                
                loadMoreBtn.disabled = false;
                loadMoreBtn.innerHTML = '<i class="fas fa-arrow-down"></i> Carregar mais';
                loadingMore = false;
            };

            // ============================================================
            // RENDERIZAÇÃO
            // ============================================================
            function renderFriends() {
                if (filteredFriends.length === 0) {
                    friendsList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-wrapper"><i class="fas fa-user-friends"></i></div>
                            <h3>Nenhum amigo ainda</h3>
                            <p>Vá até a aba "Descobrir" e conecte-se com pessoas.</p>
                        </div>
                    `;
                    return;
                }

                friendsList.innerHTML = filteredFriends.map(friend => {
                    const isFollowing = followsMap.has(friend.id);
                    const mutualBadge = getMutualBadge(friend.id);
                    return createUserCardHTML(friend, 'friend', isFollowing, null, mutualBadge);
                }).join('');
            }

            function renderRequests() {
                if (pendingRequests.length === 0) {
                    requestsList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-wrapper"><i class="fas fa-envelope-open"></i></div>
                            <h3>Caixa de entrada vazia</h3>
                            <p>Você não tem nenhum pedido de amizade pendente.</p>
                        </div>
                    `;
                    return;
                }

                requestsList.innerHTML = pendingRequests.map(req => {
                    const user = req.sender;
                    const mutualBadge = getMutualBadge(user.id);
                    return createUserCardHTML(user, 'request', false, req.id, mutualBadge);
                }).join('');
            }

            function renderSent() {
                if (sentRequests.length === 0) {
                    sentList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-wrapper"><i class="fas fa-paper-plane"></i></div>
                            <h3>Nenhum pedido enviado</h3>
                            <p>Você não tem solicitações aguardando resposta.</p>
                        </div>
                    `;
                    return;
                }

                sentList.innerHTML = sentRequests.map(req => {
                    const user = req.receiver;
                    return createUserCardHTML(user, 'sent', false, req.id, '');
                }).join('');
            }

            function renderDiscover() {
                if (filteredDiscover.length === 0) {
                    discoverList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-wrapper"><i class="fas fa-globe"></i></div>
                            <h3>Tudo em dia</h3>
                            <p>Você já se conectou com todos disponíveis.</p>
                        </div>
                    `;
                    return;
                }

                discoverList.innerHTML = filteredDiscover.map(user => {
                    const isFollowing = followsMap.has(user.id);
                    const mutualBadge = getMutualBadge(user.id);
                    return createUserCardHTML(user, 'discover', isFollowing, null, mutualBadge);
                }).join('');
            }

            function createUserCardHTML(user, context, isFollowing, requestId = null, mutualBadge = '') {
                const avatarUrl = user.avatar_url;
                const color = user.avatar_color || '#6c63ff';
                const initial = (user.full_name || 'U')[0].toUpperCase();
                const name = user.full_name || 'Usuário';
                const username = user.username || 'usuario';

                let actionsHtml = '';

                if (context === 'friend') {
                    actionsHtml = `
                        ${isFollowing 
                            ? `<button class="btn-secondary" data-btn-follow="${user.id}" onclick="event.stopPropagation(); unfollowUser('${user.id}', this)"><i class="fas fa-user-minus"></i> Seguindo</button>` 
                            : `<button class="btn-primary" data-btn-follow="${user.id}" onclick="event.stopPropagation(); followUser('${user.id}', this)"><i class="fas fa-plus"></i> Seguir</button>`
                        }
                        <button class="btn-danger" onclick="event.stopPropagation(); unfriendUser('${user.id}')"><i class="fas fa-user-xmark"></i> Desfazer</button>
                    `;
                } else if (context === 'request') {
                    actionsHtml = `
                        <button class="btn-success" data-btn-req="${requestId}" onclick="event.stopPropagation(); acceptRequest('${requestId}', '${user.id}', this)"><i class="fas fa-check"></i> Aceitar</button>
                        <button class="btn-secondary" data-btn-req="${requestId}" onclick="event.stopPropagation(); rejectRequest('${requestId}', this)"><i class="fas fa-times"></i> Recusar</button>
                    `;
                } else if (context === 'sent') {
                    actionsHtml = `
                        <button class="btn-secondary" data-btn-req="${requestId}" onclick="event.stopPropagation(); cancelSentRequest('${requestId}', this)"><i class="fas fa-times"></i> Cancelar</button>
                    `;
                } else if (context === 'discover') {
                    actionsHtml = `
                        <button class="btn-primary" data-btn-add="${user.id}" onclick="event.stopPropagation(); sendFriendRequest('${user.id}', this)"><i class="fas fa-user-plus"></i> Adicionar</button>
                        ${isFollowing 
                            ? `<button class="btn-secondary" data-btn-follow="${user.id}" onclick="event.stopPropagation(); unfollowUser('${user.id}', this)"><i class="fas fa-user-minus"></i> Seguindo</button>` 
                            : `<button class="btn-secondary" data-btn-follow="${user.id}" onclick="event.stopPropagation(); followUser('${user.id}', this)"><i class="fas fa-plus"></i> Seguir</button>`
                        }
                    `;
                }

                return `
                    <div class="friend-card">
                        <div class="avatar" onclick="openUserCard('${user.id}')">
                            ${avatarUrl 
                                ? `<img src="${avatarUrl}" alt="Avatar">` 
                                : `<div class="fallback" style="background:${color};">${initial}</div>`
                            }
                        </div>
                        <div class="info">
                            <div class="name" onclick="openUserCard('${user.id}')">${escapeHtml(name)}</div>
                            <div class="username">@${escapeHtml(username)}</div>
                            ${mutualBadge}
                        </div>
                        <div class="actions">
                            ${actionsHtml}
                        </div>
                    </div>
                `;
            }

            // ============================================================
            // AÇÕES (Com TOAST + Disable de botão anti-spam)
            // ============================================================
            window.followUser = async function(userId, btn) {
                if (btn) btn.disabled = true;
                try {
                    await supabase.from('follows').insert({ follower_id: currentUser.id, followed_id: userId });
                    followsMap.add(userId);
                    updateFollowCounts(userId, 'increment');
                    
                    if (currentTab === 'friends') renderFriends();
                    if (currentTab === 'discover') renderDiscover();
                    
                    showToast('Agora você segue este usuário', 'success');
                } catch (e) {
                    if (btn) btn.disabled = false;
                    showToast('Não foi possível seguir', 'error');
                }
            };

            window.unfollowUser = async function(userId, btn) {
                if (btn) btn.disabled = true;
                try {
                    await supabase.from('follows').delete().eq('follower_id', currentUser.id).eq('followed_id', userId);
                    followsMap.delete(userId);
                    updateFollowCounts(userId, 'decrement');
                    
                    if (currentTab === 'friends') renderFriends();
                    if (currentTab === 'discover') renderDiscover();
                    
                    showToast('Você parou de seguir', 'info');
                } catch (e) {
                    if (btn) btn.disabled = false;
                    showToast('Erro ao parar de seguir', 'error');
                }
            };

            window.sendFriendRequest = async function(userId, btn) {
                if (btn) btn.disabled = true;
                try {
                    await supabase.from('friend_requests').insert({ sender_id: currentUser.id, receiver_id: userId, status: 'pending' });
                    
                    // Remove do descobrir localmente
                    discoverUsers = discoverUsers.filter(u => u.id !== userId);
                    filteredDiscover = filteredDiscover.filter(u => u.id !== userId);
                    
                    await loadFriendRequests();
                    renderDiscover();
                    updateRequestBadge();
                    
                    showToast('Solicitação enviada!', 'success');
                } catch (e) {
                    if (btn) btn.disabled = false;
                    showToast('Erro ao enviar solicitação', 'error');
                }
            };

            window.acceptRequest = async function(requestId, senderId, btn) {
                if (btn) btn.disabled = true;
                try {
                    await supabase.from('friend_requests').update({ status: 'accepted' }).eq('id', requestId);
                    await supabase.from('friends').insert([
                        { user_id: currentUser.id, friend_id: senderId },
                        { user_id: senderId, friend_id: currentUser.id }
                    ]);

                    await loadFriendRequests();
                    await loadFriends();
                    renderFriends();
                    renderRequests();
                    updateRequestBadge();

                    showToast('Vocês agora são amigos!', 'success');
                } catch (e) {
                    if (btn) btn.disabled = false;
                    showToast('Erro ao aceitar', 'error');
                }
            };

            window.rejectRequest = async function(requestId, btn) {
                if (btn) btn.disabled = true;
                try {
                    await supabase.from('friend_requests').delete().eq('id', requestId);
                    await loadFriendRequests();
                    renderRequests();
                    updateRequestBadge();
                    showToast('Solicitação recusada', 'info');
                } catch (e) {
                    if (btn) btn.disabled = false;
                    showToast('Erro ao recusar', 'error');
                }
            };

            window.cancelSentRequest = async function(requestId, btn) {
                if (btn) btn.disabled = true;
                try {
                    await supabase.from('friend_requests').delete().eq('id', requestId);
                    await loadFriendRequests();
                    renderSent();
                    showToast('Solicitação cancelada', 'info');
                } catch (e) {
                    if (btn) btn.disabled = false;
                    showToast('Erro ao cancelar', 'error');
                }
            };

            window.unfriendUser = async function(userId) {
                const result = await Swal.fire({
                    title: 'Desfazer amizade?',
                    text: 'Você deixará de seguir e ser seguido por esta pessoa.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ff2e5b',
                    cancelButtonColor: '#2a2a40',
                    confirmButtonText: 'Sim, desfazer',
                    cancelButtonText: 'Cancelar'
                });

                if (!result.isConfirmed) return;

                try {
                    await supabase.from('friends').delete().eq('user_id', currentUser.id).eq('friend_id', userId);
                    await supabase.from('friends').delete().eq('user_id', userId).eq('friend_id', currentUser.id);
                    await supabase.from('follows').delete().eq('follower_id', currentUser.id).eq('followed_id', userId);
                    await supabase.from('follows').delete().eq('follower_id', userId).eq('followed_id', currentUser.id);

                    followsMap.delete(userId);
                    updateFollowCounts(userId, 'decrement');

                    await loadFriends();
                    renderFriends();
                    showToast('Amizade desfeita', 'info');
                } catch (e) {
                    showToast('Erro ao desfazer amizade', 'error');
                }
            };

            async function updateFollowCounts(targetId, action) {
                const inc = action === 'increment' ? 1 : -1;
                
                const { data: p1 } = await supabase.from('profiles').select('following_count').eq('id', currentUser.id).single();
                if(p1) await supabase.from('profiles').update({ following_count: Math.max(0, (p1.following_count || 0) + inc) }).eq('id', currentUser.id);

                const { data: p2 } = await supabase.from('profiles').select('followers_count').eq('id', targetId).single();
                if(p2) await supabase.from('profiles').update({ followers_count: Math.max(0, (p2.followers_count || 0) + inc) }).eq('id', targetId);
            }

            // ============================================================
            // TABS & BUSCA
            // ============================================================
            window.switchTab = function(tab) {
                currentTab = tab;
                
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                
                document.querySelectorAll('.tab-content').forEach(el => {
                    el.classList.remove('active');
                });
                document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
                
                searchInput.value = '';
                filteredFriends = [...friends];
                filteredDiscover = [...discoverUsers];

                if (tab === 'friends') renderFriends();
                else if (tab === 'requests') renderRequests();
                else if (tab === 'sent') renderSent();
                else if (tab === 'discover') {
                    renderDiscover();
                    loadMoreWrap.style.display = hasMoreDiscover ? 'block' : 'none';
                }
            };

            searchInput.addEventListener('input', function() {
                const term = this.value.toLowerCase().trim();
                
                if (currentTab === 'friends') {
                    filteredFriends = friends.filter(f => 
                        (f.full_name && f.full_name.toLowerCase().includes(term)) || 
                        (f.username && f.username.toLowerCase().includes(term))
                    );
                    renderFriends();
                } else if (currentTab === 'discover') {
                    filteredDiscover = discoverUsers.filter(u => 
                        (u.full_name && u.full_name.toLowerCase().includes(term)) || 
                        (u.username && u.username.toLowerCase().includes(term))
                    );
                    renderDiscover();
                    loadMoreWrap.style.display = (!term && hasMoreDiscover) ? 'block' : 'none';
                }
            });

            function updateRequestBadge() {
                const badge = document.getElementById('requestBadge');
                if (pendingRequests.length > 0) {
                    badge.style.display = 'inline-block';
                    badge.textContent = pendingRequests.length > 9 ? '9+' : pendingRequests.length;
                } else {
                    badge.style.display = 'none';
                }
            }

            async function loadNotifications() {
                const { data } = await supabase.from('notifications').select('id').eq('user_id', currentUser.id).eq('read', false);
                const badge = document.getElementById('notifBadge');
                if (data && data.length > 0) {
                    badge.style.display = 'flex';
                    badge.textContent = data.length > 9 ? '9+' : data.length;
                }
            }

            // ============================================================
            // USER CARD
            // ============================================================
            window.openUserCard = async function(userId) {
                const overlay = document.getElementById('userCardOverlay');
                const content = document.getElementById('userCardContent');
                overlay.classList.add('active');
                content.innerHTML = '<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>';

                const { data: profile } = await supabase.from('profiles').select('*').eq('id', userId).single();
                if (!profile) {
                    content.innerHTML = '<div style="text-align:center;padding:20px;">Perfil não encontrado</div>';
                    return;
                }

                const isOwn = userId === currentUser.id;
                let actionBtn = '';
                const isFriend = friends.some(f => f.id === userId);
                const mutualCount = mutualsMap.get(userId) || 0;
                
                if (!isOwn) {
                    if (isFriend) {
                        actionBtn = `<button class="btn-danger" onclick="unfriendUser('${userId}'); closeUserCard();">Desfazer Amizade</button>`;
                    } else {
                        actionBtn = `<button class="btn-primary" onclick="sendFriendRequest('${userId}', this); closeUserCard();">Adicionar Amigo</button>`;
                    }
                }

                const avatarUrl = profile.avatar_url;
                const color = profile.avatar_color || '#6c63ff';
                const initial = (profile.full_name || 'U')[0].toUpperCase();

                content.innerHTML = `
                    <button class="close-card" onclick="closeUserCard()">&times;</button>
                    <div class="avatar-large">
                        ${avatarUrl ? `<img src="${avatarUrl}">` : `<div class="fallback" style="background:${color};">${initial}</div>`}
                    </div>
                    <div class="name">${profile.full_name || 'Usuário'}</div>
                    <div class="username">@${profile.username || 'usuario'}</div>
                    ${mutualCount > 0 ? `<div class="mutual-badge" style="margin: 8px auto; display: inline-flex;"><i class="fas fa-user-friends"></i> ${mutualCount} amigo${mutualCount > 1 ? 's' : ''} em comum</div>` : ''}
                    ${profile.bio ? `<div class="bio">${escapeHtml(profile.bio)}</div>` : ''}
                    <div class="stats">
                        <div class="stat"><div class="number">${profile.followers_count || 0}</div><div class="label">Seguidores</div></div>
                        <div class="stat"><div class="number">${profile.following_count || 0}</div><div class="label">Seguindo</div></div>
                    </div>
                    <div class="card-actions">
                        ${actionBtn}
                        <button class="btn-secondary" onclick="closeUserCard(); window.location.href='perfil.html?id=${userId}'">Ver Perfil</button>
                    </div>
                `;
            };

            window.closeUserCard = function() {
                document.getElementById('userCardOverlay').classList.remove('active');
            };

            // INICIAR
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</body>
</html>
