<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zonne - Em manutenção</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0f; color: white; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full text-center">
        <div class="text-4xl font-bold mb-8 flex items-center justify-center gap-3">
            <div class="bg-gradient-to-br from-indigo-600 to-purple-600 p-3 rounded-2xl shadow-lg">
                <i class="fas fa-users"></i>
            </div>
            Zonne
        </div>

        <div class="text-indigo-500 text-6xl mb-6 animate-pulse">
            <i class="fas fa-tools"></i>
        </div>

        <h1 class="text-4xl font-bold mb-4">Estamos atualizando</h1>
        <p class="text-gray-400 mb-10">Voltaremos no dia 01 de Setembro de 2026. Agradecemos a paciência!</p>

        <div id="countdown" class="grid grid-cols-4 gap-4 mb-10">
            <div class="bg-white/5 border border-white/10 rounded-xl p-4">
                <div id="days" class="text-3xl font-bold">00</div>
                <div class="text-xs text-gray-500 uppercase">Dias</div>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-xl p-4">
                <div id="hours" class="text-3xl font-bold">00</div>
                <div class="text-xs text-gray-500 uppercase">Horas</div>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-xl p-4">
                <div id="minutes" class="text-3xl font-bold">00</div>
                <div class="text-xs text-gray-500 uppercase">Min</div>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-xl p-4">
                <div id="seconds" class="text-3xl font-bold">00</div>
                <div class="text-xs text-gray-500 uppercase">Seg</div>
            </div>
        </div>

        <div class="bg-white/5 border border-white/10 rounded-xl py-4 px-6 inline-flex items-center gap-4">
            <i class="fas fa-envelope text-indigo-400"></i>
            <a href="mailto:reginaldomuanza83@gmail.com" class="text-sm">reginaldomuanza83@gmail.com</a>
        </div>
    </div>

    <script>
        (function() {
            // Mês 8 = Setembro (Jan é 0)
            const target = new Date(2026, 8, 1, 0, 0, 0).getTime();

            function update() {
                const now = new Date().getTime();
                const diff = target - now;

                if (diff > 0) {
                    document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById('minutes').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById('seconds').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            }
            setInterval(update, 1000);
            update();
        })();
    </script>
</body>
</html>
