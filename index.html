<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zonne - Em manutenção</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            text-align: center;
        }

        /* ===== LOGO ===== */
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            font-weight: 800;
            font-size: 28px;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo i {
            font-size: 34px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            padding: 10px 12px;
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(108, 92, 231, 0.25);
        }

        /* ===== ÍCONE PRINCIPAL ===== */
        .main-icon {
            font-size: 72px;
            color: #6c5ce7;
            margin-bottom: 24px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        /* ===== TÍTULO E DESCRIÇÃO ===== */
        h1 {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            max-width: 480px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }

        .subtitle i {
            color: #a78bfa;
            margin: 0 2px;
        }

        /* ===== CONTADOR REGRESSIVO ===== */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 12px 20px;
            min-width: 80px;
            backdrop-filter: blur(8px);
            transition: border 0.3s;
        }

        .countdown-item:hover {
            border-color: rgba(108, 92, 231, 0.3);
        }

        .countdown-item .number {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .countdown-item .label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* ===== CONTATO ===== */
        .contact-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 18px 24px;
            margin: 0 auto 32px;
            max-width: 420px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(8px);
            transition: border 0.3s;
        }

        .contact-box:hover {
            border-color: rgba(108, 92, 231, 0.2);
        }

        .contact-box i {
            font-size: 22px;
            color: #a78bfa;
        }

        .contact-box .info {
            text-align: left;
        }

        .contact-box .info .label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .contact-box .info a {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-box .info a:hover {
            color: #a78bfa;
        }

        /* ===== STATUS ===== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.12);
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #34d399;
            margin-bottom: 32px;
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ===== REDES SOCIAIS (opcional) ===== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .social-links a:hover {
            background: rgba(108, 92, 231, 0.15);
            border-color: #6c5ce7;
            color: #fff;
            transform: translateY(-2px);
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
        }

        .footer i {
            color: #6c5ce7;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 600px) {
            .logo {
                font-size: 22px;
                gap: 10px;
            }

            .logo i {
                font-size: 26px;
                padding: 8px 10px;
            }

            .main-icon {
                font-size: 56px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 16px;
                padding: 0 8px;
            }

            .countdown {
                gap: 12px;
            }

            .countdown-item {
                min-width: 60px;
                padding: 10px 14px;
            }

            .countdown-item .number {
                font-size: 24px;
            }

            .contact-box {
                padding: 14px 18px;
                gap: 12px;
                flex-direction: column;
                text-align: center;
            }

            .contact-box .info {
                text-align: center;
            }

            .social-links {
                gap: 12px;
            }

            .social-links a {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
        }

        @media (max-width: 400px) {
            .countdown-item {
                min-width: 50px;
                padding: 8px 10px;
            }

            .countdown-item .number {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <i class="fas fa-users"></i>
            <span>Zonne</span>
        </div>

        <!-- Status -->
        <div class="status-badge">
            <span class="dot"></span>
            Em manutenção programada
        </div>

        <!-- Ícone principal -->
        <div class="main-icon">
            <i class="fas fa-tools"></i>
        </div>

        <!-- Título -->
        <h1>Estamos atualizando</h1>

        <!-- Descrição -->
        <p class="subtitle">
            Estamos trabalhando para trazer uma experiência ainda melhor.
            <br />
            Em breve a <i class="fas fa-users"></i> Zonne estará de volta com novidades!
        </p>

        <!-- Contador regressivo -->
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="number" id="days">00</div>
                <div class="label">Dias</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="hours">00</div>
                <div class="label">Horas</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutos</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="seconds">00</div>
                <div class="label">Segundos</div>
            </div>
        </div>

        <!-- Contato -->
        <div class="contact-box">
            <i class="fas fa-envelope"></i>
            <div class="info">
                <div class="label">Contato</div>
                <a href="mailto:suporte@Zonne.com">reginaldomuanza83@gmail.com</a>
            </div>
        </div>

        <!-- Redes sociais -->
        <div class="social-links">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fas fa-heart"></i> Equipe Zonne &bull; 2026
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURAÇÃO DO CONTADOR
            // ============================================================
            // Altere esta data para o momento em que o site estará de volta.
            // Formato: Ano, Mês (0-11), Dia, Hora, Minuto, Segundo
            const TARGET_DATE = new Date(2026, 6, 28, 18, 0, 0); // 28 de julho de 2026, 18:00:00

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            function pad(num) {
                return String(num).padStart(2, '0');
            }

            function updateCountdown() {
                const now = new Date().getTime();
                const target = TARGET_DATE.getTime();
                let diff = target - now;

                if (diff <= 0) {
                    // Se já passou, mostra "00" em tudo e para
                    daysEl.textContent = '00';
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                diff -= days * (1000 * 60 * 60 * 24);

                const hours = Math.floor(diff / (1000 * 60 * 60));
                diff -= hours * (1000 * 60 * 60);

                const minutes = Math.floor(diff / (1000 * 60));
                diff -= minutes * (1000 * 60);

                const seconds = Math.floor(diff / 1000);

                daysEl.textContent = pad(days);
                hoursEl.textContent = pad(hours);
                minutesEl.textContent = pad(minutes);
                secondsEl.textContent = pad(seconds);
            }

            // Atualiza a cada segundo
            updateCountdown();
            setInterval(updateCountdown, 1000);

            // Opcional: se a data-alvo for passada, exibe mensagem diferente
            function checkIfPassed() {
                const now = new Date().getTime();
                if (now >= TARGET_DATE.getTime()) {
                    const container = document.querySelector('.container');
                    const countdown = document.getElementById('countdown');
                    if (countdown) countdown.style.display = 'none';

                    const status = document.querySelector('.status-badge');
                    if (status) {
                        status.innerHTML = `
                            <span class="dot" style="background:#34d399;"></span>
                            Estamos de volta! 🎉
                        `;
                        status.style.borderColor = 'rgba(52,211,153,0.2)';
                        status.style.color = '#34d399';
                    }

                    const subtitle = document.querySelector('.subtitle');
                    if (subtitle) {
                        subtitle.innerHTML = `
                            O <i class="fas fa-users"></i> Zonne já está disponível novamente.
                            <br />
                            Aproveite as novidades!
                        `;
                    }

                    const icon = document.querySelector('.main-icon i');
                    if (icon) {
                        icon.className = 'fas fa-check-circle';
                        icon.style.color = '#34d399';
                    }
                }
            }

            // Verifica se já passou (útil para páginas que ficam abertas)
            checkIfPassed();

        })();
    </script>

</body>
</html>
