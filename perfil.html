<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialConnect - Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
        }
        .top-bar .logo i {
            font-size: 22px;
            background: linear-gradient(135deg, #5850ec, #764ba2);
            padding: 7px 8px;
            border-radius: 10px;
            color: #fff;
        }
        .top-bar .back-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.3s;
        }
        .top-bar .back-btn:hover { color: #fff; }
        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-bar .actions .icon-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
            padding: 4px;
        }
        .top-bar .actions .icon-btn:hover { color: #fff; }
        .top-bar .actions .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #e74c3c;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .top-bar .avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: border 0.3s;
            flex-shrink: 0;
        }
        .top-bar .avatar-mini:hover { border-color: #5850ec; }
        .top-bar .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .top-bar .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px 20px;
        }

        /* ===== PROFILE HEADER ===== */
        .profile-header {
            padding: 20px 0;
            text-align: center;
        }
        .profile-header .avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 16px;
            border: 4px solid rgba(255,255,255,0.06);
            position: relative;
        }
        .profile-header .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-header .avatar-large .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: #fff;
        }
        .profile-header .name {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }
        .profile-header .username {
            font-size: 15px;
            color: rgba(255,255,255,0.3);
        }
        .profile-header .bio {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .profile-header .edit-bio-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 13px;
            margin-top: 4px;
            transition: color 0.3s;
        }
        .profile-header .edit-bio-btn:hover { color: #5850ec; }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 16px 0;
        }
        .profile-stats .stat {
            text-align: center;
        }
        .profile-stats .stat .number {
            font-weight: 700;
            font-size: 20px;
            color: #fff;
        }
        .profile-stats .stat .label {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 12px 0 20px;
            flex-wrap: wrap;
        }
        .profile-actions button {
            padding: 8px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .profile-actions .btn-follow {
            background: #5850ec;
            color: #fff;
        }
        .profile-actions .btn-follow:hover { background: #764ba2; }
        .profile-actions .btn-follow.following {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.4);
        }
        .profile-actions .btn-follow.following:hover {
            background: rgba(231,76,60,0.15);
            color: #e74c3c;
        }
        .profile-actions .btn-edit {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }
        .profile-actions .btn-edit:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .profile-actions .btn-message {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }
        .profile-actions .btn-message:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* ===== FILTER TABS ===== */
        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.03);
            padding: 4px;
            border-radius: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tabs .filter-tab {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            min-width: fit-content;
        }
        .filter-tabs .filter-tab i { margin-right: 6px; }
        .filter-tabs .filter-tab.active {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }
        .filter-tabs .filter-tab:hover:not(.active) {
            color: rgba(255,255,255,0.6);
        }

        /* ===== POSTS GRID ===== */
        .profile-posts {
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 16px;
        }
        .profile-posts .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .profile-posts .posts-grid .post-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
            position: relative;
        }
        .profile-posts .posts-grid .post-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-posts .posts-grid .post-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-posts .posts-grid .post-item .post-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            display: flex;
            gap: 12px;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .profile-posts .posts-grid .post-item:hover .post-overlay {
            opacity: 1;
        }
        .profile-posts .posts-grid .post-item .post-overlay span {
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .profile-posts .posts-grid .post-item .post-overlay span i {
            font-size: 14px;
        }

        /* ===== TEXT/AUDIO POST PREVIEW ===== */
        .profile-posts .posts-grid .post-item.text-post,
        .profile-posts .posts-grid .post-item.audio-post {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 8px;
            text-align: center;
        }
        .profile-posts .posts-grid .post-item.text-post .post-icon,
        .profile-posts .posts-grid .post-item.audio-post .post-icon {
            font-size: 28px;
            color: rgba(255,255,255,0.15);
            margin-bottom: 4px;
        }
        .profile-posts .posts-grid .post-item.text-post .post-preview-text,
        .profile-posts .posts-grid .post-item.audio-post .post-preview-text {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.3;
            max-width: 100%;
            word-break: break-word;
        }
        .profile-posts .posts-grid .post-item.audio-post .post-icon {
            color: #5850ec;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px 0;
            color: rgba(255,255,255,0.1);
        }
        .loading-spinner i { font-size: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i { font-size: 40px; margin-bottom: 12px; }
        .empty-state h3 { color: rgba(255,255,255,0.3); font-weight: 500; font-size: 16px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 env(safe-area-inset-bottom, 8px) 0;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.25);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 16px;
            transition: color 0.3s;
            position: relative;
            font-family: 'Inter', sans-serif;
        }
        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .bottom-nav .nav-item.active {
            color: #5850ec;
        }
        .bottom-nav .nav-item:hover { color: rgba(255,255,255,0.6); }
        .bottom-nav .nav-item .badge {
            position: absolute;
            top: -2px;
            right: 6px;
            background: #e74c3c;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .bottom-nav .nav-item .nav-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bottom-nav .nav-item .nav-icon .plus-circle {
            background: linear-gradient(135deg, #5850ec, #764ba2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            margin-top: -14px;
            box-shadow: 0 4px 20px rgba(88,80,236,0.3);
            transition: transform 0.3s;
        }
        .bottom-nav .nav-item .nav-icon .plus-circle:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .profile-header .avatar-large { width: 90px; height: 90px; }
            .profile-header .avatar-large .fallback { font-size: 36px; }
            .profile-header .name { font-size: 20px; }
            .profile-stats { gap: 24px; }
            .profile-stats .stat .number { font-size: 17px; }
            .bottom-nav .nav-item { padding: 2px 10px; font-size: 18px; }
            .bottom-nav .nav-item span { font-size: 8px; }
            .bottom-nav .nav-item .nav-icon .plus-circle { width: 34px; height: 34px; font-size: 18px; margin-top: -10px; }
            .filter-tabs .filter-tab { font-size: 11px; padding: 6px 10px; }
            .profile-posts .posts-grid { gap: 2px; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <div class="logo" onclick="goToFeed()">
            <i class="fas fa-users"></i>
            <span>SocialConnect</span>
        </div>
        <div class="actions">
            <button class="icon-btn" onclick="openDefinicao()">
                <i class="fas fa-cog"></i>
            </button>
            <button class="icon-btn" onclick="openNotifications()">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge" style="display:none;">0</span>
            </button>
            <div class="avatar-mini" id="userAvatar" onclick="goToMyProfile()">
                <div class="fallback" style="background:#5850ec;"><i class="fas fa-user"></i></div>
            </div>
        </div>
    </header>

    <div class="container" id="profileContainer">
        <div class="loading-spinner"><i class="fas fa-spinner"></i> Carregando perfil...</div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="goToFeed()">
            <div class="nav-icon"><i class="fas fa-home"></i></div>
            <span>Início</span>
        </button>
        <button class="nav-item" onclick="goToExplore()">
            <div class="nav-icon"><i class="fas fa-compass"></i></div>
            <span>Explorar</span>
        </button>
        <button class="nav-item" onclick="goToCreatePost()">
            <div class="nav-icon">
                <div class="plus-circle"><i class="fas fa-plus"></i></div>
            </div>
            <span>Novo</span>
        </button>
        <button class="nav-item" onclick="openMessages()">
            <div class="nav-icon"><i class="fas fa-envelope"></i></div>
            <span>Mensagens</span>
        </button>
        <button class="nav-item active" onclick="goToMyProfile()">
            <div class="nav-icon"><i class="fas fa-user"></i></div>
            <span>Perfil</span>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    (function() {
        'use strict';

        const SUPABASE_URL = 'https://cfanqigkvfpigjvjjbon.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmYW5xaWdrdmZwaWdqdmpqYm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzI5NzIsImV4cCI6MjA5OTQ0ODk3Mn0.UDyNusIz7PNaz4-n-Bpgn2LJCUi6fIw6tW0QrsJEii0';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let profileUserId = null;
        let profileData = null;
        let allPosts = [];
        let filteredPosts = [];
        let isOwnProfile = false;
        let isFollowing = false;
        let currentFilter = 'all';

        const container = document.getElementById('profileContainer');

        // ===== AUTH =====
        async function checkAuth() {
            const { data, error } = await supabase.auth.getSession();
            if (error || !data.session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = data.session.user;
            await loadProfile();
            await loadNotifications();

            const params = new URLSearchParams(window.location.search);
            const userId = params.get('id');

            if (userId) {
                profileUserId = userId;
                isOwnProfile = userId === currentUser.id;
                await loadUserProfile(userId);
            } else {
                profileUserId = currentUser.id;
                isOwnProfile = true;
                await loadUserProfile(currentUser.id);
            }
        }

        async function loadProfile() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error) {
                console.error('Erro ao carregar perfil:', error);
                return;
            }
            currentProfile = data;
            updateUI();
        }

        function updateUI() {
            if (!currentProfile) return;

            const avatarEl = document.getElementById('userAvatar');
            if (currentProfile.avatar_url) {
                avatarEl.innerHTML = `<img src="${currentProfile.avatar_url}" alt="Avatar">`;
            } else {
                const color = currentProfile.avatar_color || '#5850ec';
                const initial = (currentProfile.full_name || 'U')[0].toUpperCase();
                avatarEl.innerHTML = `<div class="fallback" style="background:${color};">${initial}</div>`;
            }
        }

        // ===== LOAD USER PROFILE =====
        async function loadUserProfile(userId) {
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i> Carregando perfil...</div>';

            try {
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .single();

                if (profileError || !profile) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-slash"></i>
                            <h3>Perfil não encontrado</h3>
                        </div>
                    `;
                    return;
                }

                profileData = profile;

                const { data: posts, error: postsError } = await supabase
                    .from('posts')
                    .select(`
                        *,
                        profiles:user_id (id, full_name, username, avatar_url, avatar_color)
                    `)
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (!postsError) {
                    for (let i = 0; i < posts.length; i++) {
                        const { count } = await supabase
                            .from('likes')
                            .select('id', { count: 'exact', head: true })
                            .eq('post_id', posts[i].id);
                        posts[i].likes_count = count || 0;
                    }
                    allPosts = posts || [];
                } else {
                    allPosts = [];
                }

                if (!isOwnProfile) {
                    const { data: followData } = await supabase
                        .from('friends')
                        .select('id')
                        .eq('user_id', currentUser.id)
                        .eq('friend_id', userId)
                        .maybeSingle();
                    isFollowing = !!followData;
                }

                filteredPosts = allPosts;
                renderProfile();

            } catch (error) {
                console.error('Erro ao carregar perfil:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Erro ao carregar perfil</h3>
                    </div>
                `;
            }
        }

        // ===== FILTER POSTS =====
        function filterPosts(filter) {
            currentFilter = filter;
            if (filter === 'all') {
                filteredPosts = allPosts;
            } else if (filter === 'image') {
                filteredPosts = allPosts.filter(p => p.media_type === 'image');
            } else if (filter === 'video') {
                filteredPosts = allPosts.filter(p => p.media_type === 'video');
            } else if (filter === 'audio') {
                filteredPosts = allPosts.filter(p => p.media_type === 'audio');
            } else if (filter === 'text') {
                filteredPosts = allPosts.filter(p => !p.media_url || p.media_type === 'text');
            }
            renderPosts();
        }

        // ===== RENDER PROFILE =====
        function renderProfile() {
            if (!profileData) return;

            const avatarUrl = profileData.avatar_url;
            const color = profileData.avatar_color || '#5850ec';
            const initial = (profileData.full_name || 'U')[0].toUpperCase();
            const fullName = profileData.full_name || 'Usuário';
            const username = profileData.username || 'usuario';
            const bio = profileData.bio || '';
            const followers = profileData.followers_count || 0;
            const following = profileData.following_count || 0;
            const postsCount = allPosts.length;

            let actionsHtml = '';
            if (isOwnProfile) {
                actionsHtml = `
                    <button class="btn-edit" onclick="editProfile()"><i class="fas fa-pen"></i> Editar perfil</button>
                `;
            } else {
                actionsHtml = `
                    <button class="btn-follow ${isFollowing ? 'following' : ''}" onclick="toggleFollow()">
                        ${isFollowing ? '<i class="fas fa-check"></i> Seguindo' : '<i class="fas fa-plus"></i> Seguir'}
                    </button>
                    <button class="btn-message" onclick="sendMessage()"><i class="fas fa-envelope"></i> Mensagem</button>
                `;
            }

            container.innerHTML = `
                <div class="profile-header">
                    <div class="avatar-large">
                        ${avatarUrl ? `<img src="${avatarUrl}" alt="Avatar">` :
                        `<div class="fallback" style="background:${color};">${initial}</div>`}
                    </div>
                    <div class="name">${fullName}</div>
                    <div class="username">@${username}</div>
                    ${bio ? `<div class="bio">${escapeHtml(bio)}</div>` : ''}
                    ${isOwnProfile ? `<button class="edit-bio-btn" onclick="editBio()"><i class="fas fa-pen"></i> Adicionar bio</button>` : ''}
                    <div class="profile-stats">
                        <div class="stat">
                            <div class="number">${postsCount}</div>
                            <div class="label">Publicações</div>
                        </div>
                        <div class="stat">
                            <div class="number" id="followersCount">${followers}</div>
                            <div class="label">Seguidores</div>
                        </div>
                        <div class="stat">
                            <div class="number">${following}</div>
                            <div class="label">Seguindo</div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        ${actionsHtml}
                    </div>
                </div>
                <div class="profile-posts">
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all" onclick="filterPosts('all')"><i class="fas fa-th"></i> Todos</button>
                        <button class="filter-tab" data-filter="image" onclick="filterPosts('image')"><i class="fas fa-image"></i> Fotos</button>
                        <button class="filter-tab" data-filter="video" onclick="filterPosts('video')"><i class="fas fa-video"></i> Vídeos</button>
                        <button class="filter-tab" data-filter="audio" onclick="filterPosts('audio')"><i class="fas fa-music"></i> Áudios</button>
                        <button class="filter-tab" data-filter="text" onclick="filterPosts('text')"><i class="fas fa-font"></i> Textos</button>
                    </div>
                    <div id="postsGridContainer"></div>
                </div>
            `;

            renderPosts();

            // Atualizar título
            document.title = `${fullName} (@${username}) - SocialConnect`;
        }

        // ===== RENDER POSTS =====
        function renderPosts() {
            const container = document.getElementById('postsGridContainer');
            if (!container) return;

            if (filteredPosts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:20px 0;">
                        <i class="fas fa-newspaper"></i>
                        <h3>Nenhuma publicação ${currentFilter !== 'all' ? 'deste tipo' : ''}</h3>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="posts-grid">
                    ${filteredPosts.map(post => {
                        const mediaUrl = post.media_url;
                        const mediaType = post.media_type;
                        const isVideo = mediaType === 'video';
                        const isImage = mediaType === 'image';
                        const isAudio = mediaType === 'audio';
                        const isText = !mediaUrl || mediaType === 'text';
                        const likes = post.likes_count || 0;
                        const comments = post.comments_count || 0;
                        const contentPreview = post.content ? post.content.substring(0, 60) + (post.content.length > 60 ? '...' : '') : '';

                        let itemClass = 'post-item';
                        let innerHtml = '';

                        if (isImage || isVideo) {
                            innerHtml = `
                                ${isVideo ? 
                                    `<video src="${mediaUrl}" muted></video>` :
                                    `<img src="${mediaUrl}" alt="Post" loading="lazy">`
                                }
                                <div class="post-overlay">
                                    <span><i class="fas fa-heart"></i> ${likes}</span>
                                    <span><i class="fas fa-comment"></i> ${comments}</span>
                                </div>
                            `;
                        } else if (isAudio) {
                            itemClass += ' audio-post';
                            innerHtml = `
                                <div class="post-icon"><i class="fas fa-music"></i></div>
                                ${contentPreview ? `<div class="post-preview-text">${escapeHtml(contentPreview)}</div>` : '<div class="post-preview-text">Áudio</div>'}
                                <div class="post-overlay">
                                    <span><i class="fas fa-heart"></i> ${likes}</span>
                                    <span><i class="fas fa-comment"></i> ${comments}</span>
                                </div>
                            `;
                        } else {
                            itemClass += ' text-post';
                            innerHtml = `
                                <div class="post-icon"><i class="fas fa-file-alt"></i></div>
                                ${contentPreview ? `<div class="post-preview-text">${escapeHtml(contentPreview)}</div>` : '<div class="post-preview-text">Postagem</div>'}
                                <div class="post-overlay">
                                    <span><i class="fas fa-heart"></i> ${likes}</span>
                                    <span><i class="fas fa-comment"></i> ${comments}</span>
                                </div>
                            `;
                        }

                        return `
                            <div class="${itemClass}" onclick="goToPost('${post.id}')">
                                ${innerHtml}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            // Atualizar abas ativas
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === currentFilter);
            });
        }

        // ===== FOLLOW =====
        window.toggleFollow = async function() {
            if (!currentUser || isOwnProfile) return;

            const btn = document.querySelector('.btn-follow');
            if (!btn) return;

            try {
                if (isFollowing) {
                    await supabase
                        .from('friends')
                        .delete()
                        .eq('user_id', currentUser.id)
                        .eq('friend_id', profileUserId);
                    isFollowing = false;
                    btn.classList.remove('following');
                    btn.innerHTML = '<i class="fas fa-plus"></i> Seguir';
                    
                    const countEl = document.getElementById('followersCount');
                    if (countEl) {
                        const current = parseInt(countEl.textContent) || 0;
                        countEl.textContent = Math.max(0, current - 1);
                    }
                } else {
                    await supabase.from('friends').insert({
                        user_id: currentUser.id,
                        friend_id: profileUserId
                    });
                    isFollowing = true;
                    btn.classList.add('following');
                    btn.innerHTML = '<i class="fas fa-check"></i> Seguindo';
                    
                    const countEl = document.getElementById('followersCount');
                    if (countEl) {
                        const current = parseInt(countEl.textContent) || 0;
                        countEl.textContent = current + 1;
                    }
                }
            } catch (error) {
                console.error('Erro ao seguir:', error);
                alert('Erro ao seguir: ' + (error.message || 'Tente novamente.'));
            }
        };

        // ===== NAVEGAÇÃO =====
        window.goBack = function() {
            window.history.back();
        };

        window.goToFeed = function() {
            window.location.href = 'feed.html';
        };

        window.goToExplore = function() {
            window.location.href = 'feed.html?tab=explore';
        };

        window.goToCreatePost = function() {
            window.location.href = 'feed.html?tab=create';
        };

        window.goToMyProfile = function() {
            window.location.href = 'perfil.html';
        };

        window.goToPost = function(postId) {
            window.location.href = 'feed.html?id=' + postId;
        };

        window.openNotifications = function() {
            window.location.href = 'notificacoes.html';
        };

        window.openMessages = function() {
            window.location.href = 'chat.html';
        };
        
        window.openDefinicao = function() {
            window.location.href = 'definicao.html';
        };
        
        window.sendMessage = function() {
            alert('💬 Em breve você poderá enviar mensagens!');
        };

        window.editProfile = function() {
            alert('✏️ Edição de perfil em breve!');
        };

        window.editBio = function() {
            const newBio = prompt('Digite sua nova bio:', profileData.bio || '');
            if (newBio !== null && newBio.trim() !== profileData.bio) {
                updateBio(newBio.trim());
            }
        };

        async function updateBio(newBio) {
            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ bio: newBio })
                    .eq('id', currentUser.id);

                if (error) throw error;

                profileData.bio = newBio;
                renderProfile();
            } catch (error) {
                console.error('Erro ao atualizar bio:', error);
                alert('Erro ao atualizar bio: ' + error.message);
            }
        }

        // ===== NOTIFICATIONS =====
        async function loadNotifications() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('notifications')
                .select('id')
                .eq('user_id', currentUser.id)
                .eq('read', false);

            if (error) return;

            const badge = document.getElementById('notifBadge');
            if (data && data.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = data.length > 9 ? '9+' : data.length;
            } else {
                badge.style.display = 'none';
            }
        }

        // ===== UTILS =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== EXPOR FUNÇÕES GLOBAIS =====
        window.filterPosts = filterPosts;

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setInterval(loadNotifications, 30000);
        });

    })();
    </script>
</body>
</html>
