<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonne - Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b12;
            --bg-elevated: #12121c;
            --bg-hover: #16162a;
            --border: #1e1e2e;
            --border-hover: #2a2a40;
            --text: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a80;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.15);
            --red: #ff2e5b;
            --red-glow: rgba(255, 46, 91, 0.4);
            --radius: 16px;
            --font: 'Inter', system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           TOAST NOTIFICATION
           ============================================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: rgba(18, 18, 28, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 12px 20px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
        }

        .toast.error { border-color: rgba(255, 71, 87, 0.3); color: #ff4757; }
        .toast.success { border-color: rgba(108, 99, 255, 0.3); color: var(--accent); }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ============================================================
           MENU DE OPÇÕES DO POST (Excluir)
           ============================================================ */
        .post-options-menu {
            display: none;
            position: fixed;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
            z-index: 2000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            min-width: 180px;
            animation: fadeIn 0.15s ease;
        }

        .post-options-menu.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .post-options-menu button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
            text-align: left;
        }

        .post-options-menu button:hover { background: rgba(255, 255, 255, 0.05); }
        .post-options-menu button.danger { color: #ff4757; }
        .post-options-menu button.danger:hover { background: rgba(255, 71, 87, 0.1); }
        .post-options-menu button i { font-size: 14px; width: 16px; text-align: center; }

        /* ============================================================
           MODAL DE CONFIRMAÇÃO
           ============================================================ */
        .confirm-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .confirm-modal.active { display: flex; }

        .confirm-box {
            background: var(--bg-elevated);
            border-radius: 24px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .confirm-box .ico {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 71, 87, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .confirm-box .ico i { font-size: 24px; color: #ff4757; }
        .confirm-box h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .confirm-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
        .confirm-box .actions { display: flex; gap: 10px; }

        .confirm-box .actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-family: var(--font);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .confirm-box .actions .cancel { background: rgba(255, 255, 255, 0.06); color: var(--text); }
        .confirm-box .actions .cancel:hover { background: rgba(255, 255, 255, 0.1); }
        .confirm-box .actions .confirm { background: #ff4757; color: #fff; box-shadow: 0 4px 16px var(--red-glow); }
        .confirm-box .actions .confirm:hover { background: #e63946; }

        /* ============================================================
           SKELETON LOADING
           ============================================================ */
        .skeleton {
            background: linear-gradient(90deg, #1a1a2a 25%, #24243a 50%, #1a1a2a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-header { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
        .skeleton-header .sk-top { display: flex; justify-content: space-between; margin-bottom: 16px; }
        .skeleton-header .sk-avatar { width: 88px; height: 88px; border-radius: 50%; }
        .skeleton-header .sk-btn { width: 100px; height: 36px; border-radius: 20px; }
        .skeleton-header .sk-line { height: 16px; width: 60%; margin-bottom: 8px; }
        .skeleton-header .sk-line.short { width: 40%; height: 14px; }

        .skeleton-post { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
        .skeleton-post .sk-post-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
        .skeleton-post .sk-post-content { flex: 1; }
        .skeleton-post .sk-post-line { height: 14px; margin-bottom: 10px; }

        /* ============================================================
           TOP BAR
           ============================================================ */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11, 11, 18, 0.85);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        .top-bar .left { display: flex; align-items: center; gap: 16px; }

        .top-bar .back-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-bar .title { font-size: 16px; font-weight: 800; }
        .top-bar .title .posts-count { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-left: 6px; }
        .top-bar .actions { display: flex; gap: 8px; }

        .top-bar .actions .icon-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .top-bar .actions .icon-btn .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--red);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            min-width: 14px;
            height: 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3px;
            border: 2px solid var(--bg);
        }

        /* ============================================================
           CONTAINER & PROFILE INFO
           ============================================================ */
        .container { max-width: 600px; margin: 0 auto; padding-top: 60px; }

        .profile-info { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
        .profile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }

        .avatar-large {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: var(--bg-elevated);
            border: 3px solid var(--bg);
            flex-shrink: 0;
        }

        .avatar-large.has-story {
            padding: 3px;
            border: none;
            background: linear-gradient(135deg, #6c63ff, #9b4dff, #ff6b9d);
        }

        .avatar-large.has-story.seen { background: #3a3a4a; }
        .avatar-large.has-story img, .avatar-large.has-story .fallback { border-radius: 50%; border: 3px solid var(--bg); }
        .avatar-large img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .avatar-large .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
            color: #fff;
            border-radius: 50%;
        }

        .profile-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .profile-actions button {
            padding: 9px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text);
            font-family: var(--font);
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
        }

        .profile-actions .btn-follow { background: var(--text); color: var(--bg); border-color: var(--text); }
        .profile-actions .btn-follow.following { background: transparent; color: var(--text); border-color: var(--border); }

        .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 2px; }
        .profile-username { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
        .profile-bio { font-size: 14.5px; line-height: 1.55; color: var(--text); white-space: pre-wrap; margin-bottom: 12px; }

        .edit-bio-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .profile-stats { display: flex; gap: 18px; font-size: 14px; color: var(--text-secondary); }
        .profile-stats strong { color: var(--text); }

        /* ============================================================
           TABS
           ============================================================ */
        .tabs-container {
            position: sticky;
            top: 60px;
            z-index: 50;
            background: rgba(11, 11, 18, 0.92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tab {
            flex: 1;
            padding: 14px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font);
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            position: relative;
        }

        .tab.active { color: var(--text); }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 80px;
            height: 3px;
            background: var(--accent);
            border-radius: 3px 3px 0 0;
        }

        /* ============================================================
           POSTS (Timeline)
           ============================================================ */
        .posts-list { padding: 0; }

        .post-card {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            position: relative;
        }

        .post-card .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-elevated);
        }

        .post-card .post-avatar img, .post-card .post-avatar .fallback { width: 100%; height: 100%; object-fit: cover; }

        .post-card .post-avatar .fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .post-card .post-body { flex: 1; min-width: 0; }

        /* MUDANÇA: Header com Nome de Usuário restaurado */
        .post-card .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .post-card .post-header .header-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .post-card .post-header .name {
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
        }

        .post-card .post-header .name:hover {
            text-decoration: underline;
        }

        .post-card .post-header .username {
            color: var(--text-secondary);
            cursor: pointer;
        }

        .post-card .post-header .dot-sep {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .post-card .post-header .post-options-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -4px;
        }

        .post-card .post-header .post-options-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }

        .post-card .post-text {
            font-size: 14.5px;
            line-height: 1.55;
            color: var(--text);
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        /* ============================================================
           CARROSSEL
           ============================================================ */
        .post-card .post-media {
            margin-top: 8px;
            margin-bottom: 10px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            background: #000;
        }

        .post-card .post-media img,
        .post-card .post-media video {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }

        .media-carousel { position: relative; user-select: none; }

        .media-carousel .carousel-track {
            display: flex;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .media-carousel .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
        }

        .media-carousel .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            opacity: 0;
        }

        .media-carousel:hover .carousel-nav { opacity: 1; }
        .media-carousel .carousel-nav.prev { left: 10px; }
        .media-carousel .carousel-nav.next { right: 10px; }

        .media-carousel .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 4;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border-radius: 30px;
        }

        .media-carousel .c-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        .media-carousel .c-dot.active { background: #fff; width: 18px; border-radius: 4px; }

        .media-carousel .carousel-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 30px;
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           ÁUDIO PLAYER
           ============================================================ */
        .audio-mini-player {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px 12px 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .audio-mini-player .am-play {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            padding-left: 3px;
        }

        .audio-mini-player .am-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .audio-mini-player .am-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .audio-mini-player .am-bar-fill { height: 100%; background: var(--accent); width: 0%; }

        .audio-mini-player .am-time {
            font-size: 11.5px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .audio-overlay-play {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            padding-left: 3px;
        }

        /* ============================================================
           AÇÕES DO POST
           ============================================================ */
        .post-card .post-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 8px;
            margin-left: -6px;
        }

        .post-card .post-actions .action {
            display: flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 20px;
        }

        .post-card .post-actions .action.like-btn.liked { color: #ff4757; }

        /* ============================================================
           EMPTY & BOTTOM NAV
           ============================================================ */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 40px; margin-bottom: 14px; opacity: 0.3; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(11, 11, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 4px 0 env(safe-area-inset-bottom, 8px) 0;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 14px;
        }

        .bottom-nav .nav-item.active { color: var(--accent); }
        .bottom-nav .nav-item span { font-size: 9px; }

        .bottom-nav .nav-item .nav-icon .plus-circle {
            background: linear-gradient(135deg, var(--accent), #9b4dff);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            margin-top: -14px;
        }

        @media (max-width: 600px) {
            .avatar-large { width: 78px; height: 78px; }
            .profile-actions button { padding: 8px 14px; font-size: 13px; }
            .post-card { padding: 14px; gap: 10px; }
            .post-card .post-avatar { width: 36px; height: 36px; }
            .media-carousel .carousel-nav { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- SISTEMA DE TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- MENU DE OPÇÕES -->
    <div class="post-options-menu" id="postOptionsMenu">
        <button class="danger" onclick="confirmDeletePost()">
            <i class="fas fa-trash-alt"></i> Excluir publicação
        </button>
    </div>

    <!-- MODAL DE EXCLUSÃO -->
    <div class="confirm-modal" id="deleteConfirmModal">
        <div class="confirm-box">
            <div class="ico"><i class="fas fa-trash-alt"></i></div>
            <h3>Excluir publicação?</h3>
            <p>Essa ação não pode ser desfeita. O post e todas as suas curtidas serão apagados.</p>
            <div class="actions">
                <button class="cancel" onclick="closeDeleteModal()">Cancelar</button>
                <button class="confirm" onclick="executeDeletePost()">Excluir</button>
            </div>
        </div>
    </div>

    <header class="top-bar">
        <div class="left">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <div class="title" id="topTitle">Perfil</div>
        </div>
        <div class="actions">

            function formatNumber(n) {
                n = Number(n) || 0;
                if (n < 1000) return n.toString();
                if (n < 1000000) return (n / 1000).toFixed(1).replace('.0', '').replace('.', ',') + 'K';
                if (n < 1000000000) return (n / 1000000).toFixed(1).replace('.0', '').replace('.', ',') + 'M';
                return (n / 1000000000).toFixed(1).replace('.0', '').replace('.', ',') + 'B';

            function formatDuration(seconds) {
                if (seconds === null || seconds === undefined || isNaN(seconds)) return '0:00';
                const s = Math.floor(Number(seconds));
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return m + ':' + sec.toString().padStart(2, '0');

            function formatUsername(profile, email) {
                if (!profile) profile = {};
                let un = (profile.username || '').trim();
                if (un.includes('@')) un = un.split('@')[0];

                const d = Math.floor(diff / 86400000);
                if (m < 1) return 'agora';
                if (m < 60) return m + 'm';

                                ${mediaUrls.map((_, i) => `<div class="c-dot ${i===0?'active':''}" onclick="carouselGoTo('${post.id}', ${i})"></div>`).join('')}

                } else if (displayUrl) {
                    mediaHtml = `
                        <div class="post-media" onclick="event.stopPropagation(); goToPost('${post.id}')">
                            <img src="${displayUrl}" alt="Post" loading="lazy">

                } else if (isAudioOnly) {
                    const dur = formatDuration(post.audio_duration || 0);

                        <div class="audio-mini-player" data-audio="${mediaUrl}" data-duration="${post.audio_duration || 0}" onclick="event.stopPropagation();">
                            <button class="am-play" onclick="event.stopPropagation(); toggleAudioPlayer(this)">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="am-info">
                                <div class="am-bar"><div class="am-bar-fill"></div></div>
                                <div class="am-time"><span class="am-current">0:00</span><span class="am-total">${dur}</span></div>

                const optionsBtn = isOwnProfile ? `

                // NOME DE USUÁRIO E @USERNAME RESTAURADOS AQUI
                return `
                    <div class="post-card" data-post-id="${post.id}">

                `;

            // ============================================================
            // LÓGICA DO CARROSSEL
            // ============================================================
            function initPostCarousels() {
                document.querySelectorAll('.media-carousel').forEach(carousel => {
                    if (carousel.dataset.bound) return;
                    carousel.dataset.bound = '1';
                    
                    let startX = 0, startY = 0, isDragging = false, isHorizontal = null;
                    const postId = carousel.id.replace('carousel-', '');

                    carousel.addEventListener('touchstart', (e) => {
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        isDragging = true;
                        isHorizontal = null;
                    }, { passive: true });

                    carousel.addEventListener('touchmove', (e) => {
                        if (!isDragging) return;
                        const dx = e.touches[0].clientX - startX;
                        const dy = e.touches[0].clientY - startY;
                        if (isHorizontal === null) {
                            isHorizontal = Math.abs(dx) > Math.abs(dy);
                        }
                        if (isHorizontal) e.preventDefault();
                    }, { passive: false });

                    carousel.addEventListener('touchend', (e) => {
                        if (!isDragging) return;
                        isDragging = false;
                        const dx = e.changedTouches[0].clientX - startX;
                        if (isHorizontal && Math.abs(dx) > 40) {
                            if (dx < 0) carouselNav(postId, 1);
                            else carouselNav(postId, -1);
                        }
                    }, { passive: true });
                });
            }

            window.carouselNav = function(postId, direction) {
                const carousel = document.getElementById(`carousel-${postId}`);
                if (!carousel) return;
                let current = parseInt(carousel.dataset.current) || 0;
                const total = parseInt(carousel.dataset.total) || 1;
                let next = current + direction;
                if (next < 0) next = 0;
                if (next >= total) next = total - 1;
                carouselGoTo(postId, next);
            };

            window.carouselGoTo = function(postId, index) {
                const carousel = document.getElementById(`carousel-${postId}`);
                if (!carousel) return;
                const track = carousel.querySelector('.carousel-track');
                const dots = carousel.querySelectorAll('.c-dot');
                const counter = carousel.querySelector('.carousel-counter');
                const total = parseInt(carousel.dataset.total) || 1;

                track.style.transform = `translateX(-${index * 100}%)`;
                carousel.dataset.current = index;
                dots.forEach((d, i) => d.classList.toggle('active', i === index));
                counter.innerHTML = `<i class="fas fa-images"></i> ${index + 1}/${total}`;
            };

            // ============================================================
            // SISTEMA DE ÁUDIO
            // ============================================================
            window.toggleAudioPlayer = function(btn) {
                const player = btn.closest('.audio-mini-player');
                if (!player) return;

                const audioUrl = player.dataset.audio;
                const icon = btn.querySelector('i');
                const barFill = player.querySelector('.am-bar-fill');
                const bar = player.querySelector('.am-bar');
                const timeCurrent = player.querySelector('.am-current');
                const timeTotal = player.querySelector('.am-total');

                let audio = audioPlayers[audioUrl];

                if (!audio) {
                    audio = new Audio(audioUrl);
                    audioPlayers[audioUrl] = audio;

                    audio.addEventListener('loadedmetadata', () => {
                        if (isFinite(audio.duration) && audio.duration > 0) {
                            timeTotal.textContent = formatDuration(audio.duration);
                        }
                    });

                    audio.addEventListener('timeupdate', () => {
                        if (!audio.duration || !isFinite(audio.duration)) return;
                        const pct = (audio.currentTime / audio.duration) * 100;
                        barFill.style.width = pct + '%';
                        timeCurrent.textContent = formatDuration(audio.currentTime);
                    });

                    audio.addEventListener('ended', () => {
                        icon.className = 'fas fa-play';
                        barFill.style.width = '0%';
                        timeCurrent.textContent = '0:00';
                    });

                    bar.addEventListener('click', (e) => {
                        if (!audio.duration || !isFinite(audio.duration)) return;
                        const rect = bar.getBoundingClientRect();
                        const pct = (e.clientX - rect.left) / rect.width;
                        audio.currentTime = Math.max(0, Math.min(1, pct)) * audio.duration;
                    });
                }

                if (audio.paused) {
                    Object.keys(audioPlayers).forEach(url => {
                        if (url !== audioUrl && !audioPlayers[url].paused) {
                            audioPlayers[url].pause();
                            document.querySelectorAll(`.audio-mini-player[data-audio="${url}"] .am-play i`).forEach(i => i.className = 'fas fa-play');
                            document.querySelectorAll(`.audio-overlay-play[data-audio="${url}"] i`).forEach(i => i.className = 'fas fa-play');
                        }
                    });
                    audio.play().catch(() => {});
                    icon.className = 'fas fa-pause';
                } else {
                    audio.pause();
                    icon.className = 'fas fa-play';
                }
            };

            window.toggleAudioOverlay = function(btn) {
                const audioUrl = btn.dataset.audio;
                const icon = btn.querySelector('i');
                let audio = audioPlayers[audioUrl];
                const mediaContainer = btn.closest('.post-media');
                const progressBar = mediaContainer.querySelector('.audio-overlay-progress');
                const progressFill = progressBar.querySelector('div');

                if (!audio) {
                    audio = new Audio(audioUrl);
                    audioPlayers[audioUrl] = audio;
                    audio.addEventListener('timeupdate', () => {
                        if (!audio.duration || !isFinite(audio.duration)) return;
                        progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
                    });
                    audio.addEventListener('ended', () => {
                        icon.className = 'fas fa-play';
                        progressFill.style.width = '0%';
                        progressBar.style.display = 'none';
                    });
                }

                if (audio.paused) {
                    Object.keys(audioPlayers).forEach(url => {
                        if (url !== audioUrl && !audioPlayers[url].paused) {
                            audioPlayers[url].pause();
                            document.querySelectorAll(`.audio-overlay-play[data-audio="${url}"] i`).forEach(i => i.className = 'fas fa-play');
                            document.querySelectorAll(`.audio-mini-player[data-audio="${url}"] .am-play i`).forEach(i => i.className = 'fas fa-play');
                        }
                    });
                    audio.play().catch(() => {});
                    icon.className = 'fas fa-pause';
                    progressBar.style.display = 'block';
                } else {
                    audio.pause();
                    icon.className = 'fas fa-play';
                }
            };

            // ============================================================
            // LIKE (Sistema de Trava)
            // ============================================================
            let isLiking = false;
            
            window.toggleLike = async function(btn, postId) {
                if (!currentUser || isLiking) return;
                isLiking = true;

                const icon = btn.querySelector('i');
                const countSpan = btn.querySelector('span');
                const isLiked = userLikedPostIds.has(postId);
                
                let currentCount = parseInt(countSpan.textContent.replace(/[^\d]/g, '')) || 0;
                if (countSpan.textContent.includes('K')) currentCount *= 1000;
                if (countSpan.textContent.includes('M')) currentCount *= 1000000;

                try {
                    if (isLiked) {
                        await supabase.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
                        userLikedPostIds.delete(postId);
                        btn.classList.remove('liked');
                        icon.className = 'far fa-heart';
                        countSpan.textContent = formatNumber(Math.max(0, currentCount - 1));
                    } else {
                        await supabase.from('likes').insert({ post_id: postId, user_id: currentUser.id });
                        userLikedPostIds.add(postId);
                        btn.classList.add('liked');
                        icon.className = 'fas fa-heart';
                        countSpan.textContent = formatNumber(currentCount + 1);
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    isLiking = false;
                }
            };

            // ============================================================
            // EXCLUIR POST
            // ============================================================
            window.openPostOptions = function(e, postId) {
                e.stopPropagation();
                postToDeleteId = postId;
                const menu = document.getElementById('postOptionsMenu');
                const rect = e.currentTarget.getBoundingClientRect();
                menu.style.top = (rect.bottom + 8) + 'px';
                menu.style.left = (rect.right - 180) + 'px';
                menu.classList.add('active');
            };

            window.confirmDeletePost = function() {
                document.getElementById('postOptionsMenu').classList.remove('active');
                document.getElementById('deleteConfirmModal').classList.add('active');
            };

            window.closeDeleteModal = function() {
                document.getElementById('deleteConfirmModal').classList.remove('active');
                postToDeleteId = null;
            };

            window.executeDeletePost = async function() {
                if (!postToDeleteId) return;
                try {
                    const post = allPosts.find(p => p.id === postToDeleteId);
                    if (post && post.media_url && post.media_url.includes('/posts/')) {
                        const fileName = post.media_url.split('/').pop();
                        await supabase.storage.from('posts').remove([fileName]);
                    }
                    if (post && post.audio_url && post.audio_url.includes('/posts/')) {
                        const fileName = post.audio_url.split('/').pop();
                        await supabase.storage.from('posts').remove([fileName]);
                    }

                    const { error } = await supabase.from('posts').delete().eq('id', postToDeleteId).eq('user_id', currentUser.id);
                    if (error) throw error;

                    allPosts = allPosts.filter(p => p.id !== postToDeleteId);
                    filteredPosts = filteredPosts.filter(p => p.id !== postToDeleteId);
                    renderProfile();
                    
                    closeDeleteModal();
                    showToast('Publicação excluída com sucesso', 'success');
                } catch (error) {
                    console.error(error);
                    showToast('Erro ao excluir publicação', 'error');
                }
            };

            document.addEventListener('click', (e) => {
                const menu = document.getElementById('postOptionsMenu');
                if (!menu.contains(e.target) && !e.target.closest('.post-options-btn')) {
                    menu.classList.remove('active');
                }
            });

            // ============================================================
            // AÇÕES RESTANTES
            // ============================================================
            window.toggleFollow = async function() {
                if (!currentUser || isOwnProfile) return;
                const btn = document.querySelector('.btn-follow');
                try {
                    if (isFollowing) {
                        await supabase.from('friends').delete().eq('user_id', currentUser.id).eq('friend_id', profileUserId);
                        isFollowing = false;
                        btn.classList.remove('following');
                        btn.textContent = 'Seguir';
                    } else {
                        await supabase.from('friends').insert({ user_id: currentUser.id, friend_id: profileUserId });
                        isFollowing = true;
                        btn.classList.add('following');
                        btn.textContent = 'Seguindo';
                    }
                } catch (e) {}
            };

            window.editProfile = () => window.location.href = 'definicao.html';
            window.openStory = (u) => window.location.href = 'feed.html?story=' + u;
            window.editBio = function() {
                const newBio = prompt('Digite sua nova bio:', profileData.bio || '');
                if (newBio !== null && newBio.trim() !== profileData.bio) updateBio(newBio.trim());
            };
            async function updateBio(newBio) {
                try {
                    await supabase.from('profiles').update({ bio: newBio }).eq('id', currentUser.id);
                    profileData.bio = newBio;
                    renderProfile();
                    showToast('Bio atualizada', 'success');
                } catch (error) { showToast('Erro ao atualizar bio', 'error'); }
            }

            window.goBack = () => window.history.back();
            window.goToFeed = () => window.location.href = 'feed.html';
            window.goToExplore = () => window.location.href = 'feed.html?tab=explore';
            window.goToCreatePost = () => window.location.href = 'feed.html?tab=create';
            window.goToMyProfile = () => window.location.href = 'perfil.html';
            window.goToPost = (id) => window.location.href = 'post.html?id=' + id;
            window.openNotifications = () => window.location.href = 'notificacoes.html';
            window.openMessages = () => window.location.href = 'chat.html';
            window.openDefinicao = () => window.location.href = 'definicao.html';
            window.filterPosts = filterPosts;

            document.addEventListener('DOMContentLoaded', () => { checkAuth(); });
        })();
    </script>
</body>
</html>
