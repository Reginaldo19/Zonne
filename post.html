<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zonne · Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0b0b12;
            --card-bg: #12121c;
            --border: #1e1e2e;
            --text: #f0f0f5;
            --text-secondary: #a0a0b8;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.2);
            --radius: 16px;
            --transition: 0.25s ease;
            --font: 'Inter', system-ui, sans-serif;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            flex-shrink: 0;
            background: rgba(11, 11, 18, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 40;
        }
        .top-bar .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            font-weight: 600;
            font-size: 15px;
        }
        .top-bar .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .top-bar .title {
            font-weight: 700;
            font-size: 17px;
            color: var(--text);
            flex: 1;
        }

        /* ===== SCROLL PRINCIPAL ===== */
        .post-scroll {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 12px 16px 120px;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
        }
        .post-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .post-scroll::-webkit-scrollbar-thumb {
            background: rgba(108, 99, 255, 0.4);
            border-radius: 10px;
        }
        .post-content-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 4px 0;
        }

        /* ===== CABEÇALHO ===== */
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            position: relative;
        }
        .post-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: border var(--transition);
        }
        .post-header .avatar:hover {
            border-color: var(--accent);
        }
        .post-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-header .avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }
        .post-header .user-info {
            flex: 1;
            min-width: 0;
        }
        .post-header .user-info .name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
            cursor: pointer;
            transition: color var(--transition);
        }
        .post-header .user-info .name:hover {
            color: var(--accent);
        }
        .post-header .user-info .username {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .post-header .time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }
        .post-header .more-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.25);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background var(--transition), color var(--transition);
            line-height: 1;
        }
        .post-header .more-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .more-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 0;
            min-width: 180px;
            z-index: 50;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            margin-top: 4px;
        }
        .more-menu.active {
            display: block;
        }
        .more-menu button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-family: var(--font);
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            text-align: left;
        }
        .more-menu button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .more-menu button i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        .more-menu .danger {
            color: #ff4757;
        }
        .more-menu .danger:hover {
            background: rgba(255, 71, 87, 0.08);
            color: #ff4757;
        }
        .more-menu .save-btn.saved {
            color: #ffd700;
        }
        .more-menu .save-btn.saved i {
            color: #ffd700;
        }

        /* ===== CARD DE DENÚNCIA ===== */
        .report-card-overlay {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 11, 18, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 20px 24px 30px;
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .report-card-overlay.active {
            display: block;
            transform: translateY(0);
        }
        .report-card-overlay .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .report-card-overlay .report-header h3 {
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
        }
        .report-card-overlay .report-header .close-report {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }
        .report-card-overlay .report-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .report-card-overlay .report-body .report-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .report-card-overlay .report-body .report-options button {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .report-card-overlay .report-body .report-options button.active {
            border-color: var(--accent);
            background: rgba(108, 99, 255, 0.15);
            color: #fff;
        }
        .report-card-overlay .report-body .report-options button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .report-card-overlay .report-body textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            color: var(--text);
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            font-family: var(--font);
            outline: none;
            transition: border var(--transition);
        }
        .report-card-overlay .report-body textarea:focus {
            border-color: var(--accent);
        }
        .report-card-overlay .report-body .report-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .report-card-overlay .report-body .report-actions button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            font-family: var(--font);
            transition: all var(--transition);
        }
        .report-card-overlay .report-body .report-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }
        .report-card-overlay .report-body .report-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .report-card-overlay .report-body .report-actions .btn-submit-report {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .report-card-overlay .report-body .report-actions .btn-submit-report:hover {
            transform: scale(1.02);
        }

        /* ===== TEXTO ===== */
        .post-text {
            font-size: 15px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
            padding: 12px 16px;
            border-radius: var(--radius);
            background: transparent;
        }
        .post-text.has-bg {
            font-size: 22px;
            line-height: 1.6;
            text-align: center;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--card-bg);
        }

        /* ===== VÍDEO ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .video-wrapper video {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: cover;
            background: #000;
        }
        .video-wrapper .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
        }
        .video-wrapper .play-overlay:hover {
            background: rgba(0, 0, 0, 0.4);
        }
        .video-wrapper .play-overlay .play-btn-large {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .video-wrapper .play-overlay .play-btn-large:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== ÁUDIO + IMAGEM OVERLAY ===== */
        .audio-img-overlay {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 8px;
        }
        .audio-img-overlay img {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: cover;
        }
        .audio-img-overlay .audio-bg-avatar {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            z-index: 2;
            background: #12121c;
        }
        .audio-img-overlay .audio-bg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-height: none;
        }
        .audio-img-overlay .audio-bg-avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .audio-img-overlay .audio-disc-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3a5a, #1a1a2e);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1), 0 4px 16px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.1s linear;
        }
        .audio-img-overlay .audio-disc-badge.spinning {
            animation: spinDisc 4s linear infinite;
        }
        .audio-img-overlay .audio-disc-badge::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a2a3a;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }
        .audio-img-overlay .audio-disc-badge i {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.15);
            z-index: 2;
        }
        .audio-img-overlay .audio-overlay-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 16px 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.6) 40%, transparent 100%);
        }
        .audio-img-overlay .audio-overlay-controls .audio-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 8px 14px 8px 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .audio-img-overlay .audio-overlay-controls .audio-controls .play-btn {
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .audio-img-overlay .audio-overlay-controls .audio-controls .play-btn:hover {
            transform: scale(1.08);
        }
        .audio-img-overlay .audio-overlay-controls .audio-controls .a-progress {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }
        .audio-img-overlay .audio-overlay-controls .audio-controls .a-progress .a-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c63ff, #9b4dff);
            border-radius: 5px;
            width: 0%;
        }
        .audio-img-overlay .audio-overlay-controls .audio-controls .a-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            min-width: 72px;
            font-variant-numeric: tabular-nums;
            text-align: center;
            font-weight: 500;
        }

        /* ===== ÁUDIO APENAS ===== */
        .audio-player-wrap {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 8px;
            background: var(--card-bg);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 20px 20px;
        }
        .audio-player-wrap .audio-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            filter: blur(18px) brightness(0.6);
            z-index: 0;
            pointer-events: none;
            transform: scale(1.1);
        }
        .audio-player-wrap .audio-bg-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.35;
            pointer-events: none;
        }
        .audio-player-wrap .audio-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .audio-player-wrap .disc {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3a5a, #1a1a2e);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s linear;
            will-change: transform;
            position: relative;
        }
        .audio-player-wrap .disc::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2a2a3a;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .audio-player-wrap .disc .disc-icon {
            font-size: 36px;
            color: rgba(255, 255, 255, 0.15);
            z-index: 2;
        }
        .audio-player-wrap .disc.spinning {
            animation: spinDisc 4s linear infinite;
        }
        @keyframes spinDisc {
            to {
                transform: rotate(360deg);
            }
        }

        .audio-player-wrap .audio-controls {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .audio-player-wrap .audio-controls .play-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .audio-player-wrap .audio-controls .play-btn:hover {
            transform: scale(1.06);
        }
        .audio-player-wrap .audio-controls .a-progress {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .audio-player-wrap .audio-controls .a-progress .a-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            width: 0%;
        }
        .audio-player-wrap .audio-controls .a-time {
            font-size: 13px;
            color: var(--text-secondary);
            min-width: 72px;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* ===== ESTATÍSTICAS E AÇÕES ===== */
        .post-stats {
            display: flex;
            gap: 16px;
            padding: 4px 0 2px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
        }
        .post-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-actions {
            display: flex;
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            margin: 4px 0 6px;
            justify-content: space-between;
            align-items: center;
        }
        .post-actions .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .post-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 25px !important;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 10px;
            border-radius: 10px;
        }
        .post-actions button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .post-actions .like-btn {
            font-size: 24px;
            color: var(--text-secondary);
            padding: 0 4px;
        }
        .post-actions .like-btn.liked {
            color: #ff4757;
        }
        .post-actions .like-btn.liked i {
            animation: heartPop 0.4s ease;
        }
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .post-actions .count-badge {
            font-size: 15px;
            color: var(--text-secondary);
            min-width: 20px;
            text-align: center;
            font-weight: 500;
        }
        .post-actions .count-badge.liked-count {
            color: #ff4757;
        }
        .post-actions .share-btn {
            font-size: 20px;
        }

        /* ===== BADGE DE MENSAGENS ===== */
        .comment-input-fixed .msg-badge {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            margin-right: 4px;
        }
        .comment-input-fixed .msg-badge:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .comment-input-fixed .msg-badge .dot {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 20px;
            background: #ff4757;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ===== COMENTÁRIOS ===== */
        .comments-section {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .comments-section .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comments-section .section-title i {
            color: var(--accent);
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
            border-radius: 8px;
            position: relative;
        }
        .comment-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .comment-item .avatar-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: border 0.2s;
        }
        .comment-item .avatar-mini:hover {
            border-color: var(--accent);
        }
        .comment-item .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .comment-item .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }

        .comment-item .comment-body {
            flex: 1;
            min-width: 0;
        }
        .comment-item .comment-body .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }
        .comment-item .comment-body .name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            transition: color 0.2s;
        }
        .comment-item .comment-body .name:hover {
            color: var(--accent);
        }
        .comment-item .comment-body .time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }
        .comment-item .comment-body .text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            margin-top: 2px;
        }

        /* Botão de deletar comentário */
        .comment-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.2);
            color: #ff4757;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, transform 0.2s;
        }
        .comment-item:hover .comment-delete-btn {
            opacity: 1;
        }
        .comment-delete-btn:hover {
            background: #ff4757;
            color: #fff;
            transform: scale(1.08);
        }

        /* Mini player de áudio no comentário */
        .comment-audio {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 6px 12px 6px 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 300px;
        }
        .comment-audio .ca-play {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .comment-audio .ca-play:hover {
            transform: scale(1.06);
        }
        .comment-audio .ca-progress {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            min-width: 60px;
        }
        .comment-audio .ca-progress .ca-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            width: 0%;
        }
        .comment-audio .ca-time {
            font-size: 11px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 32px;
            text-align: right;
        }

        /* ===== PREVIEW DE ÁUDIO NO INPUT ===== */
        .comment-input-fixed .audio-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(108, 99, 255, 0.15);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            width: 100%;
        }
        .comment-input-fixed .audio-preview-bar.active {
            display: flex;
        }
        .comment-input-fixed .audio-preview-bar .ap-play {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .comment-input-fixed .audio-preview-bar .ap-play:hover {
            transform: scale(1.06);
        }
        .comment-input-fixed .audio-preview-bar .ap-progress {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            min-width: 60px;
        }
        .comment-input-fixed .audio-preview-bar .ap-progress .ap-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            width: 0%;
        }
        .comment-input-fixed .audio-preview-bar .ap-time {
            font-size: 12px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 40px;
            text-align: right;
        }
        .comment-input-fixed .audio-preview-bar .ap-cancel {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .comment-input-fixed .audio-preview-bar .ap-cancel:hover {
            background: #ff4757;
            color: #fff;
        }

        /* ===== INPUT DE COMENTÁRIO ===== */
        .comment-input-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 11, 18, 0.96);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 10px 16px 14px;
            z-index: 50;
        }
        .comment-input-fixed .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .comment-input-fixed .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0 16px;
            transition: border 0.3s;
            min-height: 44px;
        }
        .comment-input-fixed .input-wrapper:focus-within {
            border-color: var(--accent);
        }
        .comment-input-fixed .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
            resize: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.4;
            overflow-y: auto;
            height: 24px;
        }
        .comment-input-fixed .input-wrapper textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .comment-input-fixed .audio-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .comment-input-fixed .audio-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .comment-input-fixed .audio-btn.recording {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
            animation: pulseRec 1s infinite;
        }
        @keyframes pulseRec {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
        }

        /* Timer de gravação flutuante */
        .recording-timer {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 71, 87, 0.95);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 500;
            box-shadow: 0 8px 32px rgba(255, 71, 87, 0.4);
            backdrop-filter: blur(8px);
        }
        .recording-timer.active {
            display: flex;
        }
        .recording-timer .rt-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .comment-input-fixed .send-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font);
            box-shadow: 0 4px 16px var(--accent-glow);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .comment-input-fixed .send-btn:hover {
            transform: scale(1.05);
        }
        .comment-input-fixed .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== LOADING / ERRO ===== */
        .loading-spinner {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }
        .loading-spinner i {
            font-size: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .error-state i {
            font-size: 44px;
            margin-bottom: 12px;
        }
        .error-state h3 {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 17px;
        }
        .error-state p {
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===== REELS OVERLAY ===== */
        .reels-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            overflow: hidden;
        }
        .reels-overlay.active {
            display: flex;
        }
        .reels-overlay .reels-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        .reels-overlay .reels-wrapper .reels-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-height: 100vh;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-close-top {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 20;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 30px;
            cursor: pointer;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            transition: color 0.3s;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-close-top:hover {
            color: #fff;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 80px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-name {
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-caption {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-family: var(--font);
            font-weight: 400;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 6px 14px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            display: inline-block;
            max-width: 100%;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-actions {
            position: absolute;
            bottom: 40px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            z-index: 10;
            align-items: center;
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-actions button {
            background: none;
            border: none;
            color: #fff;
            font-size: 40px !important;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: transform 0.2s, color 0.2s;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-actions button:hover {
            transform: scale(1.1);
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-actions button .reels-count {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
        }
        .reels-overlay .reels-wrapper .reels-slide .reels-actions .reels-like-btn.liked {
            color: #ff4757;
        }

        /* ===== USER CARD ===== */
        .user-card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .user-card-overlay.active {
            display: flex;
        }
        .user-card {
            background: #14141e;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            padding: 28px 24px 24px;
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            animation: cardPop 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        @keyframes cardPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .user-card .close-card {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: color var(--transition);
        }
        .user-card .close-card:hover {
            color: #fff;
        }
        .user-card .avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 12px;
            border: 3px solid rgba(255, 255, 255, 0.06);
        }
        .user-card .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-card .avatar-large .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
        }
        .user-card .name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }
        .user-card .username {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .user-card .bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin: 6px 0 14px;
        }
        .user-card .stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 16px;
        }
        .user-card .stats .stat {
            text-align: center;
        }
        .user-card .stats .stat .number {
            font-weight: 700;
            font-size: 17px;
            color: var(--text);
        }
        .user-card .stats .stat .label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .user-card .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .user-card .card-actions button {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: var(--font);
            transition: all var(--transition);
        }
        .user-card .card-actions .btn-follow {
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .user-card .card-actions .btn-follow:hover {
            transform: scale(1.04);
        }
        .user-card .card-actions .btn-follow.following {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            box-shadow: none;
        }
        .user-card .card-actions .btn-follow.following:hover {
            background: rgba(255, 71, 87, 0.12);
            color: #ff4757;
        }
        .user-card .card-actions .btn-profile {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }
        .user-card .card-actions .btn-profile:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ===== CONFIRM MODAL ===== */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 9998;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirm-modal.active {
            display: flex;
        }
        .confirm-modal .confirm-box {
            background: #1a1a24;
            border-radius: 20px;
            max-width: 380px;
            width: 100%;
            padding: 24px;
            border: 1px solid var(--border);
            animation: cardPop 0.25s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .confirm-modal .confirm-box h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .confirm-modal .confirm-box p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .confirm-modal .confirm-box .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .confirm-modal .confirm-box .confirm-actions button {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: var(--font);
            transition: all var(--transition);
        }
        .confirm-modal .confirm-box .confirm-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }
        .confirm-modal .confirm-box .confirm-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .confirm-modal .confirm-box .confirm-actions .btn-confirm {
            background: #ff4757;
            color: #fff;
        }
        .confirm-modal .confirm-box .confirm-actions .btn-confirm:hover {
            background: #e63946;
        }

        @media (max-width: 640px) {
            .post-scroll { padding: 8px 12px 140px; }
            .post-actions button { font-size: 20px !important; padding: 8px 6px; }
            .post-actions .like-btn { font-size: 20px; }
            .post-actions .count-badge { font-size: 14px; }
            .audio-player-wrap .disc { width: 80px; height: 80px; }
            .audio-player-wrap .disc .disc-icon { font-size: 28px; }
            .video-wrapper .play-overlay .play-btn-large { width: 56px; height: 56px; font-size: 26px; }

                    const onOk = function() { cleanup(); resolve(true); };
                    const onCancel = function() { cleanup(); resolve(false); };
                    ok.addEventListener('click', onOk);
                    cancel.addEventListener('click', onCancel);

            // ============================================================
            // FORMATAÇÃO DE TEMPO (BLINDADA)
            // ============================================================
            function formatDuration(seconds) {
                if (seconds === null || seconds === undefined) return '0:00';
                let s = Number(seconds);
                if (!isFinite(s) || isNaN(s) || s < 0) return '0:00';
                s = Math.floor(s);
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return m + ':' + sec.toString().padStart(2, '0');
            }

            function getTimeAgo(date) {
                const diff = Date.now() - new Date(date).getTime();
                const m = Math.floor(diff / 60000),
                    h = Math.floor(diff / 3600000),
                    d = Math.floor(diff / 86400000);
                if (m < 1) return 'agora';
                if (m < 60) return `${m}m`;
                if (h < 24) return `${h}h`;
                if (d < 7) return `${d}d`;
                return new Date(date).toLocaleDateString('pt-BR');
            }

            function escapeHtml(text) {

            // ============================================================

            // ============================================================
            // LOAD POST

                try {
                    const { data, error } = await supabase
                        .from('posts')
                        .select(`

                        .from('likes')
                        .select('id', { count: 'exact', head: true })
                        .eq('post_id', postId);

                    await loadUserLikes();
                    await checkSaved();
                    renderPost();
                    loadComments();

                } catch (err) {
                    console.error(err);
                    container.innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>

                        </div>
                    `;

                if (!currentUser) return;
                const { data, error } = await supabase
                    .from('likes')
                    .select('post_id')
                    .eq('user_id', currentUser.id);

                userLikes = new Set(data.map(l => l.post_id));

            async function checkSaved() {
                if (!currentUser || !postData) return;

                    .from('saved_posts')
                    .select('post_id')
                    .eq('user_id', currentUser.id)

            // ============================================================
            // RENDER POST
            // ============================================================
            function renderPost() {
                const post = postData;
                const profile = post.profiles || {};
                const avatarUrl = profile.avatar_url;
                const avatarColor = profile.avatar_color || '#6c63ff';

                const hasBg = post.background_color && post.background_color !== 'none';

                    } else if (post.media_type === 'video') {

                                <div class="audio-content">
                                    <div class="disc"><div class="disc-icon"><i class="fas fa-music"></i></div></div>
                                    <div class="audio-controls">
                                        <button class="play-btn"><i class="fas fa-play"></i></button>
                                        <div class="a-progress"><div class="a-fill"></div></div>
                                        <span class="a-time">0:00 / ${formatDuration(duration)}</span>
                                    </div>
                                </div>

                    }
                }

                container.innerHTML = `

                                <div class="name" onclick="openUserCard('${profile.id}')">${profile.full_name || 'Usuário'}</div>

                                <button onclick="goToUserProfile('${profile.id}')">

                                </button>
                                <button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave()">
                                    <i class="${isSaved ? 'fas' : 'far'} fa-bookmark"></i> ${isSaved ? 'Salvo' : 'Salvar'}
                                </button>
                                <button class="danger" onclick="openReport()">
                                    <i class="fas fa-flag"></i> Denunciar

                        </div>

                        ${post.content ? `<div class="post-text ${textClass}" style="${bgStyle}">${escapeHtml(post.content)}</div>` : ''}
                        ${mediaHtml}

                        <div class="post-stats">

            // ============================================================
            // PLAYER DE ÁUDIO

            function pauseAllAudioPlayers(except) {
                activeAudioPlayers.forEach(player => {
                    if (player !== except && player.audio && !player.audio.paused) {
                        try {
                            player.audio.pause();
                            player.audio.currentTime = 0;
                        } catch(e) {}
                        if (player.playBtn) player.playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        if (player.disc) player.disc.classList.remove('spinning');
                        if (player.discBadge) player.discBadge.classList.remove('spinning');
                        if (player.fill) player.fill.style.width = '0%';
                        if (player.timeDisplay && player.safeDuration > 0) {
                            player.timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                        }
                    }
                });
            }

            function setupAudioPlayer(config) {
                const { audioUrl, playBtn, progress, fill, timeDisplay, disc, discBadge, declaredDuration } = config;
                if (!audioUrl) return;

                const audio = new Audio();
                audio.preload = 'metadata';
                audio.src = audioUrl;

                const player = {
                    audio, playBtn, fill, timeDisplay, disc, discBadge, progress,
                    safeDuration: declaredDuration || 0
                };
                activeAudioPlayers.add(player);

                audio.addEventListener('loadedmetadata', () => {
                    if (isFinite(audio.duration) && audio.duration > 0) {
                        player.safeDuration = audio.duration;
                        if (timeDisplay) timeDisplay.textContent = '0:00 / ' + formatDuration(audio.duration);
                    } else if (timeDisplay && player.safeDuration > 0) {
                        timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                    }
                });

                audio.addEventListener('canplay', () => {
                    if (isFinite(audio.duration) && audio.duration > 0) {
                        player.safeDuration = audio.duration;
                    }
                });

                audio.addEventListener('timeupdate', () => {
                    const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : player.safeDuration;
                    if (!dur || !isFinite(dur) || dur <= 0) {
                        if (timeDisplay) timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                        return;
                    }
                    const pct = (audio.currentTime / dur) * 100;
                    if (isFinite(pct) && fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
                    if (timeDisplay) timeDisplay.textContent = formatDuration(audio.currentTime) + ' / ' + formatDuration(dur);
                });

                audio.addEventListener('ended', () => {
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    if (disc) disc.classList.remove('spinning');
                    if (discBadge) discBadge.classList.remove('spinning');
                    if (fill) fill.style.width = '0%';
                    if (timeDisplay) timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                });

                audio.addEventListener('error', (e) => {
                    console.error('Erro ao carregar áudio:', audioUrl, e);
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    if (timeDisplay) timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                });

                playBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!audio.paused) {
                        audio.pause();
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        if (disc) disc.classList.remove('spinning');
                        if (discBadge) discBadge.classList.remove('spinning');
                    } else {
                        pauseAllAudioPlayers(player);
                        const p = audio.play();
                        if (p && p.catch) p.catch(() => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        if (disc) disc.classList.add('spinning');
                        if (discBadge) discBadge.classList.add('spinning');
                    }
                });

                progress.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : player.safeDuration;
                    if (!dur || !isFinite(dur) || dur <= 0) return;
                    const rect = progress.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    if (isFinite(pct)) audio.currentTime = Math.max(0, Math.min(1, pct)) * dur;
                });

                return player;
            }

            function initAudioPlayers() {
                document.querySelectorAll('.audio-player-wrap').forEach(wrap => {

            // ============================================================
            // INPUT DE COMENTÁRIO (texto + áudio)
            // ============================================================
            function setupCommentInput() {
                const textarea = document.getElementById('commentInput');
                const sendBtn = document.getElementById('sendCommentBtn');
                const audioBtn = document.getElementById('audioCommentBtn');
                const apPlayBtn = document.getElementById('apPlayBtn');
                const apCancelBtn = document.getElementById('apCancelBtn');
                const apProgress = document.getElementById('apProgress');

                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
                });

                textarea.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendComment();
                    }
                });

                sendBtn.addEventListener('click', sendComment);

                audioBtn.addEventListener('click', toggleRecording);

                // Play/pause do preview
                apPlayBtn.addEventListener('click', function() {
                    if (!recordedAudioPlayer) return;
                    if (recordedAudioPlayer.paused) {
                        recordedAudioPlayer.play();
                        this.innerHTML = '<i class="fas fa-pause"></i>';
                    } else {
                        recordedAudioPlayer.pause();
                        this.innerHTML = '<i class="fas fa-play"></i>';
                    }
                });

                // Cancelar gravação
                apCancelBtn.addEventListener('click', function() {
                    clearRecordedAudio();
                });

                // Progress do preview
                apProgress.addEventListener('click', function(e) {
                    if (!recordedAudioPlayer) return;
                    const rect = this.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    if (recordedAudioPlayer.duration && isFinite(recordedAudioPlayer.duration)) {
                        recordedAudioPlayer.currentTime = Math.max(0, Math.min(1, pct)) * recordedAudioPlayer.duration;
                    }
                });

                document.getElementById('msgBadge').addEventListener('click', function() {
                    window.location.href = 'chat.html';
                });
            }

            // ============================================================
            // GRAVAÇÃO DE ÁUDIO COM PREVIEW
            // ============================================================
            async function toggleRecording() {
                const audioBtn = document.getElementById('audioCommentBtn');
                if (isRecording) {
                    stopRecording();
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.addEventListener('dataavailable', event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener('stop', async () => {
                        stream.getTracks().forEach(track => track.stop());

                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (audioBlob.size === 0) return;

                        recordedAudioBlob = audioBlob;
                        recordedAudioUrl = URL.createObjectURL(audioBlob);
                        recordedAudioDuration = Math.max(1, Math.round((Date.now() - recordingStartTime) / 1000));

                        // Cria player de preview
                        if (recordedAudioPlayer) {
                            recordedAudioPlayer.pause();
                            recordedAudioPlayer = null;
                        }
                        recordedAudioPlayer = new Audio(recordedAudioUrl);

                        recordedAudioPlayer.addEventListener('loadedmetadata', () => {
                            if (isFinite(recordedAudioPlayer.duration) && recordedAudioPlayer.duration > 0) {
                                recordedAudioDuration = Math.round(recordedAudioPlayer.duration);
                            }
                        });

                        recordedAudioPlayer.addEventListener('timeupdate', () => {
                            if (!recordedAudioPlayer.duration) return;
                            const pct = (recordedAudioPlayer.currentTime / recordedAudioPlayer.duration) * 100;
                            document.getElementById('apFill').style.width = pct + '%';
                            document.getElementById('apTime').textContent =
                                formatDuration(Math.floor(recordedAudioPlayer.currentTime)) + ' / ' +
                                formatDuration(Math.floor(recordedAudioPlayer.duration));
                        });

                        recordedAudioPlayer.addEventListener('ended', () => {
                            document.getElementById('apPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                            document.getElementById('apFill').style.width = '0%';
                            document.getElementById('apTime').textContent = '0:00';
                        });

                        // Mostra barra de preview
                        document.getElementById('audioPreviewBar').classList.add('active');
                        document.getElementById('apTime').textContent = '0:00 / ' + formatDuration(recordedAudioDuration);
                        document.getElementById('apPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                        document.getElementById('apFill').style.width = '0%';

                        // Habilita botão enviar
                        sendBtn.disabled = false;
                    });

                    mediaRecorder.start();
                    isRecording = true;
                    recordingStartTime = Date.now();
                    audioBtn.classList.add('recording');
                    audioBtn.innerHTML = '<i class="fas fa-stop"></i>';

                    // Timer flutuante
                    const timerEl = document.getElementById('recordingTimer');
                    timerEl.classList.add('active');
                    const timeEl = document.getElementById('recordingTime');

                    recordingTimerInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                        timeEl.textContent = formatDuration(elapsed);
                        // Limite 2 minutos
                        if (elapsed >= 120) {
                            stopRecording();
                        }
                    }, 250);

                } catch (err) {
                    console.error('Erro ao acessar microfone:', err);
                    alert('Não foi possível acessar o microfone. Verifique as permissões.');
                }
            }

            function stopRecording() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                isRecording = false;
                const audioBtn = document.getElementById('audioCommentBtn');
                audioBtn.classList.remove('recording');
                audioBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                audioBtn.title = 'Gravar áudio';
                if (recordingTimerInterval) {
                    clearInterval(recordingTimerInterval);
                    recordingTimerInterval = null;
                }
                document.getElementById('recordingTimer').classList.remove('active');
            }

            function clearRecordedAudio() {
                if (recordedAudioPlayer) {
                    recordedAudioPlayer.pause();
                    recordedAudioPlayer = null;
                }
                if (recordedAudioUrl) {
                    URL.revokeObjectURL(recordedAudioUrl);
                    recordedAudioUrl = null;
                }
                recordedAudioBlob = null;
                recordedAudioDuration = 0;
                document.getElementById('audioPreviewBar').classList.remove('active');
                document.getElementById('apFill').style.width = '0%';
                document.getElementById('apTime').textContent = '0:00';
            }

            // ============================================================
            // ENVIAR COMENTÁRIO (texto + áudio juntos)
            // ============================================================
            async function sendComment() {
                const textarea = document.getElementById('commentInput');
                const content = textarea.value.trim();
                const hasAudio = !!recordedAudioBlob;

                if (!content && !hasAudio) {
                    textarea.focus();
                    return;
                }

                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                try {
                    let audioUrl = null;
                    let audioDuration = 0;

                    // Se tem áudio, faz upload
                    if (hasAudio) {
                        const fileName = `comment_audio_${currentUser.id}_${Date.now()}.webm`;
                        const { data: uploadData, error: uploadError } = await supabase.storage
                            .from('audio')
                            .upload(fileName, recordedAudioBlob, {
                                contentType: 'audio/webm',
                                cacheControl: '3600'
                            });

                        if (uploadError) throw new Error('Erro no upload: ' + uploadError.message);

                        const { data: urlData } = supabase.storage
                            .from('audio')
                            .getPublicUrl(fileName);

                        audioUrl = urlData.publicUrl;
                        audioDuration = recordedAudioDuration || 0;
                    }

                    // Insere comentário (com ou sem áudio)
                    const insertData = {
                        post_id: postData.id,
                        user_id: currentUser.id,
                        content: content || ''
                    };
                    if (audioUrl) {
                        insertData.audio_url = audioUrl;
                        insertData.audio_duration = audioDuration;
                    }

                    const { error } = await supabase.from('comments').insert(insertData);
                    if (error) throw error;

                    // Limpa tudo
                    textarea.value = '';
                    textarea.style.height = 'auto';
                    clearRecordedAudio();

                    // Recarrega comentários
                    loadComments();

                    postData.comments_count = (postData.comments_count || 0) + 1;
                    const countSpan = document.querySelector('.comment-count');
                    if (countSpan) countSpan.textContent = postData.comments_count;

                    setTimeout(() => {
                        scrollEl.scrollTop = scrollEl.scrollHeight;
                    }, 200);

                } catch (e) {
                    console.error('Erro ao enviar:', e);
                    alert('Erro ao enviar: ' + e.message);
                }

                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }

            // ============================================================
            // DELETAR COMENTÁRIO
            // ============================================================
            async function deleteComment(commentId) {
                const confirmed = await showConfirm(
                    'Apagar comentário',
                    'Tem certeza que deseja apagar este comentário? Esta ação não pode ser desfeita.'
                );
                if (!confirmed) return;

                try {
                    // Busca o comentário pra deletar o áudio do storage também
                    const { data: comment } = await supabase
                        .from('comments')
                        .select('*')
                        .eq('id', commentId)
                        .single();

                    // Deleta o comentário
                    const { error } = await supabase
                        .from('comments')
                        .delete()
                        .eq('id', commentId)
                        .eq('user_id', currentUser.id);

                    if (error) throw error;

                    // Se tiver áudio, tenta deletar do storage
                    if (comment && comment.audio_url) {
                        try {
                            const fileName = comment.audio_url.split('/').pop();
                            await supabase.storage.from('audio').remove([fileName]);
                        } catch (e) {
                            console.warn('Não foi possível apagar o áudio do storage:', e);
                        }
                    }

                    // Atualiza contador
                    postData.comments_count = Math.max(0, (postData.comments_count || 1) - 1);
                    const countSpan = document.querySelector('.comment-count');
                    if (countSpan) countSpan.textContent = postData.comments_count;

                    loadComments();

                } catch (e) {
                    console.error('Erro ao deletar comentário:', e);
                    alert('Erro ao apagar comentário: ' + e.message);
                }
            }

            window.deleteComment = deleteComment;
