            function initCommentAudioPlayers() {
                document.querySelectorAll('.comment-audio').forEach(wrap => {
                    const audioUrl = wrap.dataset.audio;
                    const playBtn = wrap.querySelector('.ca-play');
                    const progress = wrap.querySelector('.ca-progress');
                    const fill = wrap.querySelector('.ca-fill');
                    const timeDisplay = wrap.querySelector('.ca-time');

                    let audio = new Audio(audioUrl);
                    let isPlaying = false;

                    playBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (isPlaying) {
                            audio.pause();
                            playBtn.innerHTML = '<i class="fas fa-play"></i>';
                            isPlaying = false;
                        } else {
                            // Pausa outros players
                            document.querySelectorAll('.comment-audio').forEach(other => {
                                if (other !== wrap && other._audio && !other._audio.paused) {
                                    other._audio.pause();
                                    other._playBtn.innerHTML = '<i class="fas fa-play"></i>';
                                    other._playing = false;
                                }
                            });
                            pauseAllAudioPlayers(null);
                            audio.play().catch(() => {});
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            isPlaying = true;
                        }
                    });

                    audio.addEventListener('timeupdate', () => {
                        if (!audio.duration || !isFinite(audio.duration)) return;
                        const pct = (audio.currentTime / audio.duration) * 100;
                        fill.style.width = pct + '%';
                        timeDisplay.textContent = formatDuration(Math.floor(audio.currentTime));
                    });

                    audio.addEventListener('ended', () => {
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        isPlaying = false;
                        fill.style.width = '0%';
                        timeDisplay.textContent = '0:00';
                    });

                    audio.addEventListener('error', (e) => {
                        console.error('Erro no áudio do comentário:', e);
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    });

                    progress.addEventListener('click', (e) => {
                        if (!audio.duration || !isFinite(audio.duration)) return;
                        const rect = progress.getBoundingClientRect();
                        const pct = (e.clientX - rect.left) / rect.width;
                        audio.currentTime = Math.max(0, Math.min(1, pct)) * audio.duration;
                    });

                    wrap._audio = audio;
                    wrap._playBtn = playBtn;
                    wrap._playing = false;
                });
            }

            // ============================================================
            // REELS
            // ============================================================
            window.openReels = function(postId) {
                let videoPosts = [];
                if (postData && postData.media_type === 'video') {
                    videoPosts = [postData];
                } else {
                    supabase
                        .from('posts')
                        .select(`*, profiles:user_id (id, full_name, username, avatar_url, avatar_color)`)
                        .eq('media_type', 'video')
                        .neq('user_id', currentUser.id)
                        .order('created_at', { ascending: false })
                        .limit(30)
                        .then(({ data, error }) => {
                            if (!error && data) {
                                videoPosts = data;
                                const idx = videoPosts.findIndex(p => p.id === postId);
                                if (idx > 0) {
                                    const clicked = videoPosts.splice(idx, 1)[0];
                                    videoPosts.unshift(clicked);
                                }
                                reelsPosts = videoPosts;
                                currentReelsIndex = 0;
                                renderReels();
                                document.getElementById('reelsOverlay').classList.add('active');
                            }
                        });
                    return;
                }
                reelsPosts = videoPosts;
                currentReelsIndex = 0;
                renderReels();
                document.getElementById('reelsOverlay').classList.add('active');
            };

            function renderReels() {
                const wrapper = document.getElementById('reelsWrapper');
                wrapper.innerHTML = '';
                reelsPosts.forEach((post, idx) => {
                    const slide = document.createElement('div');
                    slide.className = 'reels-slide';
                    slide.dataset.index = idx;
                    slide.style.transform = `translateY(${idx * 100}%)`;
                    slide.innerHTML = createReelsSlide(post, idx);
                    wrapper.appendChild(slide);
                });
                updateReelsPosition();
                setupReelsSwipe();
                attachReelsEvents();
            }

            function createReelsSlide(post, idx) {
                const profile = post.profiles || {};
                const avatarUrl = profile.avatar_url;
                const avatarColor = profile.avatar_color || '#6c63ff';
                const initial = (profile.full_name || 'U')[0].toUpperCase();
                const isLiked = userLikes.has(post.id);
                const likeCount = post.likes_count || 0;
                const commentCount = post.comments_count || 0;
                const caption = post.content || '';

                return `
                    <div class="reels-video-container">
                        <video src="${post.media_url}" playsinline preload="metadata"></video>
                    </div>
                    <button class="reels-close-top" onclick="closeReels()">&times;</button>
                    <div class="reels-bottom">
                        <div class="reels-user">
                            <div class="reels-avatar">
                                ${avatarUrl ? `<img src="${avatarUrl}" alt="Avatar">` :
                                `<div class="fallback" style="background:${avatarColor};">${initial}</div>`}
                            </div>
                            <span class="reels-name">${profile.full_name || 'Usuário'}</span>
                        </div>
                        <div class="reels-caption">${escapeHtml(caption)}</div>
                    </div>
                    <div class="reels-actions">
                        <button class="reels-like-btn ${isLiked ? 'liked' : ''}" data-postid="${post.id}">
                            <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                            <span class="reels-count">${likeCount}</span>
                        </button>
                        <button class="reels-comment-toggle" data-postid="${post.id}">
                            <i class="far fa-comment"></i>
                            <span class="reels-count">${commentCount}</span>
                        </button>
                        <button onclick="sharePost()">
                            <i class="fas fa-share-alt"></i>
                        </button>
                    </div>
                `;
            }

            function updateReelsPosition() {
                const slides = document.querySelectorAll('#reelsWrapper .reels-slide');
                slides.forEach((slide, idx) => {
                    const offset = idx - currentReelsIndex;
                    slide.style.transform = `translateY(${offset * 100}%)`;
                });
                slides.forEach((slide, idx) => {
                    const video = slide.querySelector('video');
                    if (video) {
                        if (idx === currentReelsIndex) {
                            video.play().catch(() => {});
                            video.muted = false;
                        } else {
                            video.pause();
                            video.muted = true;
                        }
                    }
                });
            }

            function setupReelsSwipe() {
                const wrapper = document.getElementById('reelsWrapper');
                let startY = 0,
                    isDragging = false;

                const handleStart = (y) => { startY = y; isDragging = true; };
                const handleMove = (y) => {
                    if (!isDragging) return;
                    const delta = y - startY;
                    const maxDrag = 150;
                    const clamped = Math.max(-maxDrag, Math.min(maxDrag, delta));
                    document.querySelectorAll('#reelsWrapper .reels-slide').forEach((slide) => {
                        const idx = parseInt(slide.dataset.index);
                        const offset = idx - currentReelsIndex;
                        slide.style.transition = 'none';
                        slide.style.transform = `translateY(${offset * 100 + (clamped / window.innerHeight) * 100}%)`;
                    });
                };
                const handleEnd = (y) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const delta = y - startY;
                    const threshold = window.innerHeight * 0.2;
                    if (Math.abs(delta) > threshold) {
                        if (delta < 0 && currentReelsIndex < reelsPosts.length - 1) currentReelsIndex++;
                        else if (delta > 0 && currentReelsIndex > 0) currentReelsIndex--;
                    }
                    document.querySelectorAll('#reelsWrapper .reels-slide').forEach(s => s.style.transition =
                        'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)');
                    updateReelsPosition();
                };

                wrapper.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientY), { passive: true });
                wrapper.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientY), { passive: true });
                wrapper.addEventListener('touchend', (e) => handleEnd(e.changedTouches[0].clientY), { passive: true });
                let mouseDown = false;
                wrapper.addEventListener('mousedown', (e) => { mouseDown = true; handleStart(e.clientY); });
                wrapper.addEventListener('mousemove', (e) => { if (mouseDown) handleMove(e.clientY); });
                wrapper.addEventListener('mouseup', (e) => { if (mouseDown) { mouseDown = false; handleEnd(e.clientY); } });
                wrapper.addEventListener('mouseleave', () => { if (mouseDown) { mouseDown = false; handleEnd(0); } });
            }

            function attachReelsEvents() {
                document.querySelectorAll('.reels-like-btn').forEach(btn => {
                    btn.onclick = async function(e) {
                        e.stopPropagation();
                        const postId = this.dataset.postid;
                        await toggleLike(postId);
                        const post = reelsPosts.find(p => p.id === postId);
                        if (post) {
                            const isLiked = userLikes.has(postId);
                            this.classList.toggle('liked', isLiked);
                            this.querySelector('i').className = isLiked ? 'fas fa-heart' : 'far fa-heart';
                            this.querySelector('.reels-count').textContent = post.likes_count || 0;
                        }
                    };
                });
            }

            window.closeReels = function() {
                document.getElementById('reelsOverlay').classList.remove('active');
                document.querySelectorAll('#reelsWrapper video').forEach(v => v.pause());
                reelsPosts = [];
                currentReelsIndex = 0;
                document.getElementById('reelsWrapper').innerHTML = '';
            };

            // ============================================================
            // LIKE
            // ============================================================
            window.toggleLike = async function(postId) {
                if (!currentUser) return;
                const btn = document.querySelector(`.like-btn[data-post-id="${postId}"]`);
                const countSpan = document.getElementById(`like-count-${postId}`);
                let count = parseInt(countSpan ? countSpan.textContent : '0') || 0;

                try {
                    if (userLikes.has(postId)) {
                        const { data } = await supabase
                            .from('likes')
                            .select('id')
                            .eq('post_id', postId)
                            .eq('user_id', currentUser.id)
                            .maybeSingle();
                        if (data) await supabase.from('likes').delete().eq('id', data.id);
                        userLikes.delete(postId);
                        if (btn) { btn.classList.remove('liked'); btn.innerHTML = '<i class="far fa-heart"></i>'; }
                        count = Math.max(0, count - 1);
                        if (countSpan) { countSpan.textContent = count; countSpan.classList.remove('liked-count'); }
                        if (postData && postData.id === postId) postData.likes_count = count;
                    } else {
                        await supabase.from('likes').insert({ post_id: postId, user_id: currentUser.id });
                        userLikes.add(postId);
                        if (btn) { btn.classList.add('liked'); btn.innerHTML = '<i class="fas fa-heart"></i>'; }
                        count++;
                        if (countSpan) { countSpan.textContent = count; countSpan.classList.add('liked-count'); }
                        if (postData && postData.id === postId) postData.likes_count = count;
                    }
                } catch (e) { console.error(e); }
            };

            window.sharePost = function() {
                const url = window.location.href;
                if (navigator.share) navigator.share({ title: 'Zonne', text: 'Veja esta publicação!', url }).catch(() => {});
                else navigator.clipboard.writeText(url).then(() => alert('Link copiado!')).catch(() => alert('Compartilhe: ' + url));
            };

            // ============================================================
            // USER CARD
            // ============================================================
            window.openUserCard = async function(userId) {
                const overlay = document.getElementById('userCardOverlay');
                const content = document.getElementById('userCardContent');
                overlay.classList.add('active');
                content.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);"><i class="fas fa-spinner fa-spin"></i> Carregando…</div>';

                const { data: profile, error } = await supabase.from('profiles').select('*').eq('id', userId).single();

                if (error || !profile) {
                    content.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">Perfil não encontrado</div>';
                    return;
                }

                const isOwn = userId === currentUser.id;
                let isFollowing = false;
                if (!isOwn) {
                    const { data: followData } = await supabase
                        .from('friends').select('id').eq('user_id', currentUser.id).eq('friend_id', userId).maybeSingle();
                    isFollowing = !!followData;
                }

                const avatarUrl = profile.avatar_url;
                const color = profile.avatar_color || '#6c63ff';
                const initial = (profile.full_name || 'U')[0].toUpperCase();

                content.innerHTML = `
                    <button class="close-card" onclick="closeUserCard()">&times;</button>
                    <div class="avatar-large">
                        ${avatarUrl ? `<img src="${avatarUrl}" alt="Avatar">` :
                        `<div class="fallback" style="background:${color};">${initial}</div>`}
                    </div>
                    <div class="name">${profile.full_name || 'Usuário'}</div>
                    <div class="username">@${profile.username || 'usuario'}</div>
                    ${profile.bio ? `<div class="bio">${escapeHtml(profile.bio)}</div>` : ''}
                    <div class="stats">
                        <div class="stat">
                            <div class="number">${profile.followers_count || 0}</div>
                            <div class="label">Seguidores</div>
                        </div>
                        <div class="stat">
                            <div class="number">${profile.following_count || 0}</div>
                            <div class="label">Seguindo</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        ${!isOwn ? `
                            <button class="btn-follow ${isFollowing ? 'following' : ''}" onclick="toggleFollowCard('${userId}')">
                                ${isFollowing ? '<i class="fas fa-check"></i> Seguindo' : '<i class="fas fa-plus"></i> Seguir'}
                            </button>
                            <button class="btn-profile" onclick="closeUserCard(); goToUserProfile('${userId}')">
                                <i class="fas fa-user"></i> Ver perfil
                            </button>
                        ` : `
                            <button class="btn-profile" onclick="closeUserCard(); goToMyProfile()">
                                <i class="fas fa-user"></i> Meu perfil
                            </button>
                        `}
                    </div>
                `;
            };

            window.closeUserCard = function() {
                document.getElementById('userCardOverlay').classList.remove('active');
            };

            window.toggleFollowCard = async function(userId) {
                const btn = document.querySelector('.btn-follow');
                if (!btn) return;
                try {
                    const isFollowing = btn.classList.contains('following');
                    if (isFollowing) {
                        await supabase.from('friends').delete().eq('user_id', currentUser.id).eq('friend_id', userId);
                        btn.classList.remove('following');
                        btn.innerHTML = '<i class="fas fa-plus"></i> Seguir';
                    } else {
                        await supabase.from('friends').insert({ user_id: currentUser.id, friend_id: userId });
                        btn.classList.add('following');
                        btn.innerHTML = '<i class="fas fa-check"></i> Seguindo';
                    }
                } catch (e) { console.error(e); }
            };

            window.goToUserProfile = function(userId) {
                document.getElementById('moreMenu')?.classList.remove('active');
                window.location.href = `perfil.html?id=${userId}`;
            };
            window.goToMyProfile = function() {
                if (currentUser) window.location.href = 'perfil.html';
            };
            window.goBack = function() {
                window.history.back();
            };

            // ============================================================
            // SALVAR / DENÚNCIA
            // ============================================================
            window.toggleSave = async function() {
                if (!currentUser || !postData) return;
                const saveBtn = document.querySelector('.save-btn');
                const icon = saveBtn.querySelector('i');
                const isSaved = saveBtn.classList.contains('saved');

                try {
                    if (isSaved) {
                        const { data } = await supabase
                            .from('saved_posts').select('id').eq('user_id', currentUser.id).eq('post_id', postData.id).maybeSingle();
                        if (data) await supabase.from('saved_posts').delete().eq('id', data.id);
                        savedPosts.delete(postData.id);
                        saveBtn.classList.remove('saved');
                        icon.className = 'far fa-bookmark';
                        saveBtn.textContent = ' Salvar';
                    } else {
                        await supabase.from('saved_posts').insert({ user_id: currentUser.id, post_id: postData.id });
                        savedPosts.add(postData.id);
                        saveBtn.classList.add('saved');
                        icon.className = 'fas fa-bookmark';
                        saveBtn.textContent = ' Salvo';
                    }
                    document.getElementById('moreMenu').classList.remove('active');
                } catch (e) { alert('Erro: ' + e.message); }
            };

            window.openReport = function() {
                document.getElementById('moreMenu').classList.remove('active');
                document.getElementById('reportCard').classList.add('active');
                document.querySelectorAll('#reportOptions button').forEach(b => b.classList.remove('active'));
                document.getElementById('reportDetails').value = '';
            };

            window.closeReport = function() {
                document.getElementById('reportCard').classList.remove('active');
            };

            window.submitReport = function() {
                const selected = document.querySelector('#reportOptions button.active');
                const reason = selected ? selected.dataset.reason : 'Não especificado';
                const details = document.getElementById('reportDetails').value.trim();

                if (!selected) { alert('Selecione um motivo.'); return; }

                const body = `Denúncia (ID: ${postData.id})\nMotivo: ${reason}\nDetalhes: ${details || 'Nenhum'}\nDenunciante: ${currentProfile?.full_name || 'Anônimo'}\nData: ${new Date().toLocaleString()}`;
                window.location.href = `mailto:reginaldomuanza83@gmail.com?subject=Denúncia&body=${encodeURIComponent(body)}`;
                closeReport();
                alert('Denúncia enviada.');
            };

            document.querySelectorAll('#reportOptions button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#reportOptions button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', () => {
                checkAuth();
                setInterval(loadUnreadMessagesCount, 30000);

                // Previne pull-to-refresh indesejado na parte superior
                let touchStartY = 0;
                scrollEl.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });
                scrollEl.addEventListener('touchmove', (e) => {
                    const y = e.touches[0].clientY;
                    const delta = y - touchStartY;
                    if (scrollEl.scrollTop <= 0 && delta > 0) {
                        e.preventDefault();
                    }
                }, { passive: false });
            });

            // Expor funções globais
            window.openReels = openReels;
            window.closeReels = closeReels;
            window.toggleLike = toggleLike;
            window.sharePost = sharePost;
            window.openUserCard = openUserCard;
            window.closeUserCard = closeUserCard;
            window.toggleFollowCard = toggleFollowCard;
            window.goToUserProfile = goToUserProfile;
            window.goToMyProfile = goToMyProfile;
            window.toggleSave = toggleSave;
            window.openReport = openReport;
            window.closeReport = closeReport;
            window.submitReport = submitReport;
            window.deleteComment = deleteComment;
            window.goBack = goBack;
        })();
    </script>
</body>
</html>
