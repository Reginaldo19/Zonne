<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zonne · Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & VARIÁVEIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b12;
            --card-bg: #12121c;
            --border: #1e1e2e;
            --text: #f0f0f5;
            --text-secondary: #a0a0b8;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.2);
            --radius: 16px;
            --transition: 0.25s ease;
            --font: 'Inter', system-ui, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 18, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 19px;
            color: #fff;
            cursor: pointer;
        }

        .top-bar .logo i {
            font-size: 22px;
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            padding: 7px 9px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar .actions .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 19px;
            cursor: pointer;
            position: relative;
            padding: 6px;
            border-radius: 50%;
            transition: background var(--transition), color var(--transition);
        }

        .top-bar .actions .icon-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .top-bar .actions .icon-btn .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #ff4757;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid var(--bg);
        }

        .top-bar .avatar-mini {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: border var(--transition), transform var(--transition);
            flex-shrink: 0;
            position: relative;
        }

        .top-bar .avatar-mini:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .top-bar .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-bar .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }

        .top-bar .avatar-mini .badge-avatar {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #ff4757;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid var(--bg);
        }

        /* ===== FEED ===== */
        .container {
            max-width: 100%;
            padding: 0 12px 20px;
        }

        /* ===== STORIES ===== */
        .stories-row {
            display: flex;
            gap: 14px;
            padding: 16px 6px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .stories-row::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            flex-shrink: 0;
            width: 72px;
            text-align: center;
            cursor: pointer;
            transition: transform var(--transition);
        }

        .story-item:hover {
            transform: translateY(-2px);
        }

        .story-item .story-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            margin-bottom: 5px;
            position: relative;
            transition: box-shadow var(--transition);
        }

        .story-item .story-circle:hover {
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .story-item .story-circle .inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #14141e;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
            position: relative;
        }

        .story-item .story-circle .inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-item .story-circle .inner .fallback {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
        }

        .story-item .story-circle .inner .story-text-preview {
            font-size: 10px;
            color: #fff;
            text-align: center;
            padding: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-weight: 600;
            line-height: 1.2;
            word-break: break-word;
        }

        .story-item .story-name {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 72px;
        }

        .story-item.add-story .story-circle {
            background: rgba(255, 255, 255, 0.04);
        }

        .story-item.add-story .story-circle .inner {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            font-size: 24px;
            color: rgba(255, 255, 255, 0.15);
        }

        .story-item.add-story .story-name {
            color: var(--accent);
        }

        /* ===== CREATE POST MINI ===== */
        .create-post {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin: 0 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border var(--transition), background var(--transition);
        }

        .create-post:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: #18182a;
        }

        .create-post .avatar-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .create-post .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .create-post .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }

        .create-post input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 10px 18px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
            transition: all var(--transition);
            cursor: pointer;
        }

        .create-post input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0;
            margin: 0 0 18px;
            overflow: hidden;
            transition: all var(--transition);
            animation: fadeUp 0.4s ease forwards;
            opacity: 0;
        }

        .post-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-card .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px 8px;
        }

        .post-card .post-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: border var(--transition);
        }

        .post-card .post-header .avatar:hover {
            border-color: var(--accent);
        }

        .post-card .post-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-card .post-header .avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .post-card .post-header .user-info {
            flex: 1;
            min-width: 0;
        }

        .post-card .post-header .user-info .name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
            cursor: pointer;
            transition: color var(--transition);
        }

        .post-card .post-header .user-info .name:hover {
            color: var(--accent);
        }

        .post-card .post-header .user-info .username {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .post-card .post-header .time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }

        /* ===== CONTEÚDO ===== */
        .post-card .post-content-wrapper {
            padding: 0 16px 12px;
        }

        .post-card .post-content-wrapper .post-text {
            font-size: 15px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            word-break: break-word;
            white-space: pre-wrap;
            padding: 12px 16px;
            margin: 0 -16px;
            background: transparent;
        }

        /* ===== MÍDIA ===== */
        .post-card .post-media {
            width: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .post-card .post-media img {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: cover;
            cursor: pointer;
        }

        .post-card .post-media .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        .post-card .post-media .video-wrapper video {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: cover;
            background: #000;
        }

        .post-card .post-media .video-wrapper .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
            cursor: pointer;
        }

        .post-card .post-media .video-wrapper .play-overlay:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .post-card .post-media .video-wrapper .play-overlay .play-btn-large {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .post-card .post-media .video-wrapper .play-overlay .play-btn-large:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== ÁUDIO COM IMAGEM (overlay) ===== */
        .post-card .post-media .audio-img-overlay {
            position: relative;
            width: 100%;
            background: #000;
        }

        .post-card .post-media .audio-img-overlay img {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: cover;
            cursor: pointer;
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 16px 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.6) 40%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card .post-media .audio-img-overlay .audio-bg-avatar {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            z-index: 2;
            background: #12121c;
        }

        .post-card .post-media .audio-img-overlay .audio-bg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-height: none;
        }

        .post-card .post-media .audio-img-overlay .audio-bg-avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .post-card .post-media .audio-img-overlay .audio-disc-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3a5a, #1a1a2e);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1), 0 4px 16px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.1s linear;
        }

        .post-card .post-media .audio-img-overlay .audio-disc-badge.spinning {
            animation: spinDisc 4s linear infinite;
        }

        .post-card .post-media .audio-img-overlay .audio-disc-badge::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a2a3a;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }

        .post-card .post-media .audio-img-overlay .audio-disc-badge i {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.15);
            z-index: 2;
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 8px 14px 8px 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls .play-btn {
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls .play-btn:hover {
            transform: scale(1.08);
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls .a-progress {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls .a-progress .a-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c63ff, #9b4dff);
            border-radius: 5px;
            width: 0%;
            position: relative;
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls .a-progress .a-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls:hover .a-fill::after {
            opacity: 1;
        }

        .post-card .post-media .audio-img-overlay .audio-overlay-controls .audio-controls .a-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            min-width: 72px;
            font-variant-numeric: tabular-nums;
            text-align: center;
            font-weight: 500;
        }

        /* ===== ÁUDIO APENAS (disco) ===== */
        .post-card .post-media .audio-player-wrap {
            background: #12121c;
            padding: 24px 16px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .post-card .post-media .audio-player-wrap .audio-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.15;
            background-size: cover;
            background-position: center;
            filter: blur(30px) saturate(1.5);
            transform: scale(1.2);
            z-index: 0;
        }

        .post-card .post-media .audio-player-wrap .disc {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3a5a, #1a1a2e);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.04), 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s linear;
            will-change: transform;
            position: relative;
            z-index: 1;
        }

        .post-card .post-media .audio-player-wrap .disc::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2a2a3a;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .post-card .post-media .audio-player-wrap .disc .disc-icon {
            font-size: 40px;
            color: rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .post-card .post-media .audio-player-wrap .disc.spinning {
            animation: spinDisc 4s linear infinite;
        }

        @keyframes spinDisc {
            to {
                transform: rotate(360deg);
            }
        }

        .post-card .post-media .audio-player-wrap .audio-controls {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .post-card .post-media .audio-player-wrap .audio-controls .play-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .post-card .post-media .audio-player-wrap .audio-controls .play-btn:hover {
            transform: scale(1.06);
        }

        .post-card .post-media .audio-player-wrap .audio-controls .a-progress {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .post-card .post-media .audio-player-wrap .audio-controls .a-progress .a-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            width: 0%;
        }

        .post-card .post-media .audio-player-wrap .audio-controls .a-time {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 80px;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        /* ===== BOTÕES DE AÇÃO ===== */
        .post-card .post-actions {
            display: flex;
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            margin: 0 0 6px;
            justify-content: space-between;
            align-items: center;
        }

        .post-card .post-actions .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-card .post-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 25px !important;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 10px;
            border-radius: 10px;
        }

        .post-card .post-actions button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .post-card .post-actions .like-btn {
            font-size: 24px;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        .post-card .post-actions .like-btn.liked {
            color: #ff4757;
        }

        .post-card .post-actions .like-btn.liked i {
            animation: heartPop 0.4s ease;
        }

        @keyframes heartPop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }

        .post-card .post-actions .count-badge {
            font-size: 15px;
            color: var(--text-secondary);
            min-width: 20px;
            text-align: center;
            font-weight: 500;
        }

        .post-card .post-actions .count-badge.liked-count {
            color: #ff4757;
        }

        .post-card .post-actions .share-btn {
            font-size: 20px;
        }

        /* ===== REELS OVERLAY ===== */
        .reels-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            overflow: hidden;
        }

        .reels-overlay.active {
            display: flex;
        }

        .reels-overlay .reels-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .reels-overlay .reels-wrapper .reels-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-height: 100vh;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-close-top {
            position: absolute;
            top: 16px;
            right: 20px;
            z-index: 20;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 30px;
            cursor: pointer;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            transition: color 0.3s;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-close-top:hover {
            color: #fff;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 80px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-name {
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-caption {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-family: var(--font);
            font-weight: 400;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 6px 14px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            display: inline-block;
            max-width: 100%;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-actions {
            position: absolute;
            bottom: 40px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            z-index: 10;
            align-items: center;
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-actions button {
            background: none;
            border: none;
            color: #fff;
            font-size: 40px !important;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: transform 0.2s, color 0.2s;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-actions button:hover {
            transform: scale(1.1);
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-actions button .reels-count {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
        }

        .reels-overlay .reels-wrapper .reels-slide .reels-actions .reels-like-btn.liked {
            color: #ff4757;
        }

        /* ===== LOADING / EMPTY ===== */
        .loading-spinner {
            text-align: center;
            padding: 50px 0;
            color: var(--text-secondary);
        }

        .loading-spinner i {
            font-size: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 44px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 17px;
        }

        .empty-state p {
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(11, 11, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 4px 0 env(safe-area-inset-bottom, 8px) 0;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 14px;
            transition: color var(--transition), transform var(--transition);
            position: relative;
            font-family: var(--font);
        }

        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }

        .bottom-nav .nav-item:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .bottom-nav .nav-item .badge-nav {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff4757;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid var(--bg);
        }

        .bottom-nav .nav-item .nav-icon .plus-circle {
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            margin-top: -16px;
            box-shadow: 0 6px 24px var(--accent-glow);
            transition: transform var(--transition);
        }

        .bottom-nav .nav-item .nav-icon .plus-circle:hover {
            transform: scale(1.06);
        }

        /* ===== CREATE POST PAGE ===== */
        .page {
            display: none;
            max-width: 100%;
            padding: 16px 12px 40px;
            min-height: 80vh;
        }

        .page.active {
            display: block;
        }

        .page .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            padding: 8px 0 16px;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color var(--transition);
        }

        .page .back-btn:hover {
            color: #fff;
        }

        .create-post-page {
            max-width: 600px;
            margin: 0 auto;
        }

        .create-post-page .create-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .create-post-page .create-header .create-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        .create-post-page .create-header .create-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .create-post-page .create-header .create-avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
        }

        .create-post-page .create-header .create-user-info .name {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }

        .create-post-page .create-header .create-user-info .username {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .create-post-page textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            resize: vertical;
            min-height: 140px;
            font-family: var(--font);
            outline: none;
            transition: border var(--transition);
            line-height: 1.6;
        }

        .create-post-page textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .create-post-page textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .create-post-page .media-actions {
            display: flex;
            gap: 10px;
            margin: 16px 0;
            flex-wrap: wrap;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .create-post-page .media-actions .media-btn {
            flex: 1;
            min-width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font);
            transition: all var(--transition);
        }

        .create-post-page .media-actions .media-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .create-post-page .media-actions .media-btn i {
            font-size: 22px;
            color: var(--accent);
        }

        .create-post-page .media-actions .media-btn.active {
            background: rgba(108, 99, 255, 0.15);
            border-color: var(--accent);
            color: #fff;
        }

        .create-post-page .media-status {
            font-size: 13px;
            color: var(--text-secondary);
            margin-left: 4px;
            width: 100%;
            text-align: center;
        }

        .create-post-page .mention-custom {
            position: relative;
            margin: 12px 0;
        }

        .create-post-page .mention-custom input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 12px 18px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
            transition: border var(--transition);
        }

        .create-post-page .mention-custom input:focus {
            border-color: var(--accent);
        }

        .create-post-page .mention-custom .mention-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-height: 180px;
            overflow-y: auto;
            z-index: 50;
            padding: 4px 0;
        }

        .create-post-page .mention-custom .mention-dropdown.active {
            display: block;
        }

        .create-post-page .mention-custom .mention-dropdown .mention-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            cursor: pointer;
            transition: background var(--transition);
        }

        .create-post-page .mention-custom .mention-dropdown .mention-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .create-post-page .mention-custom .mention-dropdown .mention-item img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .create-post-page .mention-custom .mention-dropdown .mention-item .fallback {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }

        .create-post-page .mention-custom .mention-dropdown .mention-item .name {
            font-size: 14px;
            color: var(--text);
        }

        .create-post-page .mention-custom .mention-dropdown .mention-item .username {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .create-post-page .preview-container {
            display: none;
            margin-bottom: 16px;
            border-radius: var(--radius);
            overflow: hidden;
            max-height: 320px;
            background: #000;
            border: 1px solid var(--border);
            position: relative;
        }

        .create-post-page .preview-container .preview-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: background 0.2s;
        }

        .create-post-page .preview-container .preview-remove:hover {
            background: #ff4757;
        }

        .create-post-page .preview-container img,
        .create-post-page .preview-container video {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
        }

        .create-post-page .audio-selector {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin: 12px 0;
            display: none;
        }

        .create-post-page .audio-selector .audio-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .create-post-page .audio-selector .audio-options button {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
            font-family: var(--font);
            font-size: 14px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .create-post-page .audio-selector .audio-options button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .create-post-page .audio-selector .audio-options button i {
            color: var(--accent);
        }

        .create-post-page .audio-recorder {
            display: none;
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius);
            padding: 16px;
        }

        .create-post-page .audio-recorder .recorder-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .create-post-page .audio-recorder .recorder-controls .record-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #ff4757;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(255, 71, 87, 0.3);
        }

        .create-post-page .audio-recorder .recorder-controls .record-btn.recording {
            animation: pulseRed 1.2s infinite;
        }

        @keyframes pulseRed {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(255, 71, 87, 0);
            }
        }

        .create-post-page .audio-recorder .recorder-controls .timer {
            font-size: 16px;
            color: var(--text-secondary);
            min-width: 55px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .create-post-page .audio-recorder .recorder-controls .wave-visual {
            flex: 1;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 3px;
            min-width: 80px;
        }

        .create-post-page .audio-recorder .recorder-controls .wave-visual .bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            transition: height 0.1s;
        }

        .create-post-page .audio-recorder .recorder-controls .wave-visual .bar.active {
            background: var(--accent);
        }

        .create-post-page .audio-recorder .recorder-controls .controls-group {
            display: flex;
            gap: 6px;
        }

        .create-post-page .audio-recorder .recorder-controls .controls-group button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .create-post-page .audio-recorder .recorder-controls .controls-group button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .create-post-page .audio-recorder .recorder-controls .controls-group button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .create-post-page .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            box-shadow: 0 4px 20px var(--accent-glow);
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .create-post-page .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .create-post-page .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== EXPLORE ===== */
        .explore-page .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .explore-page .explore-grid .explore-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: var(--radius);
            cursor: pointer;
            background: #000;
            position: relative;
            transition: transform var(--transition);
        }

        .explore-page .explore-grid .explore-item:hover {
            transform: scale(1.02);
            z-index: 2;
        }

        .explore-page .explore-grid .explore-item img,
        .explore-page .explore-grid .explore-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .explore-page .explore-grid .explore-item .explore-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            display: flex;
            gap: 14px;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .explore-page .explore-grid .explore-item:hover .explore-overlay {
            opacity: 1;
        }

        .explore-page .explore-grid .explore-item .explore-overlay span {
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .explore-page .explore-grid .explore-item .explore-overlay span i {
            font-size: 14px;
        }

        /* ===== STORY FULLSCREEN ===== */
        .story-fullscreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .story-fullscreen.active {
            display: flex;
        }

        .story-fullscreen .story-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            position: relative;
            background: #12121c;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .story-fullscreen .story-progress {
            display: flex;
            gap: 4px;
            padding: 10px 14px 0;
            flex-shrink: 0;
        }

        .story-fullscreen .story-progress .p-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .story-fullscreen .story-progress .p-bar .p-fill {
            height: 100%;
            background: #fff;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .story-fullscreen .story-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
        }

        .story-fullscreen .story-header .s-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .story-fullscreen .story-header .s-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-fullscreen .story-header .s-avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }

        .story-fullscreen .story-header .s-name {
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            flex: 1;
        }

        .story-fullscreen .story-header .s-time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .story-fullscreen .story-header .s-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color var(--transition);
        }

        .story-fullscreen .story-header .s-close:hover {
            color: #fff;
        }

        .story-fullscreen .story-header .s-delete {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.3s;
            margin-left: 4px;
        }

        .story-fullscreen .story-header .s-delete:hover {
            color: #ff6b81;
        }

        .story-fullscreen .story-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .story-fullscreen .story-body img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .story-fullscreen .story-body video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .story-fullscreen .story-body .story-text-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .story-fullscreen .story-body .story-text-container .story-text-content {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .story-fullscreen .story-body .story-caption {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .story-fullscreen .story-nav {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.1);
            font-size: 30px;
            transition: color 0.3s;
        }

        .story-fullscreen .story-nav:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .story-fullscreen .story-nav.prev {
            left: 0;
        }

        .story-fullscreen .story-nav.next {
            right: 0;
        }

        /* ===== MODAL CRIAR STORY ===== */
        .story-create-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 400;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex-direction: column;
        }

        .story-create-overlay.active {
            display: flex;
        }

        .story-create-overlay .story-create-box {
            background: #14141e;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 32px 24px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .story-create-overlay .story-create-box h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text);
        }

        .story-create-overlay .story-create-box .create-options {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .story-create-overlay .story-create-box .create-options button {
            flex: 1;
            min-width: 80px;
            padding: 16px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            cursor: pointer;
            font-family: var(--font);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .story-create-overlay .story-create-box .create-options button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .story-create-overlay .story-create-box .create-options button i {
            font-size: 28px;
            color: var(--accent);
        }

        .story-create-overlay .story-create-box .create-close {
            margin-top: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 8px 16px;
            font-family: var(--font);
            transition: color 0.3s;
        }

        .story-create-overlay .story-create-box .create-close:hover {
            color: #fff;
        }

        /* ===== STORY TEXT EDITOR ===== */
        .story-text-editor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            z-index: 500;
            flex-direction: column;
            padding: 20px;
        }

        .story-text-editor.active {
            display: flex;
        }

        .story-text-editor .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .story-text-editor .editor-header button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.3s;
        }

        .story-text-editor .editor-header button:hover {
            color: #fff;
        }

        .story-text-editor .editor-header .editor-title {
            font-weight: 600;
            font-size: 17px;
            color: #fff;
        }

        .story-text-editor .editor-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 16px;
        }

        .story-text-editor .editor-body .color-picker-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .story-text-editor .editor-body .color-picker-grid .color-opt {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .story-text-editor .editor-body .color-picker-grid .color-opt:hover {
            transform: scale(1.1);
        }

        .story-text-editor .editor-body .color-picker-grid .color-opt.active {
            border-color: #fff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .story-text-editor .editor-body textarea {
            width: 100%;
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            border-radius: var(--radius);
            padding: 16px;
            color: #fff;
            font-size: 18px;
            resize: none;
            font-family: var(--font);
            outline: none;
            min-height: 150px;
            white-space: pre-wrap;
        }

        .story-text-editor .editor-body textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .story-text-editor .editor-body .btn-publish-story {
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .story-text-editor .editor-body .btn-publish-story:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .story-text-editor .editor-body .btn-publish-story:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== STORY MEDIA PREVIEW ===== */
        .story-media-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 500;
            flex-direction: column;
        }

        .story-media-preview.active {
            display: flex;
        }

        .story-media-preview .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
            z-index: 10;
        }

        .story-media-preview .preview-header button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.3s;
        }

        .story-media-preview .preview-header button:hover {
            color: #fff;
        }

        .story-media-preview .preview-header .preview-title {
            font-weight: 600;
            font-size: 17px;
            color: #fff;
        }

        .story-media-preview .preview-media {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .story-media-preview .preview-media img,
        .story-media-preview .preview-media video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .story-media-preview .preview-caption {
            padding: 16px 20px 24px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .story-media-preview .preview-caption textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 12px;
            color: #fff;
            font-size: 15px;
            resize: none;
            min-height: 60px;
            font-family: var(--font);
            outline: none;
            white-space: pre-wrap;
        }

        .story-media-preview .preview-caption textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .story-media-preview .preview-caption .btn-publish-media {
            padding: 12px;
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .story-media-preview .preview-caption .btn-publish-media:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .story-media-preview .preview-caption .btn-publish-media:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== USER CARD OVERLAY ===== */
        .user-card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .user-card-overlay.active {
            display: flex;
        }

        .user-card {
            background: #14141e;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            padding: 28px 24px 24px;
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            animation: cardPop 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        @keyframes cardPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .user-card .close-card {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: color var(--transition);
        }

        .user-card .close-card:hover {
            color: #fff;
        }

        .user-card .avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 12px;
            border: 3px solid rgba(255, 255, 255, 0.06);
        }

        .user-card .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-card .avatar-large .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
        }

        .user-card .name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .user-card .username {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .user-card .bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin: 6px 0 14px;
        }

        .user-card .stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 16px;
        }

        .user-card .stats .stat {
            text-align: center;
        }

        .user-card .stats .stat .number {
            font-weight: 700;
            font-size: 17px;
            color: var(--text);
        }

        .user-card .stats .stat .label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .user-card .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .user-card .card-actions button {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: var(--font);
            transition: all var(--transition);
        }

        .user-card .card-actions .btn-follow {
            background: linear-gradient(135deg, #6c63ff, #9b4dff);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .user-card .card-actions .btn-follow:hover {
            transform: scale(1.04);
        }

        .user-card .card-actions .btn-follow.following {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            box-shadow: none;
        }

        .user-card .card-actions .btn-follow.following:hover {
            background: rgba(255, 71, 87, 0.12);
            color: #ff4757;
        }

        .user-card .card-actions .btn-profile {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }

        .user-card .card-actions .btn-profile:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .container {
                padding: 0 8px 20px;
            }

            .post-card {
                margin: 0 0 14px;
                border-radius: 12px;
            }

            .post-card .post-header {
                padding: 12px 14px 6px;
            }

            .post-card .post-content-wrapper {
                padding: 0 14px 10px;
            }

            .post-card .post-content-wrapper .post-text {
                padding: 10px 14px;
                margin: 0 -14px;
                font-size: 14px;
            }

            .post-card .post-actions {
                padding: 6px 12px;
            }

            .post-card .post-actions button {
                font-size: 18px;
            }

            .post-card .post-actions .like-btn {
                font-size: 20px;
            }

            .post-card .post-actions .count-badge {
                font-size: 14px;
            }

            .post-card .post-media .audio-player-wrap .disc {
                width: 90px;
                height: 90px;
            }

            .post-card .post-media .video-wrapper .play-overlay .play-btn-large {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }

            .story-item {
                width: 64px;
            }

            .story-item .story-circle {
                width: 64px;
                height: 64px;
            }

            .bottom-nav .nav-item {
                padding: 2px 8px;
                font-size: 20px;
            }

            .bottom-nav .nav-item span {
                font-size: 8px;
            }

            .bottom-nav .nav-item .nav-icon .plus-circle {
                width: 42px;
                height: 42px;
                font-size: 20px;
                margin-top: -12px;
            }

            .user-card {
                padding: 20px;
            }

            .user-card .avatar-large {
                width: 72px;
                height: 72px;
            }

            .story-fullscreen .story-body .story-text-container .story-text-content {
                font-size: 22px;
            }

            .story-fullscreen .story-nav {
                width: 30%;
                font-size: 24px;
            }

            .explore-page .explore-grid {
                gap: 4px;
            }

            .top-bar {
                padding: 8px 14px;
            }

            .top-bar .logo {
                font-size: 17px;
            }

            .top-bar .logo i {
                font-size: 19px;
                padding: 6px 8px;
            }

            .reels-overlay .reels-wrapper .reels-slide .reels-actions button {
                font-size: 34px;
            }

            .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-caption {
                font-size: 14px;
            }

            .reels-overlay .reels-wrapper .reels-slide .reels-bottom .reels-user .reels-name {
                font-size: 16px;
            }

            .story-create-overlay .story-create-box {
                padding: 24px 16px;
            }

            .story-create-overlay .story-create-box .create-options button {
                min-width: 60px;
                padding: 12px 6px;
                font-size: 13px;
            }

            .story-text-editor .editor-body textarea {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOP BAR ===== -->
    <header class="top-bar">
        <div class="logo" onclick="goToFeed()">
            <i class="fas fa-users"></i>
            <span>Zonne</span>
        </div>
        <div class="actions">
            <button class="icon-btn" onclick="openNotifications()" aria-label="Notificações">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge" style="display:none;">0</span>
            </button>
            <button class="icon-btn" onclick="openFriends()" aria-label="Amigos">
                <i class="fas fa-users"></i>
                <span class="badge" id="friendBadge" style="display:none;">0</span>
            </button>
            <div class="avatar-mini" id="userAvatar" onclick="goToMyProfile()">
                <div class="fallback"><i class="fas fa-user"></i></div>
                <span class="badge-avatar" id="followBadge" style="display:none;">0</span>
            </div>
        </div>
    </header>

    <!-- ===== FEED ===== -->
    <div class="feed-page" id="feedPage">
        <div class="container">
            <div class="stories-row" id="storiesRow">
                <div class="story-item add-story" onclick="openStoryCreateOptions()">
                    <div class="story-circle"><div class="inner"><i class="fas fa-plus"></i></div></div>
                    <div class="story-name">Seu story</div>
                </div>
            </div>

            <div class="create-post" onclick="goToCreatePost()">
                <div class="avatar-mini" id="createPostAvatar">
                    <div class="fallback"><i class="fas fa-user"></i></div>
                </div>
                <input type="text" placeholder="O que você está pensando?" readonly />
            </div>

            <div id="feedPosts">
                <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
            </div>
        </div>
    </div>

    <!-- ===== PÁGINA DE CRIAÇÃO ===== -->
    <div class="page create-post-page" id="createPostPage">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Voltar</button>
        
        <div class="create-header">
            <div class="create-avatar" id="createPageAvatar">
                <div class="fallback"><i class="fas fa-user"></i></div>
            </div>
            <div class="create-user-info">
                <div class="name" id="createPageName">Usuário</div>
                <div class="username" id="createPageUsername">@usuario</div>
            </div>
        </div>

        <textarea id="createPostContent" placeholder="O que você está pensando?…"></textarea>

        <div class="media-actions">
            <button class="media-btn" onclick="document.getElementById('createImageInput').click()">
                <i class="fas fa-image"></i> Foto
            </button>
            <button class="media-btn" onclick="document.getElementById('createVideoInput').click()">
                <i class="fas fa-video"></i> Vídeo
            </button>
            <button class="media-btn" onclick="toggleAudioSelector()">
                <i class="fas fa-microphone"></i> Áudio
            </button>
            <span class="media-status" id="createMediaStatus"></span>
        </div>

        <input type="file" id="createImageInput" accept="image/*" style="display:none;" onchange="handleFileSelect(event, 'image')" />
        <input type="file" id="createVideoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(event, 'video')" />
        <input type="file" id="createAudioInput" accept="audio/*" style="display:none;" onchange="handleAudioFileSelect(event)" />

        <div class="preview-container" id="createPreview">
            <button class="preview-remove" onclick="removePreview()"><i class="fas fa-times"></i></button>
            <img id="createPreviewImg" style="display:none;" />
            <video id="createPreviewVideo" style="display:none;" controls></video>
        </div>

                        .from('messages')

                        .neq('sender_id', currentUser.id)

            // ============================================================
