<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialConnect - Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
        }
        .top-bar .logo i {
            font-size: 22px;
            background: linear-gradient(135deg, #5850ec, #764ba2);
            padding: 7px 8px;
            border-radius: 10px;
            color: #fff;
        }
        .top-bar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-bar .actions .icon-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 18px;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
            padding: 4px;
        }
        .top-bar .actions .icon-btn:hover { color: #fff; }
        .top-bar .actions .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #e74c3c;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .top-bar .avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: border 0.3s;
            flex-shrink: 0;
        }
        .top-bar .avatar-mini:hover { border-color: #5850ec; }
        .top-bar .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .top-bar .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 0 20px;
        }

        .stories-row {
            display: flex;
            gap: 12px;
            padding: 12px 16px 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .stories-row::-webkit-scrollbar { display: none; }
        .story-item {
            flex-shrink: 0;
            width: 68px;
            text-align: center;
            cursor: pointer;
        }
        .story-item .story-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #5850ec, #764ba2);
            margin-bottom: 4px;
            transition: transform 0.2s;
            position: relative;
        }
        .story-item .story-circle:hover { transform: scale(1.04); }
        .story-item .story-circle .inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #1a1a24;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0a0a0f;
            position: relative;
        }
        .story-item .story-circle .inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .story-item .story-circle .inner .fallback {
            font-size: 26px;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
        }
        .story-item .story-circle .inner .story-text-preview {
            font-size: 10px;
            color: #fff;
            text-align: center;
            padding: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-weight: 600;
        }
        .story-item .story-name {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 68px;
        }
        .story-item.add-story .story-circle {
            background: rgba(255,255,255,0.05);
        }
        .story-item.add-story .story-circle .inner {
            border: 2px dashed rgba(255,255,255,0.12);
            font-size: 22px;
            color: rgba(255,255,255,0.2);
        }
        .story-item.add-story .story-name { color: #5850ec; }

        .create-post {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 12px 16px;
            margin: 0 16px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border 0.3s;
        }
        .create-post:hover { border-color: rgba(255,255,255,0.08); }
        .create-post .avatar-mini {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        .create-post .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .create-post .avatar-mini .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .create-post input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 9px 16px;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            cursor: pointer;
        }
        .create-post input::placeholder { color: rgba(255,255,255,0.2); }

        .post-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 14px 16px;
            margin: 0 16px 14px;
            transition: all 0.3s;
        }
        .post-card:hover { border-color: rgba(255,255,255,0.07); }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .post-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.04);
            cursor: pointer;
        }
        .post-header .avatar:hover { border-color: #5850ec; }
        .post-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-header .avatar .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .post-header .user-info {
            flex: 1;
            min-width: 0;
        }
        .post-header .user-info .name {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
        }
        .post-header .user-info .name:hover { color: #5850ec; }
        .post-header .user-info .username {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            cursor: pointer;
        }
        .post-header .user-info .username:hover { color: rgba(255,255,255,0.5); }
        .post-header .time {
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.8);
            margin-bottom: 10px;
            cursor: pointer;
        }

        .post-media {
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.02);
            max-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .post-media img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }
        .post-media video {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
        }
        .post-media .audio-player {
            width: 100%;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.02);
        }
        .post-media .audio-player .wave {
            flex: 1;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .post-media .audio-player .wave span {
            width: 3px;
            background: #5850ec;
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }
        .post-media .audio-player .wave span:nth-child(1) { height: 20%; animation-delay: 0s; }
        .post-media .audio-player .wave span:nth-child(2) { height: 40%; animation-delay: 0.2s; }
        .post-media .audio-player .wave span:nth-child(3) { height: 60%; animation-delay: 0.4s; }
        .post-media .audio-player .wave span:nth-child(4) { height: 80%; animation-delay: 0.6s; }
        .post-media .audio-player .wave span:nth-child(5) { height: 60%; animation-delay: 0.8s; }
        .post-media .audio-player .wave span:nth-child(6) { height: 40%; animation-delay: 1.0s; }
        .post-media .audio-player .wave span:nth-child(7) { height: 20%; animation-delay: 1.2s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }
        .post-media .audio-player .duration {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            min-width: 36px;
        }
        .post-media .audio-player .play-audio {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #5850ec;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .post-media .audio-player .play-audio:hover { transform: scale(1.08); }

        .post-stats {
            display: flex;
            gap: 16px;
            padding: 6px 0 2px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
        }
        .post-stats span { display: flex; align-items: center; gap: 4px; }

        .post-actions {
            display: flex;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 8px;
            margin-top: 4px;
            gap: 4px;
        }
        .post-actions button {
            flex: 1;
            background: none;
            border: none;
            padding: 7px 4px;
            border-radius: 8px;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .post-actions button:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .post-actions button.liked { color: #e74c3c; }
        .post-actions button.liked i { animation: heartPop 0.4s ease; }
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .loading-spinner {
            text-align: center;
            padding: 40px 0;
            color: rgba(255,255,255,0.1);
        }
        .loading-spinner i { font-size: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255,255,255,0.15);
        }
        .empty-state i { font-size: 40px; margin-bottom: 12px; }
        .empty-state h3 { color: rgba(255,255,255,0.3); font-weight: 500; font-size: 16px; }
        .empty-state p { font-size: 13px; margin-top: 4px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 env(safe-area-inset-bottom, 8px) 0;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.25);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 16px;
            transition: color 0.3s;
            position: relative;
            font-family: 'Inter', sans-serif;
        }
        .bottom-nav .nav-item span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .bottom-nav .nav-item.active {
            color: #5850ec;
        }
        .bottom-nav .nav-item:hover { color: rgba(255,255,255,0.6); }
        .bottom-nav .nav-item .badge {
            position: absolute;
            top: -2px;
            right: 6px;
            background: #e74c3c;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .bottom-nav .nav-item .nav-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bottom-nav .nav-item .nav-icon .plus-circle {
            background: linear-gradient(135deg, #5850ec, #764ba2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            margin-top: -14px;
            box-shadow: 0 4px 20px rgba(88,80,236,0.3);
            transition: transform 0.3s;
        }
        .bottom-nav .nav-item .nav-icon .plus-circle:hover {
            transform: scale(1.05);
        }

        .user-card-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .user-card-overlay.active { display: flex; }

        .user-card {
            background: #14141e;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            padding: 28px 24px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            position: relative;
            animation: cardPop 0.3s ease;
        }
        @keyframes cardPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .user-card .close-card {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            font-size: 22px;
            cursor: pointer;
        }
        .user-card .close-card:hover { color: rgba(255,255,255,0.5); }
        .user-card .avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 12px;
            border: 3px solid rgba(255,255,255,0.06);
        }
        .user-card .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-card .avatar-large .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }
        .user-card .name {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .user-card .username {
            font-size: 14px;
            color: rgba(255,255,255,0.3);
        }
        .user-card .bio {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin: 6px 0 14px;
        }
        .user-card .stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 16px;
        }
        .user-card .stats .stat {
            text-align: center;
        }
        .user-card .stats .stat .number {
            font-weight: 700;
            font-size: 17px;
            color: #fff;
        }
        .user-card .stats .stat .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }
        .user-card .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .user-card .card-actions button {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .user-card .card-actions .btn-follow {
            background: #5850ec;
            color: #fff;
        }
        .user-card .card-actions .btn-follow:hover { background: #764ba2; }
        .user-card .card-actions .btn-follow.following {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.4);
        }
        .user-card .card-actions .btn-follow.following:hover {
            background: rgba(231,76,60,0.15);
            color: #e74c3c;
        }
        .user-card .card-actions .btn-profile {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }
        .user-card .card-actions .btn-profile:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .page {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            min-height: 80vh;
        }
        .page.active { display: block; }
        .page .back-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 12px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page .back-btn:hover { color: #fff; }

        .feed-page {
            display: block;
        }
        .feed-page.hidden {
            display: none;
        }

        .create-post-page textarea {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            min-height: 120px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .create-post-page textarea:focus { border-color: #5850ec; }
        .create-post-page .media-actions {
            display: flex;
            gap: 10px;
            margin: 12px 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .create-post-page .media-actions button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 8px 16px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .create-post-page .media-actions button:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .create-post-page .media-status {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }
        .create-post-page .preview-container {
            display: none;
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            max-height: 250px;
            background: rgba(255,255,255,0.02);
        }
        .create-post-page .preview-container img,
        .create-post-page .preview-container video {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
        }
        .create-post-page .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #5850ec, #764ba2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .create-post-page .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(88,80,236,0.25);
        }
        .create-post-page .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .audio-recorder {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
        }
        .audio-recorder .recorder-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .audio-recorder .recorder-controls .record-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #e74c3c;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .audio-recorder .recorder-controls .record-btn:hover { transform: scale(1.05); }
        .audio-recorder .recorder-controls .record-btn.recording {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.4); }

<body>

    <header class="top-bar">
        <div class="logo" onclick="goToFeed()">
            <i class="fas fa-users"></i>
            <span>SocialConnect</span>
        </div>
        <div class="actions">
            <button class="icon-btn" onclick="openNotifications()">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge" style="display:none;">0</span>
            </button>
            <button class="icon-btn" onclick="openFriends()">
                <i class="fas fa-users"></i>
                <span class="badge" id="friendBadge" style="display:none;">0</span>
            </button>
            <div class="avatar-mini" id="userAvatar" onclick="goToMyProfile()">
                <div class="fallback" style="background:#5850ec;"><i class="fas fa-user"></i></div>
            </div>
        </div>
    </header>

    <!-- ===== FEED PAGE ===== -->
    <div class="feed-page" id="feedPage">
        <div class="container">
            <div class="stories-row" id="storiesRow">
                <div class="story-item add-story" onclick="openCreateStory()">
                    <div class="story-circle">
                        <div class="inner"><i class="fas fa-plus"></i></div>
                    </div>
                    <div class="story-name">Seu story</div>
                </div>
            </div>

            <div class="create-post" onclick="goToCreatePost()">
                <div class="avatar-mini" id="createPostAvatar">
                    <div class="fallback" style="background:#5850ec;"><i class="fas fa-user"></i></div>
                </div>
                <input type="text" placeholder="O que você está pensando?" readonly>
            </div>

            <div id="feedPosts">
                <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
            </div>
        </div>
    </div>

    <!-- ===== POST PAGE ===== -->
    <div class="page" id="postPage">
        <button class="back-btn" onclick="goToFeed()"><i class="fas fa-arrow-left"></i> Voltar</button>
        <div id="postPageContent"></div>
    </div>

    <!-- ===== CREATE POST PAGE ===== -->
    <div class="page create-post-page" id="createPostPage">
        <button class="back-btn" onclick="goToFeed()"><i class="fas fa-arrow-left"></i> Voltar</button>
        <h3 style="margin-bottom:16px;font-weight:600;"><i class="fas fa-pen" style="color:#5850ec;margin-right:8px;"></i>Nova publicação</h3>
        <textarea id="createPostContent" placeholder="O que você está pensando?..."></textarea>
        <div class="media-actions">
            <button onclick="document.getElementById('createFileInput').click()"><i class="fas fa-image"></i> Foto/Vídeo</button>
            <button onclick="toggleAudioRecorder()"><i class="fas fa-microphone"></i> Áudio</button>
            <span class="media-status" id="createMediaStatus"></span>
        </div>
        <input type="file" id="createFileInput" accept="image/*,video/*" style="display:none;">
        <div class="preview-container" id="createPreview">
            <img id="createPreviewImg" style="display:none;">
            <video id="createPreviewVideo" style="display:none;" controls></video>
        </div>

        <div class="audio-recorder" id="audioRecorder" style="display:none;">
            <div class="recorder-controls">
                <button class="record-btn" id="recordBtn" onclick="toggleRecording()"><i class="fas fa-microphone"></i></button>
                <span class="timer" id="recordTimer">0:00</span>
                <div class="wave-visual" id="waveVisual">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <div class="controls-group">
                    <button id="pauseBtn" onclick="pauseRecording()" disabled><i class="fas fa-pause"></i></button>
                    <button id="stopBtn" onclick="stopRecording()" disabled><i class="fas fa-stop"></i></button>
                </div>
            </div>
            <div class="audio-preview" id="audioPreview">
                <div class="preview-controls">
                    <button class="play-btn" id="previewPlayBtn" onclick="toggleAudioPreview()"><i class="fas fa-play"></i></button>
                    <span class="preview-timer" id="previewTimer">0:00 / 0:00</span>
                    <div class="preview-wave" id="previewWave">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>

        // ===== TOGGLE LIKE COM VERIFICAÇÃO DE ERRO =====
        window.toggleLike = async function(postId) {
            if (!currentUser) {
                alert('Faça login para curtir');
                return;
            }

            const btn = document.querySelector(`.like-btn[data-post-id="${postId}"]`);
            const countSpan = document.querySelector(`.like-count-${postId}`);
            let count = parseInt(countSpan.textContent) || 0;

            try {
                if (userLikes.has(postId)) {
                    // DESCURTIR
                    const { data, error: selectError } = await supabase
                        .from('likes')
                        .select('id')
                        .eq('post_id', postId)
                        .eq('user_id', currentUser.id)
                        .maybeSingle();

                    if (selectError) {
                        console.error('Erro ao buscar like:', selectError);
                        alert('Erro ao descurtir: ' + selectError.message);
                        return;
                    }

                    if (data) {
                        const { error: deleteError } = await supabase
                            .from('likes')
                            .delete()
                            .eq('id', data.id);

                        if (deleteError) {
                            console.error('Erro ao deletar like:', deleteError);
                            alert('Erro ao descurtir: ' + deleteError.message);
                            return;
                        }
                    }

                    userLikes.delete(postId);
                    btn.classList.remove('liked');
                    btn.innerHTML = '<i class="far fa-heart"></i> Curtir';
                    count = Math.max(0, count - 1);
                    countSpan.textContent = count;
                    
                    const post = posts.find(p => p.id === postId);
                    if (post) post.likes_count = count;

                } else {
                    // CURTIR
                    const { error: insertError } = await supabase
                        .from('likes')
                        .insert({
                            post_id: postId,
                            user_id: currentUser.id
                        });

                    if (insertError) {
                        console.error('Erro ao inserir like:', insertError);
                        alert('Erro ao curtir: ' + insertError.message);
                        return;
                    }

                    userLikes.add(postId);
                    btn.classList.add('liked');
                    btn.innerHTML = '<i class="fas fa-heart"></i> Curtir';
                    count++;
                    countSpan.textContent = count;
                    
                    const post = posts.find(p => p.id === postId);
                    if (post) post.likes_count = count;
                }
            } catch (error) {
                console.error('Erro inesperado ao curtir:', error);
                alert('Erro ao curtir: ' + (error.message || 'Verifique suas permissões.'));
            }
        };

        async function loadStories() {
            const { data, error } = await supabase
                .from('stories')
                .select(`
                    *,
                    profiles:user_id (id, full_name, username, avatar_url, avatar_color)
                `)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao carregar stories:', error);
                return;
            }

            const now = Date.now();
            const validStories = data.filter(s => {
                const storyTime = new Date(s.created_at).getTime();
                return (now - storyTime) < 24 * 60 * 60 * 1000;
            });

            stories = validStories || [];
            renderStories();

        function renderStories() {
            const addStory = storiesRow.querySelector('.add-story');
            storiesRow.innerHTML = '';
            storiesRow.appendChild(addStory);

            const seenUsers = new Set();
            stories.forEach(story => {
                const profile = story.profiles || {};
                if (seenUsers.has(profile.id)) return;
                seenUsers.add(profile.id);

                const avatarUrl = profile.avatar_url;
                const color = profile.avatar_color || '#5850ec';
                const initial = (profile.full_name || 'U')[0].toUpperCase();
                const name = profile.full_name || 'Usuário';

                const div = document.createElement('div');
                div.className = 'story-item';
                div.onclick = () => openStoryViewer(profile.id);
                
                let previewContent = '';
                if (story.media_url && story.media_type === 'image') {
                    previewContent = `<img src="${story.media_url}" alt="Story">`;
                } else if (story.media_url && story.media_type === 'video') {
                    previewContent = `<video src="${story.media_url}" muted style="width:100%;height:100%;object-fit:cover;"></video>`;
                } else if (story.content) {
                    previewContent = `<div class="story-text-preview">${escapeHtml(story.content)}</div>`;
                }

                div.innerHTML = `
                    <div class="story-circle">
                        <div class="inner">
                            ${avatarUrl ? `<img src="${avatarUrl}" alt="Avatar" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;">` : 
                            `<div class="fallback" style="background:${color};position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:0;">${initial}</div>`}
                            <div style="position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;">
                                ${previewContent}
                            </div>
                        </div>
                    </div>
                    <div class="story-name">${name}</div>
                `;
                storiesRow.appendChild(div);
            });
        }

        window.openStoryViewer = function(userId) {

            document.getElementById('storyOverlay').classList.add('active');

        // ===== AUDIO =====
        function resetAudioRecorder() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch(e) {}
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
            mediaRecorder = null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                try { audioContext.close(); } catch(e) {}
                audioContext = null;
            }
            if (previewTimerInterval) {
                clearInterval(previewTimerInterval);
                previewTimerInterval = null;
            }
            if (previewAudio) {
                try { previewAudio.pause(); } catch(e) {}
                previewAudio = null;
            }
            isRecording = false;
            isPaused = false;
            isPlayingPreview = false;
            recordTimer = 0;
            audioChunks = [];
            audioBlob = null;
            audioUrl = null;
            document.getElementById('recordBtn').className = 'record-btn';
            document.getElementById('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('recordTimer').textContent = '0:00';
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('audioPreview').style.display = 'none';
            document.querySelectorAll('#waveVisual .bar').forEach(b => {
                b.style.height = '4px';
                b.classList.remove('active');
            });
        }

        window.toggleAudioRecorder = function() {
            const recorder = document.getElementById('audioRecorder');
            if (recorder.style.display === 'none') {
                recorder.style.display = 'block';
                document.getElementById('createMediaStatus').textContent = '🎤 Clique no microfone para começar';
            } else {
                recorder.style.display = 'none';
                document.getElementById('createMediaStatus').textContent = '';
                resetAudioRecorder();
            }
        };

        window.loadAudioFile = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                document.getElementById('createMediaStatus').textContent = '❌ Arquivo muito grande (máx 10MB)';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const audioData = e.target.result;
                const tempAudio = new Audio(audioData);
                tempAudio.onloadedmetadata = function() {
                    if (tempAudio.duration > 120) {
                        document.getElementById('createMediaStatus').textContent = '❌ Áudio com mais de 2 minutos';
                        return;
                    }
                    
                    audioBlob = file;
                    audioUrl = URL.createObjectURL(file);
                    selectedFile = file;
                    selectedFileType = 'audio';
                    recordTimer = Math.floor(tempAudio.duration);
                    
                    document.getElementById('audioPreview').style.display = 'block';
                    document.getElementById('previewTimer').textContent = formatDuration(recordTimer) + ' / ' + formatDuration(recordTimer);
                    document.getElementById('createMediaStatus').textContent = `🎵 Áudio carregado (${formatDuration(recordTimer)})`;
                    
                    updatePreviewWave();
                };
                tempAudio.src = audioData;
            };
            reader.readAsDataURL(file);
        };

        window.toggleRecording = async function() {
            if (isRecording) {
                stopRecording();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 128;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size > 0) {
                        audioBlob = blob;
                        audioUrl = URL.createObjectURL(blob);
                        selectedFile = blob;
                        selectedFileType = 'audio';
                        document.getElementById('audioPreview').style.display = 'block';
                        document.getElementById('previewTimer').textContent = formatDuration(recordTimer) + ' / ' + formatDuration(recordTimer);
                        document.getElementById('createMediaStatus').textContent = `🎵 Áudio gravado (${Math.round(blob.size/1024)}KB)`;
                        updatePreviewWave();
                    } else {
                        document.getElementById('createMediaStatus').textContent = '⚠️ Gravação vazia, tente novamente';
                    }
                };

                mediaRecorder.start(100);
                isRecording = true;
                isPaused = false;
                recordTimer = 0;
                document.getElementById('recordBtn').className = 'record-btn recording';
                document.getElementById('recordBtn').innerHTML = '<i class="fas fa-stop"></i>';
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('createMediaStatus').textContent = '🔴 Gravando...';

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!isPaused && isRecording) {
                        recordTimer++;
                        document.getElementById('recordTimer').textContent = formatDuration(recordTimer);
                        if (recordTimer >= 120) {
                            stopRecording();
                            document.getElementById('createMediaStatus').textContent = '⏱️ Limite de 2 minutos atingido';
                        }
                    }
                }, 1000);

                updateWaveVisual();

            } catch (err) {
                console.error('Erro ao acessar microfone:', err);
                document.getElementById('createMediaStatus').textContent = '❌ Erro ao acessar microfone';
            }
        };

        function updateWaveVisual() {
            if (!analyser || !dataArray || !isRecording) return;
            
            analyser.getByteFrequencyData(dataArray);
            const bars = document.querySelectorAll('#waveVisual .bar');
            
            bars.forEach((bar, i) => {
                const val = dataArray[i] || 0;
                const height = Math.max(4, (val / 255) * 30);
                bar.style.height = height + 'px';
                bar.classList.toggle('active', val > 50);
            });

            animationId = requestAnimationFrame(updateWaveVisual);
        }

        function updatePreviewWave() {
            const bars = document.querySelectorAll('#previewWave .bar');
            if (window._waveInterval) clearInterval(window._waveInterval);
            window._waveInterval = setInterval(() => {
                bars.forEach(bar => {
                    const height = 4 + Math.random() * 20;
                    bar.style.height = height + 'px';
                    bar.classList.toggle('active', height > 10);
                });
            }, 150);
        }

        window.pauseRecording = function() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
            
            if (isPaused) {
                mediaRecorder.resume();
                isPaused = false;
                document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
                document.getElementById('createMediaStatus').textContent = '🔴 Gravando...';
            } else {
                mediaRecorder.pause();
                isPaused = true;
                document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-play"></i>';
                document.getElementById('createMediaStatus').textContent = '⏸️ Pausado';
            }
        };

        window.stopRecording = function() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try {
                    mediaRecorder.stop();
                } catch(e) {}
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
            
            isRecording = false;
            isPaused = false;
            document.getElementById('recordBtn').className = 'record-btn';
            document.getElementById('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                try { audioContext.close(); } catch(e) {}
                audioContext = null;
            }
            
            if (audioChunks.length === 0) {
                document.getElementById('createMediaStatus').textContent = '⏹️ Gravação finalizada (vazia)';
            } else {
                document.getElementById('createMediaStatus').textContent = '⏹️ Gravação finalizada';
            }
        };

        window.toggleAudioPreview = function() {
            if (!audioUrl) return;

            const playBtn = document.getElementById('previewPlayBtn');
            const timer = document.getElementById('previewTimer');

            if (isPlayingPreview) {
                if (previewAudio) {
                    previewAudio.pause();
                }
                isPlayingPreview = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                if (previewTimerInterval) {
                    clearInterval(previewTimerInterval);
                    previewTimerInterval = null;
                }
                return;
            }

            if (!previewAudio) {
                previewAudio = new Audio(audioUrl);
                previewAudio.onended = () => {
                    isPlayingPreview = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    if (previewTimerInterval) {
                        clearInterval(previewTimerInterval);
                        previewTimerInterval = null;
                    }
                    timer.textContent = formatDuration(recordTimer) + ' / ' + formatDuration(recordTimer);
                };
                previewAudio.onerror = () => {
                    isPlayingPreview = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    document.getElementById('createMediaStatus').textContent = '❌ Erro ao reproduzir áudio';
                };
            }

            previewAudio.play().catch((err) => {
                console.error('Erro ao reproduzir:', err);
                document.getElementById('createMediaStatus').textContent = '❌ Erro ao reproduzir áudio';
            });
            isPlayingPreview = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';

            if (previewTimerInterval) clearInterval(previewTimerInterval);
            previewTimerInterval = setInterval(() => {
                if (previewAudio && !previewAudio.paused) {
                    const current = Math.floor(previewAudio.currentTime);
                    timer.textContent = formatDuration(current) + ' / ' + formatDuration(recordTimer);
                }
            }, 500);
        };

        window.removeAudio = function() {
            if (previewAudio) {
                try { previewAudio.pause(); } catch(e) {}
                previewAudio = null;
            }
            if (previewTimerInterval) {
                clearInterval(previewTimerInterval);
                previewTimerInterval = null;
            }
            if (window._waveInterval) {
                clearInterval(window._waveInterval);
                window._waveInterval = null;
            }
            isPlayingPreview = false;
            resetAudioRecorder();
            selectedFile = null;
            selectedFileType = null;
            document.getElementById('audioPreview').style.display = 'none';
            document.getElementById('audioRecorder').style.display = 'none';
            document.getElementById('createMediaStatus').textContent = '';
            document.getElementById('audioFileInput').value = '';
        };

        window.submitPost = async function() {
            const content = document.getElementById('createPostContent').value.trim();
            if (!content && !selectedFile) {
                document.getElementById('createMediaStatus').textContent = '⚠️ Digite algo ou adicione uma mídia';
                return;
            }

            const btn = document.querySelector('.btn-submit');
            btn.disabled = true;
            btn.textContent = 'Publicando...';

            try {
                let mediaUrl = null;
                let mediaType = null;
                let audioDuration = null;

                if (selectedFile) {
                    const fileExt = selectedFile.name ? selectedFile.name.split('.').pop() : 'webm';
                    const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
                    const bucket = 'posts';

                    const { error: uploadError } = await supabase.storage
                        .from(bucket)
                        .upload(fileName, selectedFile, {
                            cacheControl: '3600',
                            upsert: false
                        });

                    if (uploadError) throw uploadError;
                    const { data: urlData } = supabase.storage
                        .from(bucket)
                        .getPublicUrl(fileName);
                    mediaUrl = urlData.publicUrl;
                    mediaType = selectedFileType;
                    if (selectedFileType === 'audio') audioDuration = recordTimer || 30;
                }

                const { error } = await supabase.from('posts').insert({
                    user_id: currentUser.id,
                    content: content || null,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    audio_duration: audioDuration
                });

                if (error) throw error;

                document.getElementById('createMediaStatus').textContent = '✅ Publicado!';
                resetAudioRecorder();
                setTimeout(() => goToFeed(), 500);

            } catch (error) {
                console.error('Erro ao publicar:', error);
                document.getElementById('createMediaStatus').textContent = '❌ Erro: ' + error.message;
            }

            btn.disabled = false;
            btn.textContent = 'Publicar';
        };

        // ===== NOTIFICATIONS =====
        async function loadNotifications() {
            const { data, error } = await supabase
                .from('notifications')
                .select('id')
                .eq('user_id', currentUser.id)
                .eq('read', false);

            if (error) return;

            const badge = document.getElementById('notifBadge');
            if (data && data.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = data.length > 9 ? '9+' : data.length;
            } else {
                badge.style.display = 'none';
            }
        }

        window.openNotifications = function() {
            window.location.href = 'notificacoes.html';
        };
        
        window.openFriends = function() {
            window.location.href = 'amigos.html';
        };

        window.openMessages = function() {
            window.location.href = 'chat.html';
        };

        // ===== UTILS =====
        function getTimeAgo(date) {
            const diff = Date.now() - new Date(date).getTime();
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'agora';
            if (minutes < 60) return `${minutes}m`;
            if (hours < 24) return `${hours}h`;
            if (days < 7) return `${days}d`;
            return new Date(date).toLocaleDateString('pt-BR');
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== VERIFICAR POST VIA URL =====
        function checkPostFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            if (postId) {
                setTimeout(() => {
                    goToPost(postId);
                }, 500);
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            checkPostFromUrl();
            setInterval(loadNotifications, 30000);
        });

        // Expor funções
        window.goToFeed = goToFeed;
        window.goToPost = goToPost;
        window.goToCreatePost = goToCreatePost;
        window.goToExplore = goToExplore;
        window.goToMyProfile = goToMyProfile;
        window.goToUserProfile = goToUserProfile;
        window.openUserCard = openUserCard;
        window.closeUserCard = closeUserCard;
        window.toggleFollow = toggleFollow;
        window.toggleLike = toggleLike;
        window.togglePageLike = togglePageLike;
        window.submitPageComment = submitPageComment;
        window.sharePost = sharePost;
        window.openStoryViewer = openStoryViewer;
        window.closeStoryViewer = closeStoryViewer;
        window.openCreateStory = openCreateStory;
        window.closeCreateStory = closeCreateStory;
        window.submitStory = submitStory;
        window.toggleAudioRecorder = toggleAudioRecorder;
        window.toggleRecording = toggleRecording;
        window.pauseRecording = pauseRecording;
        window.stopRecording = stopRecording;
        window.toggleAudioPreview = toggleAudioPreview;
        window.removeAudio = removeAudio;
        window.loadAudioFile = loadAudioFile;
        window.submitPost = submitPost;
        window.openNotifications = openNotifications;
        window.openFriends = openFriends;
        window.openMessages = openMessages;

        console.log('✅ SocialConnect Feed carregado!');
    })();
    </script>
