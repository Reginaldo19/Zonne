            function formatDuration(seconds) {
                // ✅ PROTEÇÃO: se for NaN, undefined, null ou negativo → 0:00
                if (seconds === null || seconds === undefined) return '0:00';
                let s = Number(seconds);
                if (!isFinite(s) || isNaN(s) || s < 0) return '0:00';
                s = Math.floor(s);
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return m + ':' + sec.toString().padStart(2, '0');
            }

            function getTimeAgo(date) {
                const diff = Date.now() - new Date(date).getTime();
                const m = Math.floor(diff / 60000),
                    h = Math.floor(diff / 3600000),
                    d = Math.floor(diff / 86400000);
                if (m < 1) return 'agora';
                if (m < 60) return m + 'm';
                if (h < 24) return h + 'h';
                if (d < 7) return d + 'd';
                return new Date(date).toLocaleDateString('pt-BR');
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            // FEED
            // ============================================================
            async function loadFeed() {
                feedPosts.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i></div>';
                const { data, error } = await supabase
                    .from('posts')
                    .select(`
                        *,
                        profiles:user_id (id, full_name, username, avatar_url, avatar_color)
                    `)
                    .neq('user_id', currentUser.id)
                    .order('created_at', { ascending: false })
                    .limit(100);

                if (error) {
                    feedPosts.innerHTML =
                        '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar</h3></div>';
                    return;
                }
                posts = data || [];
                for (let i = 0; i < posts.length; i++) {
                    const { count } = await supabase
                        .from('likes')
                        .select('id', { count: 'exact', head: true })
                        .eq('post_id', posts[i].id);
                    posts[i].likes_count = count || 0;
                }
                posts = shuffleArray(posts);
                await loadUserLikes();
                renderPosts();
                setupMediaObserver();
            }

            function shuffleArray(a) {
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            async function loadUserLikes() {
                if (!currentUser) return;
                const { data, error } = await supabase
                    .from('likes')
                    .select('post_id')
                    .eq('user_id', currentUser.id);
                if (error) return;
                userLikes = new Set(data.map(l => l.post_id));
            }

            function renderPosts() {
                if (posts.length === 0) {
                    feedPosts.innerHTML =
                        '<div class="empty-state"><i class="fas fa-newspaper"></i><h3>Nenhuma publicação</h3><p>Explore e siga outros usuários!</p></div>';
                    return;
                }
                feedPosts.innerHTML = posts.map(post => renderPostCard(post)).join('');
                attachPostEvents();
            }

                const commentCount = post.comments_count || 0;

            // ============================================================
            // PLAYER DE ÁUDIO (CORRIGIDO - sem NaN)
            // ============================================================
            function pauseAllAudioPlayers(except) {
                activeAudioPlayers.forEach(player => {
                    if (player !== except && player.audio && !player.audio.paused) {
                        try {
                            player.audio.pause();
                            player.audio.currentTime = 0;
                        } catch(e) {}
                        if (player.playBtn) player.playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        if (player.disc) player.disc.classList.remove('spinning');
                        if (player.discBadge) player.discBadge.classList.remove('spinning');
                        if (player.fill) player.fill.style.width = '0%';
                        if (player.timeDisplay && player.safeDuration > 0) {
                            player.timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                        }
                    }
                });
            }

            function setupAudioPlayer(config) {
                const { audioUrl, playBtn, progress, fill, timeDisplay, disc, discBadge, declaredDuration } = config;
                if (!audioUrl) return;

                const audio = new Audio();
                audio.preload = 'metadata';
                audio.src = audioUrl;

                const player = {
                    audio,
                    playBtn,
                    fill,
                    timeDisplay,
                    disc,
                    discBadge,
                    progress,
                    safeDuration: declaredDuration || 0
                };
                activeAudioPlayers.add(player);

                // Quando os metadados carregarem, atualiza a duração real
                audio.addEventListener('loadedmetadata', () => {
                    if (isFinite(audio.duration) && audio.duration > 0) {
                        player.safeDuration = audio.duration;
                        if (timeDisplay) {
                            timeDisplay.textContent = '0:00 / ' + formatDuration(audio.duration);
                        }
                    } else {
                        // fallback para a duração declarada no banco
                        if (timeDisplay && player.safeDuration > 0) {
                            timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                        }
                    }
                });

                audio.addEventListener('canplay', () => {
                    if (isFinite(audio.duration) && audio.duration > 0) {
                        player.safeDuration = audio.duration;
                    }
                });

                audio.addEventListener('timeupdate', () => {
                    // ✅ PROTEÇÃO TOTAL contra NaN
                    const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : player.safeDuration;
                    if (!dur || !isFinite(dur) || dur <= 0) {
                        if (timeDisplay) timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                        return;
                    }
                    const pct = (audio.currentTime / dur) * 100;
                    if (isFinite(pct)) {
                        fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
                    }
                    if (timeDisplay) {
                        timeDisplay.textContent = formatDuration(audio.currentTime) + ' / ' + formatDuration(dur);
                    }
                });

                audio.addEventListener('ended', () => {
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    if (disc) disc.classList.remove('spinning');
                    if (discBadge) discBadge.classList.remove('spinning');
                    fill.style.width = '0%';
                    if (timeDisplay) {
                        timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                    }
                });

                audio.addEventListener('error', (e) => {
                    console.error('Erro ao carregar áudio:', audioUrl, e);
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    if (timeDisplay) timeDisplay.textContent = '0:00 / ' + formatDuration(player.safeDuration);
                });

                playBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!audio.paused) {
                        // Pausar
                        audio.pause();
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        if (disc) disc.classList.remove('spinning');
                        if (discBadge) discBadge.classList.remove('spinning');
                    } else {
                        // Pausar todos os outros
                        pauseAllAudioPlayers(player);
                        // Tocar
                        const playPromise = audio.play();
                        if (playPromise && playPromise.catch) {
                            playPromise.catch(err => {
                                console.error('Erro ao tocar áudio:', err);
                                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                            });
                        }
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        if (disc) disc.classList.add('spinning');
                        if (discBadge) discBadge.classList.add('spinning');
                    }
                });

                progress.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dur = (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : player.safeDuration;
                    if (!dur || !isFinite(dur) || dur <= 0) return;
                    const rect = progress.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    if (isFinite(pct)) {
                        audio.currentTime = Math.max(0, Math.min(1, pct)) * dur;
                    }
                });

                return player;
            }

            function attachPostEvents() {
                document.querySelectorAll('.like-btn').forEach(btn => {
                    btn.onclick = () => toggleLike(btn.dataset.postId);
                });

                // Player de áudio com disco (audio-only posts)
                document.querySelectorAll('.audio-player-wrap').forEach(wrap => {
                    const audioUrl = wrap.dataset.audio;
                    const declaredDuration = parseFloat(wrap.dataset.duration) || 0;
                    const playBtn = wrap.querySelector('.play-btn');
                    const progress = wrap.querySelector('.a-progress');
                    const fill = wrap.querySelector('.a-fill');
                    const timeDisplay = wrap.querySelector('.a-time');
                    const disc = wrap.querySelector('.disc');

                    setupAudioPlayer({
                        audioUrl,
                        playBtn,
                        progress,
                        fill,
                        timeDisplay,
                        disc,
                        discBadge: null,
                        declaredDuration
                    });
                });

                // Player de áudio overlay (foto + áudio)
                document.querySelectorAll('.audio-img-overlay .audio-controls').forEach(ctrl => {
                    const audioUrl = ctrl.dataset.audio;
                    const declaredDuration = parseFloat(ctrl.dataset.duration) || 0;
                    const playBtn = ctrl.querySelector('.play-btn');
                    const progress = ctrl.querySelector('.a-progress');
                    const fill = ctrl.querySelector('.a-fill');
                    const timeDisplay = ctrl.querySelector('.a-time');
                    const discBadge = ctrl.closest('.audio-img-overlay')?.querySelector('.audio-disc-badge');

                    setupAudioPlayer({
                        audioUrl,
                        playBtn,
                        progress,
                        fill,
                        timeDisplay,
                        disc: null,
                        discBadge,
                        declaredDuration
                    });
                });
            }

            function setupMediaObserver() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const card = entry.target.closest('.post-card');
                        if (!card) return;
                        const isVisible = entry.isIntersecting;
                        if (!isVisible) {
                            // Pausa todos os áudios do card que saiu da tela
                            card.querySelectorAll('.audio-player-wrap, .audio-img-overlay .audio-controls').forEach(el => {
                                const playBtn = el.querySelector('.play-btn');
                                // Busca o player correspondente no set global
                                activeAudioPlayers.forEach(p => {
                                    if (p.playBtn === playBtn && p.audio && !p.audio.paused) {
                                        p.audio.pause();
                                        p.audio.currentTime = 0;
                                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                                        if (p.disc) p.disc.classList.remove('spinning');
                                        if (p.discBadge) p.discBadge.classList.remove('spinning');
                                        if (p.fill) p.fill.style.width = '0%';
                                        if (p.timeDisplay && p.safeDuration > 0) {
                                            p.timeDisplay.textContent = '0:00 / ' + formatDuration(p.safeDuration);
                                        }
                                    }
                                });
                            });
                        }
                    });
                }, { threshold: 0.3 });

                document.querySelectorAll('.post-card').forEach(card => {
                    observer.observe(card);
                });
            }

            // ============================================================
            // REELS
            // ============================================================
            window.openReels = function(postId) {
                let videoPosts = posts.filter(p => p.media_type === 'video');
                videoPosts = shuffleArray(videoPosts);
                const index = videoPosts.findIndex(p => p.id === postId);
                if (index > 0) {
                    const clicked = videoPosts.splice(index, 1)[0];
                    videoPosts.unshift(clicked);
                }
                reelsPosts = videoPosts;
                currentReelsIndex = 0;
                renderReels();
                document.getElementById('reelsOverlay').classList.add('active');
                pushPage('reels');
            };

            function renderReels() {
                reelsWrapper.innerHTML = '';
                reelsPosts.forEach((post, idx) => {
                    const slide = document.createElement('div');
                    slide.className = 'reels-slide';
                    slide.dataset.index = idx;
                    slide.style.transform = 'translateY(' + (idx * 100) + '%)';
                    slide.innerHTML = createReelsSlide(post, idx);
                    reelsWrapper.appendChild(slide);
                });
                updateReelsPosition();
                setupReelsSwipe();
                attachReelsEvents();
            }

            function createReelsSlide(post, idx) {
                const profile = post.profiles || {};
                const avatarUrl = profile.avatar_url;
                const avatarColor = profile.avatar_color || '#6c63ff';
                const initial = (profile.full_name || 'U')[0].toUpperCase();
                const isLiked = userLikes.has(post.id);
                const likeCount = post.likes_count || 0;
                const commentCount = post.comments_count || 0;
                const caption = post.content || '';

                return `
                    <div class="reels-video-container">
                        <video src="${post.media_url}" playsinline preload="metadata"></video>
                    </div>
                    <button class="reels-close-top" onclick="closeReels()">&times;</button>
                    <div class="reels-bottom">
                        <div class="reels-user">
                            <div class="reels-avatar">
                                ${avatarUrl ? `<img src="${avatarUrl}" alt="Avatar">` :
                                `<div class="fallback" style="background:${avatarColor};">${initial}</div>`}
                            </div>
                            <span class="reels-name">${profile.full_name || 'Usuário'}</span>
                        </div>
                        <div class="reels-caption">${escapeHtml(caption)}</div>
                    </div>
                    <div class="reels-actions">
                        <button class="reels-like-btn ${isLiked ? 'liked' : ''}" data-postid="${post.id}">
                            <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                            <span class="reels-count">${likeCount}</span>
                        </button>
                        <button class="reels-comment-toggle" data-postid="${post.id}">
                            <i class="far fa-comment"></i>
                            <span class="reels-count">${commentCount}</span>
                        </button>
                        <button onclick="sharePost('${post.id}')">
                            <i class="fas fa-share-alt"></i>
                        </button>
                    </div>
                `;
            }

            function updateReelsPosition() {
                const slides = reelsWrapper.querySelectorAll('.reels-slide');
                slides.forEach((slide, idx) => {
                    const offset = idx - currentReelsIndex;
                    slide.style.transform = 'translateY(' + (offset * 100) + '%)';
                });
                slides.forEach((slide, idx) => {
                    const video = slide.querySelector('video');
                    if (video) {
                        if (idx === currentReelsIndex) {
                            video.play().catch(() => {});
                            video.muted = false;
                        } else {
                            video.pause();
                            video.muted = true;
                        }
                    }
                });
            }

            function setupReelsSwipe() {
                const wrapper = reelsWrapper;
                let startY = 0;
                let isDragging = false;

                const handleStart = (y) => {
                    startY = y;
                    isDragging = true;
                };

                const handleMove = (y) => {
                    if (!isDragging) return;
                    const deltaY = y - startY;
                    const maxDrag = 150;
                    const clamped = Math.max(-maxDrag, Math.min(maxDrag, deltaY));
                    const slides = wrapper.querySelectorAll('.reels-slide');
                    slides.forEach((slide) => {
                        const idx = parseInt(slide.dataset.index);
                        const offset = idx - currentReelsIndex;
                        slide.style.transition = 'none';
                        slide.style.transform = 'translateY(' + (offset * 100 + (clamped / window.innerHeight) *
                            100) + '%)';
                    });
                };

                const handleEnd = (y) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const deltaY = y - startY;
                    const threshold = window.innerHeight * 0.2;
                    if (Math.abs(deltaY) > threshold) {
                        if (deltaY < 0 && currentReelsIndex < reelsPosts.length - 1) {
                            currentReelsIndex++;
                        } else if (deltaY > 0 && currentReelsIndex > 0) {
                            currentReelsIndex--;
                        }
                    }
                    const slides = wrapper.querySelectorAll('.reels-slide');
                    slides.forEach((slide) => {
                        slide.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    });
                    updateReelsPosition();
                };

                wrapper.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientY), { passive: true });
                wrapper.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientY), { passive: true });
                wrapper.addEventListener('touchend', (e) => handleEnd(e.changedTouches[0].clientY), { passive: true });

                let mouseDown = false;
                wrapper.addEventListener('mousedown', (e) => { mouseDown = true;
                    handleStart(e.clientY); });
                wrapper.addEventListener('mousemove', (e) => { if (mouseDown) handleMove(e.clientY); });
                wrapper.addEventListener('mouseup', (e) => { if (mouseDown) { mouseDown = false;
                        handleEnd(e.clientY); } });
                wrapper.addEventListener('mouseleave', () => { if (mouseDown) { mouseDown = false;
                        handleEnd(0); } });
            }

            function attachReelsEvents() {
                document.querySelectorAll('.reels-like-btn').forEach(btn => {
                    btn.onclick = async function(e) {
                        e.stopPropagation();
                        const postId = this.dataset.postid;
                        await toggleLike(postId);
                        const post = posts.find(p => p.id === postId);
                        if (post) {
                            const isLiked = userLikes.has(postId);
                            this.classList.toggle('liked', isLiked);
                            this.querySelector('i').className = isLiked ? 'fas fa-heart' : 'far fa-heart';
                            this.querySelector('.reels-count').textContent = post.likes_count || 0;
                        }
                    };
                });

                document.querySelectorAll('.reels-comment-toggle').forEach(btn => {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        const postId = this.dataset.postid;
                        goToPost(postId);
                    };
                });
            }

            window.closeReels = function() {
                document.getElementById('reelsOverlay').classList.remove('active');
                document.querySelectorAll('#reelsWrapper video').forEach(v => v.pause());
                reelsPosts = [];
                currentReelsIndex = 0;
                reelsWrapper.innerHTML = '';
                if (pageHistory[pageHistory.length - 1] === 'reels') pageHistory.pop();

            // ============================================================
            // LIKE
            // ============================================================
            window.toggleLike = async function(postId) {
                if (!currentUser) { alert('Faça login'); return; }
                const btn = document.querySelector('.like-btn[data-post-id="' + postId + '"]');
                const countSpan = document.getElementById('like-count-' + postId);
                let count = parseInt(countSpan ? countSpan.textContent : '0') || 0;
                try {
                    if (userLikes.has(postId)) {
                        const { data } = await supabase
                            .from('likes')
                            .select('id')
                            .eq('post_id', postId)
                            .eq('user_id', currentUser.id)
                            .maybeSingle();
                        if (data) await supabase.from('likes').delete().eq('id', data.id);
                        userLikes.delete(postId);
                        if (btn) {
                            btn.classList.remove('liked');
                            btn.innerHTML = '<i class="far fa-heart"></i>';
                        }
                        count = Math.max(0, count - 1);
                        if (countSpan) {
                            countSpan.textContent = count;
                            countSpan.classList.remove('liked-count');
                        }
                        const post = posts.find(p => p.id === postId);
                        if (post) post.likes_count = count;
                    } else {
                        await supabase.from('likes').insert({ post_id: postId, user_id: currentUser.id });
                        userLikes.add(postId);
                        if (btn) {
                            btn.classList.add('liked');
                            btn.innerHTML = '<i class="fas fa-heart"></i>';
                        }
                        count++;
                        if (countSpan) {
                            countSpan.textContent = count;
                            countSpan.classList.add('liked-count');
                        }
                        const post = posts.find(p => p.id === postId);
                        if (post) post.likes_count = count;

                        if (post && post.user_id !== currentUser.id) {
                            await supabase.from('notifications').insert({
                                user_id: post.user_id,
                                sender_id: currentUser.id,
                                type: 'like',
                                reference_id: postId,
                                content: null,
                                read: false,
                                created_at: new Date().toISOString()
                            });
                            await updateAllBadges();
                        }
                    }
                } catch (e) { console.error(e); }
            };

            window.sharePost = function(postId) {
                const url = window.location.origin + '/post.html?id=' + postId;
                if (navigator.share) {
                    navigator.share({ title: 'Zonne', text: 'Veja esta publicação!', url }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(url).then(() => alert('Link copiado!')).catch(() => alert(
                        'Compartilhe: ' + url));
                }
            };

            // ============================================================
            // EXPLORE
            // ============================================================
            async function loadExplore() {
                const content = document.getElementById('exploreContent');
                content.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i></div>';
                const { data, error } = await supabase
                    .from('posts')
                    .select(`
                        *,
                        profiles:user_id (id, full_name, username, avatar_url, avatar_color)
                    `)
                    .neq('user_id', currentUser.id)
                    .not('media_url', 'is', null)
                    .order('created_at', { ascending: false })
                    .limit(30);
                if (error) {
                    content.innerHTML =
                        '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Erro ao carregar</h3></div>';
                    return;
                }
                explorePosts = data || [];
                if (explorePosts.length === 0) {
                    content.innerHTML =
                        '<div class="empty-state"><i class="fas fa-compass"></i><h3>Nada por aqui</h3><p>Nenhuma publicação com mídia encontrada</p></div>';
                    return;
                }
                for (let i = explorePosts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [explorePosts[i], explorePosts[j]] = [explorePosts[j], explorePosts[i]];
                }
                for (let i = 0; i < explorePosts.length; i++) {
                    const { count } = await supabase
                        .from('likes')
                        .select('id', { count: 'exact', head: true })
                        .eq('post_id', explorePosts[i].id);
                    explorePosts[i].likes_count = count || 0;
                }
                content.innerHTML = `
                    <div class="explore-grid">
                        ${explorePosts.map(post => {
                            const mediaUrl = post.media_url;
                            const isVideo = post.media_type === 'video';
                            const likes = post.likes_count || 0;
                            const comments = post.comments_count || 0;
                            return `
                                <div class="explore-item" onclick="goToPost('${post.id}')">
                                    ${isVideo ? 
                                        `<video src="${mediaUrl}" muted></video>` :
                                        `<img src="${mediaUrl}" alt="Post" loading="lazy">`
                                    }
                                    <div class="explore-overlay">
                                        <span><i class="fas fa-heart"></i> ${likes}</span>
                                        <span><i class="fas fa-comment"></i> ${comments}</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            // ============================================================
            // USER CARD
            // ============================================================

                document.getElementById('userCardOverlay').classList.remove('active');

            window.toggleFollowCard = async function(userId) {
                const btn = document.querySelector('.btn-follow');
                if (!btn) return;
                try {
                    const isFollowing = btn.classList.contains('following');
                    if (isFollowing) {
                        await supabase
                            .from('friends')
                            .delete()
                            .eq('user_id', currentUser.id)
                            .eq('friend_id', userId);
                        btn.classList.remove('following');
                        btn.innerHTML = '<i class="fas fa-plus"></i> Seguir';
                    } else {
                        await supabase.from('friends').insert({
                            user_id: currentUser.id,
                            friend_id: userId
                        });
                        btn.classList.add('following');
                        btn.innerHTML = '<i class="fas fa-check"></i> Seguindo';

                        await supabase.from('notifications').insert({
                            user_id: userId,
                            sender_id: currentUser.id,
                            type: 'follow',
                            reference_id: null,
                            content: null,
                            read: false,
                            created_at: new Date().toISOString()
                        });
                        await updateAllBadges();
                    }
                    const followersSpan = document.getElementById('followersCount');
                    if (followersSpan) {
                        let current = parseInt(followersSpan.textContent) || 0;
                        followersSpan.textContent = isFollowing ? Math.max(0, current - 1) : current + 1;
                    }
                } catch (e) { console.error(e); }

            // ============================================================
            // STORIES
            // ============================================================
            async function loadStories() {
                const { data, error } = await supabase
                    .from('stories')
                    .select(`
                        *,
                        profiles:user_id (id, full_name, username, avatar_url, avatar_color)
                    `)
                    .order('created_at', { ascending: false });

                if (error) { console.error(error); return; }
                const now = Date.now();
                const validStories = data.filter(s => (now - new Date(s.created_at).getTime()) < 24 * 60 * 60 * 1000);
                stories = validStories || [];
                renderStories();
            }

            function renderStories() {
                const addStory = storiesRow.querySelector('.add-story');
                storiesRow.innerHTML = '';
                storiesRow.appendChild(addStory);

                const seenUsers = new Set();
                stories.forEach(story => {
                    const profile = story.profiles || {};
                    if (seenUsers.has(profile.id)) return;
                    seenUsers.add(profile.id);

                    const avatarUrl = profile.avatar_url;
                    const color = profile.avatar_color || '#6c63ff';
                    const initial = (profile.full_name || 'U')[0].toUpperCase();
                    const name = profile.full_name || 'Usuário';

                    const div = document.createElement('div');
                    div.className = 'story-item';
                    div.onclick = () => openStoryFullscreen(profile.id);

                    let previewContent = '';
                    if (story.media_url && story.media_type === 'image') {
                        previewContent = '<img src="' + story.media_url + '" alt="Story">';
                    } else if (story.media_url && story.media_type === 'video') {
                        previewContent =
                            '<video src="' + story.media_url + '" muted style="width:100%;height:100%;object-fit:cover;"></video>';
                    } else if (story.content) {
                        previewContent = '<div class="story-text-preview">' + escapeHtml(story.content) + '</div>';
                    }

                    div.innerHTML = `
                        <div class="story-circle">
                            <div class="inner">
                                ${avatarUrl ? `<img src="${avatarUrl}" alt="Avatar" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;">` : 
                                `<div class="fallback" style="background:${color};position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:0;">${initial}</div>`}
                                <div style="position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;">
                                    ${previewContent}
                                </div>
                            </div>
                        </div>
                        <div class="story-name">${name}</div>
                    `;
                    storiesRow.appendChild(div);
                });
            }

            window.openStoryFullscreen = function(userId) {
                userStories = stories.filter(s => s.user_id === userId);
                if (userStories.length === 0) return;
                currentStoryIndex = 0;
                document.getElementById('storyFullscreen').classList.add('active');
                showStoryFullscreen(currentStoryIndex);
                pushPage('story');
            };

            function showStoryFullscreen(index) {
                const story = userStories[index];
                if (!story) return;

                const profile = story.profiles || {};
                const body = document.getElementById('storyBody');
                const avatar = document.getElementById('storyAvatar');
                const name = document.getElementById('storyName');
                const time = document.getElementById('storyTime');
                const progress = document.getElementById('storyProgress');
                const deleteBtn = document.getElementById('storyDeleteBtn');

                if (story.user_id === currentUser.id) {
                    deleteBtn.style.display = 'inline-block';
                } else {
                    deleteBtn.style.display = 'none';
                }

                if (profile.avatar_url) {
                    avatar.innerHTML = '<img src="' + profile.avatar_url + '" alt="Avatar">';
                } else {
                    const color = profile.avatar_color || '#6c63ff';
                    const initial = (profile.full_name || 'U')[0].toUpperCase();
                    avatar.innerHTML = '<div class="fallback" style="background:' + color + ';">' + initial + '</div>';
                }
                name.textContent = profile.full_name || 'Usuário';
                time.textContent = getTimeAgo(story.created_at);

                let contentHtml = '';
                let captionHtml = '';
                let autoAdvance = true;

                if (story.media_url && story.media_type === 'image') {
                    contentHtml = '<img src="' + story.media_url + '" alt="Story">';
                    if (story.content) {
                        captionHtml = '<div class="story-caption">' + escapeHtml(story.content) + '</div>';
                    }
                } else if (story.media_url && story.media_type === 'video') {
                    contentHtml =
                        '<video id="storyVideo" src="' + story.media_url + '" autoplay muted playsinline></video>';
                    autoAdvance = false;
                    if (story.content) {
                        captionHtml = '<div class="story-caption">' + escapeHtml(story.content) + '</div>';
                    }
                } else if (story.content) {
                    const bgColor = story.background_color || '#1a1a2e';
                    const bgStyle = bgColor.startsWith('gradient') ? 'background: ' + bgColor + ';' :
                        'background: ' + bgColor + ';';
                    contentHtml = `
                        <div class="story-text-container" style="${bgStyle}">
                            <div class="story-text-content">${escapeHtml(story.content)}</div>
                        </div>
                    `;
                } else {
                    contentHtml =
                        '<div class="story-text-container" style="background:#1a1a2e;"><div class="story-text-content">📖</div></div>';
                }
                body.innerHTML = contentHtml + captionHtml;

                progress.innerHTML = userStories.map((_, i) => `
                    <div class="p-bar">
                        <div class="p-fill" style="width: ${i < index ? '100%' : i === index ? '0%' : '0%'};"></div>
                    </div>
                `).join('');

                if (storyInterval) clearInterval(storyInterval);
                const fills = progress.querySelectorAll('.p-fill');
                if (fills[index]) {
                    fills[index].style.transition = 'none';
                    fills[index].style.width = '0%';
                    requestAnimationFrame(() => {
                        fills[index].style.transition = 'width 0.1s linear';
                    });
                }

                if (autoAdvance) {
                    storyInterval = setInterval(() => {
                        if (currentStoryIndex < userStories.length - 1) {
                            currentStoryIndex++;
                            showStoryFullscreen(currentStoryIndex);
                        } else {
                            closeStoryFullscreen();
                        }
                    }, 5000);
                    let elapsed = 0;
                    const interval = setInterval(() => {
                        elapsed += 100;
                        const pct = Math.min(100, (elapsed / 5000) * 100);
                        if (fills[index]) fills[index].style.width = pct + '%';
                        if (elapsed >= 5000) clearInterval(interval);
                    }, 100);
                    window._storyProgressInterval = interval;
                } else {
                    const video = document.getElementById('storyVideo');
                    if (video) {
                        video.addEventListener('loadedmetadata', () => {});
                        video.addEventListener('ended', () => {
                            if (currentStoryIndex < userStories.length - 1) {
                                currentStoryIndex++;
                                showStoryFullscreen(currentStoryIndex);
                            } else {
                                closeStoryFullscreen();
                            }
                        });
                        const updateProgress = () => {
                            if (video && !video.paused && !video.ended) {
                                const pct = (video.currentTime / video.duration) * 100;
                                if (fills[index]) fills[index].style.width = pct + '%';
                                requestAnimationFrame(updateProgress);
                            }
                        };
                        video.addEventListener('play', updateProgress);
                    }
                }
            }

            window.nextStory = function() {
                if (currentStoryIndex < userStories.length - 1) {
                    currentStoryIndex++;
                    showStoryFullscreen(currentStoryIndex);
                }
            };
            window.prevStory = function() {
                if (currentStoryIndex > 0) {
                    currentStoryIndex--;
                    showStoryFullscreen(currentStoryIndex);
                }
            };

            window.closeStoryFullscreen = function() {
                document.getElementById('storyFullscreen').classList.remove('active');
                if (storyInterval) clearInterval(storyInterval);
                if (window._storyProgressInterval) clearInterval(window._storyProgressInterval);
                const video = document.getElementById('storyVideo');
                if (video) video.pause();
                if (pageHistory[pageHistory.length - 1] === 'story') pageHistory.pop();
            };

            window.deleteCurrentStory = async function() {
                const story = userStories[currentStoryIndex];
                if (!story || story.user_id !== currentUser.id) return;
                if (!confirm('Tem certeza que deseja apagar este story?')) return;
                try {
                    const { error } = await supabase
                        .from('stories')
                        .delete()
                        .eq('id', story.id);
                    if (error) throw error;
                    userStories.splice(currentStoryIndex, 1);
                    if (userStories.length === 0) {
                        closeStoryFullscreen();
                        await loadStories();
                    } else {
                        if (currentStoryIndex >= userStories.length) {
                            currentStoryIndex = userStories.length - 1;
                        }
                        showStoryFullscreen(currentStoryIndex);
                    }
                    await loadStories();
                } catch (e) {
                    alert('Erro ao apagar story: ' + e.message);
                }
            };

            window.handleStoryMediaFile = function(event, type) {
                const file = event.target.files[0];

                storyMediaFile = file;
                storyMediaType = type;
                closeStoryCreateOptions();

                const previewContainer = document.getElementById('storyMediaPreviewContent');

                    previewContainer.innerHTML = '';

                    video.controls = true;
                    video.autoplay = false;
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'contain';

            window.closeStoryMediaPreview = function() {

                storyMediaType = null;
                document.getElementById('storyMediaPreviewContent').innerHTML = '';

            window.publishStoryMedia = async function() {
                if (!storyMediaFile) return;
                const caption = document.getElementById('storyMediaCaption').value.trim();

                const btn = document.querySelector('.story-media-preview .btn-publish-media');
                btn.disabled = true;
                btn.textContent = 'Publicando…';

                try {
                    const fileExt = storyMediaFile.name.split('.').pop();
                    const fileName = currentUser.id + '-story-' + Date.now() + '.' + fileExt;
                    const { error: uploadError } = await supabase.storage
                        .from('stories')
                        .upload(fileName, storyMediaFile, { cacheControl: '3600' });
                    if (uploadError) throw uploadError;
                    const { data: urlData } = supabase.storage
                        .from('stories')
                        .getPublicUrl(fileName);
                    const mediaUrl = urlData.publicUrl;
                    const mediaType = storyMediaType;

                    const { error } = await supabase.from('stories').insert({
                        user_id: currentUser.id,
                        content: caption || null,
                        media_url: mediaUrl,
                        media_type: mediaType,
                        background_color: null
                    });
                    if (error) throw error;

                    closeStoryMediaPreview();
                    await loadStories();
                } catch (error) {
                    alert('Erro: ' + error.message);
                }
                btn.disabled = false;
                btn.textContent = 'Publicar';
            };

            // ============================================================
            // MENÇÕES
            // ============================================================
            const mentionInput = document.getElementById('mentionInput');
            const mentionDropdown = document.getElementById('mentionDropdown');

            window.filterMentions = function(query) {
                const trimmed = query.trim().toLowerCase();
                if (trimmed.length < 1) {

                        `<div class="fallback" style="background:${f.avatar_color || '#6c63ff'};">${(f.full_name || 'U')[0]}</div>`}

            // ============================================================
            // ÁUDIO - GRAVAÇÃO
            // ============================================================
            const MAX_AUDIO_DURATION = 90;

            window.toggleAudioSelector = function() {
                const sel = document.getElementById('audioSelector');
                sel.style.display = sel.style.display === 'none' ? 'block' : 'none';
                if (sel.style.display === 'none') {
                    resetAudioRecorder();
                    document.getElementById('audioRecorder').style.display = 'none';
                }
                document.querySelectorAll('.media-btn').forEach(b => b.classList.remove('active'));
                if (sel.style.display === 'block') {
                    document.querySelectorAll('.media-btn')[2].classList.add('active');
                }
            };

            window.showAudioRecorder = function() {
                document.getElementById('audioRecorder').style.display = 'block';
            };

            window.handleAudioFileSelect = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) {
                    document.getElementById('createMediaStatus').textContent = '❌ Arquivo muito grande (máx 10MB)';
                    return;
                }
                const tempAudio = new Audio(URL.createObjectURL(file));
                tempAudio.onloadedmetadata = () => {
                    const dur = Math.floor(tempAudio.duration);
                    if (dur > MAX_AUDIO_DURATION) {
                        document.getElementById('createMediaStatus').textContent =
                            '❌ Áudio excede 1min30s (atual: ' + formatDuration(dur) + ')';
                        return;
                    }
                    selectedAudioFile = file;
                    audioUrl = URL.createObjectURL(file);
                    recordTimer = dur;
                    document.getElementById('createMediaStatus').textContent =
                        '🎵 Áudio carregado (' + formatDuration(dur) + ')';
                    document.getElementById('audioSelector').style.display = 'none';
                };
            };

            function resetAudioRecorder() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    try { mediaRecorder.stop(); } catch (e) {}
                    if (mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(t => t.stop());
                }
                mediaRecorder = null;
                if (timerInterval) clearInterval(timerInterval);
                if (animationId) cancelAnimationFrame(animationId);
                if (audioContext && audioContext.state !== 'closed') try { audioContext.close(); } catch (e) {}
                audioContext = null;
                isRecording = false;
                isPaused = false;
                recordTimer = 0;
                audioChunks = [];
                const recordBtn = document.getElementById('recordBtn');
                if (recordBtn) {
                    recordBtn.className = 'record-btn';
                    recordBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                }
                document.getElementById('recordTimer').textContent = '0:00';
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('stopBtn').disabled = true;
                document.querySelectorAll('#waveVisual .bar').forEach(b => {
                    b.style.height = '4px';
                    b.classList.remove('active');
                });
            }

            window.toggleRecording = async function() {
                if (isRecording) { stopRecording(); return; }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 128;
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event
                        .data); };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (blob.size > 0) {
                            selectedAudioFile = blob;
                            audioUrl = URL.createObjectURL(blob);
                            document.getElementById('createMediaStatus').textContent =
                                '🎵 Áudio gravado (' + Math.round(blob.size / 1024) + 'KB)';
                        } else {
                            document.getElementById('createMediaStatus').textContent = '⚠️ Gravação vazia';
                        }
                        document.getElementById('audioRecorder').style.display = 'none';
                    };
                    mediaRecorder.start(100);
                    isRecording = true;
                    isPaused = false;
                    recordTimer = 0;
                    document.getElementById('recordBtn').className = 'record-btn recording';
                    document.getElementById('recordBtn').innerHTML = '<i class="fas fa-stop"></i>';
                    document.getElementById('pauseBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = false;
                    document.getElementById('createMediaStatus').textContent = '🔴 Gravando…';
                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        if (!isPaused && isRecording) {
                            recordTimer++;
                            document.getElementById('recordTimer').textContent = formatDuration(recordTimer);
                            if (recordTimer >= MAX_AUDIO_DURATION) {
                                stopRecording();
                                document.getElementById('createMediaStatus').textContent =
                                    '⏱️ Limite de 1min30s atingido';
                            }
                        }
                    }, 1000);
                    updateWaveVisual();
                } catch (err) {
                    document.getElementById('createMediaStatus').textContent = '❌ Erro ao acessar microfone';
                }
            };

            function updateWaveVisual() {
                if (!analyser || !dataArray || !isRecording) return;
                analyser.getByteFrequencyData(dataArray);
                const bars = document.querySelectorAll('#waveVisual .bar');
                bars.forEach((bar, i) => {
                    const val = dataArray[i] || 0;
                    const height = Math.max(4, (val / 255) * 30);
                    bar.style.height = height + 'px';
                    bar.classList.toggle('active', val > 50);
                });
                animationId = requestAnimationFrame(updateWaveVisual);
            }

            window.pauseRecording = function() {
                if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
                if (isPaused) {
                    mediaRecorder.resume();
                    isPaused = false;
                    document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
                    document.getElementById('createMediaStatus').textContent = '🔴 Gravando…';
                } else {
                    mediaRecorder.pause();
                    isPaused = true;
                    document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-play"></i>';
                    document.getElementById('createMediaStatus').textContent = '⏸️ Pausado';
                }
            };

            window.stopRecording = function() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    try { mediaRecorder.stop(); } catch (e) {}
                    if (mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(t => t.stop());
                }
                isRecording = false;
                isPaused = false;
                document.getElementById('recordBtn').className = 'record-btn';
                document.getElementById('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('stopBtn').disabled = true;
                if (timerInterval) clearInterval(timerInterval);
                if (animationId) cancelAnimationFrame(animationId);
                if (audioContext && audioContext.state !== 'closed') try { audioContext.close(); } catch (e) {}
                audioContext = null;
                document.getElementById('createMediaStatus').textContent = '⏹️ Gravação finalizada';
                document.getElementById('audioRecorder').style.display = 'none';
            };

            window.confirmAudio = function() {
                if (selectedAudioFile) {
                    document.getElementById('audioSelector').style.display = 'none';
                    document.getElementById('createMediaStatus').textContent =
                        '🎵 Áudio pronto (' + formatDuration(recordTimer) + ')';
                } else {
                    document.getElementById('createMediaStatus').textContent = '⚠️ Nenhum áudio gravado';
                }
            };

            window.cancelAudio = function() {
                resetAudioRecorder();
                document.getElementById('audioRecorder').style.display = 'none';
                document.getElementById('createMediaStatus').textContent = '';
            };

            // ============================================================
            // IMAGEM / VÍDEO
            // ============================================================
            window.handleFileSelect = function(event, type) {
                const file = event.target.files[0];
                if (!file) return;

                const preview = document.getElementById('createPreview');
                const img = document.getElementById('createPreviewImg');
                const video = document.getElementById('createPreviewVideo');

                document.querySelectorAll('.media-btn').forEach(b => b.classList.remove('active'));

                if (type === 'image') {
                    selectedImageFile = file;
                    document.querySelectorAll('.media-btn')[0].classList.add('active');
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        img.src = ev.target.result;
                        img.style.display = 'block';
                        video.style.display = 'none';
                        preview.style.display = 'block';
                        document.getElementById('createMediaStatus').textContent = '📷 Imagem selecionada';
                    };
                    reader.readAsDataURL(file);
                } else if (type === 'video') {
                    selectedVideoFile = file;
                    document.querySelectorAll('.media-btn')[1].classList.add('active');
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        video.src = ev.target.result;
                        video.style.display = 'block';
                        img.style.display = 'none';
                        preview.style.display = 'block';
                        document.getElementById('createMediaStatus').textContent = '🎬 Vídeo selecionado';
                    };
                    reader.readAsDataURL(file);
                }
                document.getElementById('audioSelector').style.display = 'none';
            };

            // ============================================================
            // SUBMIT POST
            // ============================================================
            window.submitPost = async function() {
                const content = document.getElementById('createPostContent').value.trim();
                if (!content && !selectedImageFile && !selectedAudioFile && !selectedVideoFile) {
                    document.getElementById('createMediaStatus').textContent = '⚠️ Digite algo ou adicione uma mídia';
                    return;
                }
                const btn = document.querySelector('.create-post-page .btn-submit');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publicando…';

                try {
                    let mediaUrl = null,
                        mediaType = null,
                        audioUrl = null,
                        audioDuration = null;

                    if (selectedImageFile) {
                        const fileExt = selectedImageFile.name.split('.').pop();
                        const fileName = currentUser.id + '-' + Date.now() + '-img.' + fileExt;
                        const { error: uploadError } = await supabase.storage
                            .from('posts')
                            .upload(fileName, selectedImageFile, { cacheControl: '3600' });
                        if (uploadError) throw new Error('Falha ao enviar imagem: ' + uploadError.message);
                        const { data: urlData } = supabase.storage
                            .from('posts')
                            .getPublicUrl(fileName);
                        mediaUrl = urlData.publicUrl;
                        mediaType = 'image';
                    }

                    if (selectedVideoFile) {
                        const fileExt = selectedVideoFile.name.split('.').pop();
                        const fileName = currentUser.id + '-' + Date.now() + '-vid.' + fileExt;
                        const { error: uploadError } = await supabase.storage
                            .from('posts')
                            .upload(fileName, selectedVideoFile, { cacheControl: '3600' });
                        if (uploadError) throw new Error('Falha ao enviar vídeo: ' + uploadError.message);
                        const { data: urlData } = supabase.storage
                            .from('posts')
                            .getPublicUrl(fileName);
                        mediaUrl = urlData.publicUrl;
                        mediaType = 'video';
                    }

                    if (selectedAudioFile) {
                        const fileExt = selectedAudioFile.name ? selectedAudioFile.name.split('.').pop() : 'webm';
                        const fileName = currentUser.id + '-' + Date.now() + '-audio.' + fileExt;
                        const { error: uploadError } = await supabase.storage
                            .from('posts')
                            .upload(fileName, selectedAudioFile, { cacheControl: '3600' });
                        if (uploadError) throw new Error('Falha ao enviar áudio: ' + uploadError.message);
                        const { data: urlData } = supabase.storage
                            .from('posts')
                            .getPublicUrl(fileName);
                        audioUrl = urlData.publicUrl;
                        audioDuration = recordTimer || 0;
                    }

                    const postData = {
                        user_id: currentUser.id,
                        content: content || null,
                        media_url: mediaUrl,
                        media_type: mediaType,
                        audio_url: audioUrl,
                        audio_duration: audioDuration,
                        background_color: null,
                        feeling: null
                    };

                    if (audioUrl && !mediaUrl) {
                        postData.media_url = audioUrl;
                        postData.media_type = 'audio';
                        postData.audio_url = null;
                    }

                    const { data: post, error } = await supabase.from('posts').insert(postData).select().single();

                    if (error) throw error;

                    if (content) {
                        const mentions = content.match(/@([a-zA-Z0-9_]+)/g);
                        if (mentions) {
                            for (const mention of mentions) {
                                const username = mention.substring(1);
                                const profile = friendsList.find(f => f.username === username);
                                if (profile && profile.id !== currentUser.id) {
                                    await sendMentionNotification(profile.id, post.id);
                                }
                            }
                        }
                    }

                    document.getElementById('createMediaStatus').textContent = '✅ Publicado!';
                    resetAudioRecorder();
                    document.getElementById('createPostContent').value = '';
                    document.getElementById('createPreview').style.display = 'none';
                    document.getElementById('createPreviewImg').style.display = 'none';
                    document.getElementById('createPreviewVideo').style.display = 'none';
                    document.getElementById('createImageInput').value = '';
                    document.getElementById('createVideoInput').value = '';
                    document.getElementById('createAudioInput').value = '';
                    selectedImageFile = null;
                    selectedAudioFile = null;
                    selectedVideoFile = null;
                    audioBlob = null;
                    audioUrl = null;
                    document.querySelectorAll('.media-btn').forEach(b => b.classList.remove('active'));
                    setTimeout(() => goToFeed(), 500);
                } catch (error) {
                    console.error('Erro ao publicar:', error);
                    document.getElementById('createMediaStatus').textContent = '❌ Erro: ' + error.message;
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Publicar';
            };

            // ============================================================
            // NAVEGAÇÃO EXTERNA
            // ============================================================
            window.openNotifications = () => window.location.href = 'notificacoes.html';
            window.openFriends = () => window.location.href = 'amigos.html';
            window.openMessages = () => window.location.href = 'chat.html';

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', () => {
                checkAuth();
                setInterval(loadNotifications, 30000);
                setInterval(updateMessageBadge, 15000);
            });
        })();
    </script>
</body>
</html>
